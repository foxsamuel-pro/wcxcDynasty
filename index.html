<html lang="en">
<head>

<!-- Link previews: what a pasted link looks like in a group chat. og:image is the
     league crest off Sleeper's CDN; drop an og.png in this folder and point at it
     instead if you ever want a designed 1200x630 card. -->
<meta property="og:site_name" content="WCXC Dynasty">
<meta property="og:title" content="WCXC Dynasty">
<meta property="og:description" content="Power rankings, playoff odds and news — voted on by the twelve managers, every week.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://wcxcdynasty.site/">
<meta property="og:image" content="https://sleepercdn.com/avatars/aaaec022297bb5d7332893d529d8dc18">
<meta property="og:image:alt" content="WCXC Dynasty league crest">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="WCXC Dynasty">
<meta name="twitter:description" content="Power rankings, playoff odds and news — voted on by the twelve managers, every week.">
<meta name="twitter:image" content="https://sleepercdn.com/avatars/aaaec022297bb5d7332893d529d8dc18">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* One dark palette, not a light theme with a dark variant: the site is a
   scoreboard and a sportsbook, and both read better on black. Surfaces step
   --bg (the page) → --panel (a card) → --row (a well inside it) → --row-2 (a
   control), each one lighter than the last, which is what gives depth without
   a single border. */
:root{
  --green:#53d337; --green-ink:#0b1a07; --green-bg:#1d3319; --green-lit:#7fe466;
  --bg:#0b0c0e; --frame:#0e1012; --panel:#17191c; --row:#202327; --row-2:#2a2e33;
  --line:#26292d; --line-2:#202327; --edge:#3a3f45;
  --ink:#f3f4f6; --ink-2:#dfe2e5; --ink-3:#c9cdd2; --muted:#9ba1a8; --dim:#6b7178;
  --gold:#f5c518; --gold-bg:#3a3214; --good:#53d337; --bad:#ff5c5c; --bad-bg:#3a1d1d;
  --hl:#4a3f12;
  /* The accent: anything chosen, clicked or counted. Blue, deliberately kept
     apart from the green below — green here MEANS something (a leg that won, a
     ballot window that is open), so it cannot also mean "this is a button".
     --blue-2 and --blue-soft are the older names for the same two colours. */
  --acc:#5b9ae0; --acc-ink:#06121c; --acc-bg:#1a2e40; --acc-lit:#8fbdee;
  --blue:#17191c; --blue-2:var(--acc); --blue-soft:var(--acc-bg);
  /* charts: emphasis form — one hue + recessive gray. ΔE 34.6, floor 15 (README) */
  --em:#5b9ae0; --ctx:#3f4851;
  --sh:0 1px 2px rgba(0,0,0,.5),0 3px 12px rgba(0,0,0,.35);
  --sh-up:0 -8px 30px rgba(0,0,0,.5);
  --r:16px; --r-sm:10px;
  --head:"Barlow Condensed","Arial Narrow",sans-serif;
  --topgap:env(safe-area-inset-top,0px);
  --nav:240px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:120px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 Figtree,system-ui,"Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}a:hover{color:var(--acc-lit)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
::-webkit-scrollbar{height:6px;width:8px}
::-webkit-scrollbar-thumb{background:var(--row-2);border-radius:8px}

/* The shell: a fixed rail on a desktop, a bottom tab bar on a phone. One grid
   holds both, so there is still only one stylesheet and no second layout. */
.shell{display:grid;grid-template-columns:var(--nav) minmax(0,1fr);min-height:100vh;background:var(--frame)}
.rail{position:sticky;top:0;align-self:start;height:100vh;border-right:1px solid #1d2024;
  padding:24px 14px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px;background:var(--frame)}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px;min-width:0}
.brand img{width:38px;height:38px;border-radius:11px;object-fit:cover;flex:none;background:var(--row-2)}
.brand b{display:block;font:700 23px/1 var(--head);letter-spacing:.3px}
.brand small{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.weekpick{display:flex;flex-direction:column;gap:8px;padding:0 8px}
.wk{position:relative;display:flex}
.wk select{appearance:none;-webkit-appearance:none;width:100%;background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 32px 10px 12px;
  font-size:14px;font-weight:600;cursor:pointer;transition:border-color .12s}
.wk select:hover{border-color:var(--edge)}
.wk::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;margin-top:-5px;
  border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);pointer-events:none}
.wkflag{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted)}
.wkflag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.wkflag.open{color:var(--green)}
.wkflag.open::before{background:var(--green)}
.navlist{display:flex;flex-direction:column;gap:2px}
.tab{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;border-radius:11px;
  background:transparent;color:var(--muted);font-size:15px;font-weight:600;text-align:left;
  transition:background .12s,color .12s}
.tab:hover{background:var(--panel);color:var(--ink)}
.tab svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{background:#1c1f23;color:var(--ink)}
.tab[aria-selected="true"] svg{stroke:var(--acc)}
.tab .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.railfoot{margin-top:auto;padding:0 8px;font-size:11.5px;line-height:1.5;color:var(--dim)}
.topbar{display:none}

main{padding:28px 36px 56px;max-width:1180px;width:100%;margin:0 auto}
.kicker{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin:0 0 4px}
h1{font:700 40px/1.05 var(--head);margin:4px 0 6px;letter-spacing:.2px}
.lede{color:var(--muted);max-width:66ch;margin:0 0 18px;line-height:1.5}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.panel h2{font:700 22px/1.25 var(--head);margin:0;padding:14px 16px 6px;color:var(--ink);letter-spacing:.2px}
.pad{padding:16px}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:800;background:var(--acc);color:var(--acc-ink);
  transition:filter .12s,opacity .12s}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--row-2);font-weight:700}
.btn.ghost:hover:not(:disabled){background:var(--row);filter:none}
.btn.big{padding:15px 22px;font-size:16px}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none;background:var(--row-2)}

/* Segmented control: the sub-views inside a section (Poll's grid and season,
   the Casino's board and tickets) live here rather than on tabs of their own. */
.seg{display:flex;gap:4px;background:var(--panel);border-radius:999px;padding:4px;
  width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none;margin-bottom:18px}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:700;
  white-space:nowrap;background:transparent;color:var(--muted);transition:background .12s,color .12s}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"],.seg button.on{background:var(--ink);color:var(--frame)}
.seg.sunk{background:var(--bg)}

/* The Casino is a sportsbook, so its accent is green: a chosen price reads as
   something going on a slip rather than as navigation. Everywhere else the
   accent stays blue. Both aliases are restated because a custom property is
   substituted where it is declared, so --blue-2 would otherwise keep the
   value it computed on :root. */
main[data-tab="casino"]{
  --acc:var(--green); --acc-ink:var(--green-ink); --acc-bg:var(--green-bg); --acc-lit:var(--green-lit);
  --blue-2:var(--green); --blue-soft:var(--green-bg);
}

/* vote */
.voters{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.vchip{display:flex;align-items:center;gap:9px;text-align:left;background:var(--row);border:2px solid transparent;
  border-radius:9px;padding:8px 10px;min-width:0;transition:border-color .12s,background .12s}
.vchip:hover{border-color:var(--line)}
.vchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.vchip[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-bg)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.slot{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);min-height:46px}
.slot:last-child{border-bottom:0}
.rk{width:26px;text-align:right;font:700 17px var(--head);color:var(--blue-2);flex:none}
.slot .nm{flex:1;min-width:0}
.nm b{display:block;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm i{font-style:normal;color:var(--muted);font-size:12.5px}
.slot.empty .nm{color:var(--muted);font-size:13.5px}
.slot.next{background:var(--acc-bg)}
.slot[draggable="true"]{cursor:grab}
.slot.dragging{opacity:.4}
.slot.over{background:var(--acc-bg);box-shadow:inset 0 2px 0 var(--acc)}
.grab{flex:none;color:var(--muted);font-size:14px;line-height:1;letter-spacing:-2px;user-select:none}
@media (max-width:760px){.grab{display:none}}
.mini{background:none;border:1px solid var(--line);border-radius:4px;width:30px;height:30px;padding:0;color:var(--muted);font-size:13px}
.mini:hover{color:var(--ink)}
.pool{display:flex;flex-direction:column}
.pick{display:flex;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;width:100%}
.pick:hover{background:var(--row)}
.pick .plus{margin-left:auto;color:var(--blue-2);font-weight:700;font-size:20px;line-height:1}
.done{color:var(--muted);padding:16px;text-align:center;font-size:14px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.hint{color:var(--dim);font-size:12.5px;line-height:1.5}
.result{margin-top:16px;border-left:4px solid var(--good)}
.result textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:4px;background:var(--row);padding:10px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}

/* status */
.status{font-size:13.5px;color:var(--good);margin-left:4px}
.status.err{color:#c0392b}

/* tables */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font:700 11.5px Figtree,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);
  text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{padding-left:16px}
th:last-child,td:last-child{padding-right:16px}
td{padding:11px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#1b1e21}
/* the six-team playoff cut, drawn where it actually falls */
tr.cut td{border-bottom:1px dashed var(--edge)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.teamcell{display:flex;align-items:center;gap:11px;min-width:210px}
.teamcell .av{width:36px;height:36px}
.fp{color:var(--muted);font-size:12.5px;margin-left:4px}
.bigrk{width:44px;text-align:left;line-height:1}
.bigrk b{display:block;font:700 24px/1 var(--head);color:var(--ink)}
.bigrk .mv{display:block;margin:2px 0 0;font-size:10.5px}

/* grid */
.grid th.c,.grid td.c{text-align:center;padding:5px 3px;min-width:44px}
.grid td.who{min-width:180px;white-space:nowrap}
.who b{font-weight:500;display:block;font-size:14px}
.who i{font-style:normal;color:var(--muted);font-size:12px}
.cell{display:inline-flex;border-radius:50%;padding:3px;transition:opacity .12s, background .12s}
.cell img{width:34px;height:34px;border-radius:50%;display:block}
.grid.dim .cell{opacity:.18}
.grid.dim .cell.on{opacity:1;background:var(--hl)}
.cell:hover{cursor:pointer}
.lockbar{font-size:13.5px;color:var(--muted);margin:0 0 10px;min-height:20px}
.lockbar b{color:var(--ink)}

/* distribution */
.heat{display:block;min-width:30px;padding:5px 0;border-radius:3px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px}

/* season: bump chart (emphasis form — every team gray, the chosen one in blue) */
.chartwrap{padding:16px 14px 6px}
.bump{width:100%;height:auto;display:block}
.bump .gl{stroke:var(--line);stroke-width:1}
.bump .ctx{fill:none;stroke:var(--ctx);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bump.dim .ctx{stroke-opacity:.5}
.bump .hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.bump .em{fill:none;stroke:var(--em);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.bump .dot{fill:var(--em);stroke:var(--panel);stroke-width:2}
.bump .ax{fill:var(--muted);font:500 11px Figtree,sans-serif}
.bump .lbl{fill:var(--ink);font:700 12px var(--head)}
.bump .lbl.soft{fill:var(--muted);font-weight:500}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:4px;padding:12px 14px;border-top:1px solid var(--line)}
.lg{display:flex;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:6px;padding:5px 7px;text-align:left;min-width:0;font-size:13px}
.lg:hover{background:var(--row)}
.lg[aria-pressed="true"]{border-color:var(--em);background:#1c2633}
.lg .av{width:22px;height:22px}
.lg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.lg b{font:700 12px var(--head);color:var(--muted);flex:none}
.rkcell{display:block;min-width:28px;padding:5px 0;border-radius:3px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px;font-weight:500}

/* voters */
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700;background:var(--row);color:var(--muted)}
.pill.up{background:rgba(31,138,76,.14);color:var(--good)}
.pill.dn{background:rgba(192,57,43,.14);color:#c0392b}

.empty-state{padding:30px 16px;text-align:center;color:var(--muted)}
.empty-state .btn{margin-top:12px}
.waiting{font-size:13.5px;color:var(--muted);margin:10px 0 0}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding:20px}

.authrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.authrow input{border:1px solid var(--line);border-radius:4px;background:var(--row);padding:9px 10px;width:210px;font:inherit;color:inherit}
.linkish{background:none;border:0;padding:0;color:var(--blue-2);font:inherit;text-decoration:underline}
.banner{background:var(--blue-soft);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:16px;font-size:14px}
.banner.err{border-color:#c0392b}
.mv{font-size:11px;font-weight:700;margin-left:6px}
.mv.up{color:var(--green)} .mv.dn{color:var(--bad)} .mv.nw{color:var(--dim);font-weight:600}
.avtxt{display:inline-flex;align-items:center;justify-content:center;font:700 11px Figtree,sans-serif;color:var(--muted)}

/* voter profile */
.phead{display:flex;align-items:center;gap:14px;margin:0 0 16px;flex-wrap:wrap}
.pav{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;background:var(--row)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile b{display:block;font:700 26px/1.1 var(--head);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile b.good{color:var(--good)} .tile b.bad{color:var(--bad)}
.tile span{display:block;font-size:13px;font-weight:600;color:var(--ink)}
.tile i{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.clickrow{cursor:pointer}
.clickrow:hover{background:#1b1e21!important}
.whoclick{cursor:pointer}
.whoclick:hover b{color:var(--blue-2);text-decoration:underline}

/* news */
.feed{display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:15px 17px;cursor:pointer;transition:border-color .12s,transform .12s}
.card:hover{border-color:var(--edge);transform:translateY(-1px)}
.card h3{font:700 19px/1.25 var(--head);margin:4px 0 5px}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .kicker{margin:0;display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-weight:400}
.kbadge{display:inline-block;padding:3px 9px;border-radius:999px;font:700 10.5px/1 Figtree,sans-serif;
  letter-spacing:.5px;text-transform:uppercase;background:var(--row);color:var(--muted)}
.kbadge.k-poll{background:var(--acc-bg);color:var(--acc)}
.kbadge.k-trade{background:rgba(31,138,76,.15);color:var(--good)}
.kbadge.k-match{background:rgba(242,183,5,.18);color:#f2b705}
.kbadge.k-injury{background:rgba(192,57,43,.14);color:var(--over)}
.kbadge.k-recap{background:var(--row);color:var(--muted)}
.kbadge.k-satire{background:rgba(120,80,190,.16);color:#b79bec}
.fiction{margin:18px 0 0;padding:10px 13px;border-left:3px solid rgba(120,80,190,.5);
  background:rgba(120,80,190,.07);border-radius:0 6px 6px 0;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
/* the news archive's two filters: a week picker beside the category chips */
.newsbar{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 12px;margin-bottom:14px}
.newsbar .chips{margin-bottom:0;flex:1 1 320px}
.newswk{flex:none;min-width:158px}
.newswk select{border-radius:999px;padding:8px 32px 8px 15px;font-size:13px;font-weight:700}
.chip{background:var(--row);border:1px solid var(--line);border-radius:999px;padding:7px 14px;
  font:600 13px Figtree,sans-serif;color:var(--muted);transition:all .12s}
.chip:hover{border-color:var(--edge);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--frame)}
.chip i{font-style:normal;opacity:.65;font-size:11.5px;margin-left:2px}
.grouphd{font:700 12.5px var(--head);letter-spacing:.6px;text-transform:uppercase;
  color:var(--muted);margin:18px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.feed + .grouphd{margin-top:22px}
.fig{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.fig.big{gap:22px;margin:16px 0 18px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);justify-content:center}
.figteam{display:flex;align-items:center;gap:8px;min-width:0}
.figteam b{font:600 13px Figtree,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fig.big .figteam{flex-direction:column;gap:7px;text-align:center}
.fig.big .figteam b{font-size:14px;max-width:150px}
.figav{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:var(--row)}
.fig.big .figav{width:62px;height:62px;border:2px solid var(--line)}
.figvs{font:700 13px var(--head);color:var(--muted);letter-spacing:1px;text-transform:uppercase}
/* Desktop reading: a centred column with generous measure and larger type.
   The old full-width card left a short line length stranded on the left of a
   wide screen, which is what made it look unfinished on a PC. */
.story{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:34px 40px 30px;max-width:760px;margin:0 auto}
.story h1{margin:8px 0 10px;font-size:34px;line-height:1.14;letter-spacing:.1px}
.story .lede{font-size:18px;line-height:1.5;color:var(--muted);margin:0 0 4px;max-width:62ch}
.story .kicker{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-weight:400}
.newshd{max-width:760px;margin:0 auto 14px}
.prose{max-width:64ch}
.prose p{margin:0 0 15px;line-height:1.68;font-size:16.5px}
.prose p:first-child{font-size:17.5px;line-height:1.6}
.prose p:last-child{margin-bottom:0}

/* matchup scoreboard */
.box{margin:18px 0 22px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--row)}
.boxhd{margin:0;padding:8px 14px;font:700 11px Figtree,sans-serif;letter-spacing:.7px;text-transform:uppercase;
  color:var(--muted);background:var(--panel);border-bottom:1px solid var(--line)}
.boxgrid{display:grid;grid-template-columns:1fr 1fr}
.boxside{padding:14px 16px}
.boxside+.boxside{border-left:1px solid var(--line)}
.boxside.fav{background:var(--acc-bg)}
.boxteam{display:flex;align-items:center;gap:9px;margin-bottom:11px;min-width:0}
.boxteam b{font:700 14.5px/1.2 var(--head);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.boxav{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none;background:var(--panel)}
.boxnums{display:flex;gap:16px;flex-wrap:wrap}
.boxnums span{display:flex;flex-direction:column;gap:1px}
.boxnums i{font-style:normal;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600}
.boxnums b{font:700 19px/1 var(--head);font-variant-numeric:tabular-nums}
.boxwin b{color:var(--blue-2)}
.winbar{display:block;height:5px;border-radius:3px;background:var(--line);margin-top:11px;overflow:hidden}
.winbar i{display:block;height:100%;background:var(--blue-2)}
.boxnote{margin:0;padding:9px 14px;font-size:12.5px;color:var(--muted);background:var(--panel);border-top:1px solid var(--line)}
.finaltag{display:inline-block;padding:2px 7px;border-radius:4px;background:var(--ink);color:var(--panel);
  font:700 10px Figtree,sans-serif;letter-spacing:.8px;margin-right:4px}
.wontag{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;
  background:var(--good);color:#fff;font:700 11px Figtree,sans-serif;flex:none}

/* a labelled form field: the casino's bet slip */
.pwrap{display:flex;flex-direction:column;gap:3px;font:700 10.5px Figtree,sans-serif;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted)}
.pwrap input{font:400 15px Figtree,sans-serif;padding:7px 9px;border:1px solid var(--line);
  border-radius:6px;background:var(--panel);color:var(--ink);min-width:190px}
@media(max-width:760px){
  .pwrap input{min-width:0;width:100%}
}

.deals{display:grid;gap:11px}
.deal{display:flex;align-items:stretch;gap:12px;flex-wrap:wrap;background:var(--row);border-radius:9px;padding:12px 14px}
.dside{flex:1 1 200px;min-width:0}
.dside b{display:block;font:700 13.5px var(--head);color:var(--blue-2);margin-bottom:5px}
.dside ul{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.dside li{font-size:14px;line-height:1.4}
.dside li::before{content:"+ ";color:var(--good);font-weight:700}
.dside li{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.dvia{font-size:12px;color:var(--muted)}
.dproj{font-size:11.5px;font-weight:700;color:var(--blue-2);background:var(--blue-soft);border-radius:4px;padding:1px 6px;font-variant-numeric:tabular-nums}
/* trade archive — reuses the deals block from trade articles */
.trfilter{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.trfilter label{font:600 12px var(--head);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:7px}
.trfilter select{font:400 14px Figtree,sans-serif;text-transform:none;letter-spacing:0;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 9px;max-width:210px}
.trhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px 0}
.trmargin{font:700 11.5px var(--head);color:var(--blue-2);background:var(--blue-soft);border-radius:4px;padding:2px 7px;letter-spacing:.03em}
.trflag{font:600 11.5px Figtree,sans-serif;color:var(--muted);background:var(--row);border-radius:4px;padding:2px 7px}
.trdeal{background:transparent;padding:0;gap:14px}
.trdeal .dside{background:var(--row);border-radius:9px;padding:12px 14px;border:1px solid transparent}
.trdeal .dside.trwon{border-color:var(--acc);background:var(--acc-bg)}
.trdeal .dside b{display:flex;align-items:center;gap:8px}
.trav{width:26px;height:26px}
.trbadge{font:700 10px var(--head);text-transform:uppercase;letter-spacing:.08em;
  color:#fff;background:var(--blue-2);border-radius:3px;padding:2px 6px}
.trdeal li{justify-content:space-between;gap:10px}
.trdeal li::before{content:none}
.trpts{font-variant-numeric:tabular-nums;font-weight:700;color:var(--blue-2);flex:none;text-align:right}
.trpts i{display:block;font-style:normal;font-size:10.5px;font-weight:500;color:var(--muted)}
.trval{font-size:11px;font-weight:700;font-style:normal;color:var(--blue-2);background:var(--blue-soft);
  border-radius:4px;padding:1px 5px;font-variant-numeric:tabular-nums}
.trsub{display:block;font:400 11.5px Figtree,sans-serif;color:var(--muted);text-transform:none;letter-spacing:0}
.trsplit{font:600 11.5px Figtree,sans-serif;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:1px 7px}
.trbig{font-size:16px;font-variant-numeric:tabular-nums}
.trswing{font-variant-numeric:tabular-nums}
.trswing.up{color:var(--over)}.trswing.down{color:var(--under)}
.trbecame{font-size:12.5px;color:var(--ink);font-style:normal}
.trpending{font-size:12px;color:var(--muted);font-style:normal}
.trchain{font-size:10.5px;font-weight:700;font-style:normal;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.trtotal{margin:9px 0 0;padding-top:8px;border-top:1px solid var(--line);
  font:700 17px var(--head);color:var(--ink);font-variant-numeric:tabular-nums}
.trtotal span{font:400 11.5px Figtree,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
@media (max-width:760px){ .trdeal .dside{flex:1 1 100%} .trhead{padding:10px 12px 0} }
.dswap{align-self:center;color:var(--muted);font-size:17px;flex:none}
@media (max-width:760px){.dswap{display:none}.deal{gap:9px;padding:11px 12px}}

/* comments */
.comments{margin-top:26px;padding-top:20px;border-top:2px solid var(--line)}
.cmthdr{margin:0 0 13px;font:700 12px Figtree,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.cmthdr span{background:var(--row);border-radius:999px;padding:2px 8px;margin-left:5px;letter-spacing:0}
.compose{background:var(--row);border:1px solid var(--line);border-radius:10px;padding:12px 13px;margin-bottom:16px}
.cwho{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:13.5px}
.cwho .av{width:24px;height:24px}
.compose textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel);
  padding:10px 11px;font:inherit;color:inherit;resize:vertical;min-height:72px;line-height:1.5}
.crow{display:flex;align-items:center;gap:11px;margin-top:9px}
.cmtlist{display:grid;gap:11px}
.cmt{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.cmthd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.cmthd .av{width:26px;height:26px}
.cmthd b{font:600 14px Figtree,sans-serif}
.cmthd i{font-style:normal;font-size:12.5px;color:var(--muted)}
.cmtwhen{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.cmtbody{margin:0 0 10px;font-size:15px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.cmtfoot{display:flex;align-items:center;gap:8px}
.vbtn{display:inline-flex;align-items:center;gap:5px;background:var(--row);border:1px solid var(--line);
  border-radius:999px;padding:4px 11px;font:600 12.5px Figtree,sans-serif;color:var(--muted);transition:all .12s}
.vbtn:hover:not(:disabled){border-color:var(--good);color:var(--good)}
.vbtn.dn:hover:not(:disabled){border-color:var(--over);color:var(--over)}
.vbtn.on{background:rgba(31,138,76,.14);border-color:var(--good);color:var(--good)}
.vbtn.dn.on{background:rgba(192,57,43,.14);border-color:var(--over);color:var(--over)}
.vbtn:disabled{opacity:.5;cursor:default}
.cdel{margin-left:auto;font-size:12.5px;color:var(--muted)}
.cdel:hover{color:var(--over)}

/* players to watch */
.watch{margin-top:24px;padding-top:18px;border-top:2px solid var(--line)}
.watchhd{margin:0 0 11px;font:700 12px Figtree,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.watch ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.watch li{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;padding:9px 12px;
  background:var(--row);border-radius:8px;font-size:14.5px}
.watch li b{font-weight:700;font-size:15.5px}
.wrank{font-weight:700;font-size:13px;color:var(--blue-2)}
.wmeta{font-size:12px;color:var(--muted);font-weight:600}
.wteam{font-size:12.5px;color:var(--blue-2);font-weight:600}
.wproj{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.wnote{flex-basis:100%;font-size:13.5px;color:var(--muted);line-height:1.45}

/* analysis: diverging pair, validated on this surface — ΔE 43.1, see README */
:root{ --over:#e66767; --under:#5596dc; }

.ctrls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;margin-bottom:16px}
.ctrls label{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted)}
.ctrls select{appearance:none;-webkit-appearance:none;background:var(--row);color:var(--ink);
  border:1px solid var(--line);border-radius:7px;padding:7px 28px 7px 10px;font:600 13.5px Figtree,sans-serif;
  cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 15px) calc(50% + 1px),calc(100% - 10px) calc(50% + 1px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.ctrls select:hover{border-color:var(--blue-2)}

.gapwrap{display:flex;flex-direction:column;gap:3px}
.gaprow{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(140px,2.4fr) 44px;align-items:center;gap:10px}
.gapname{display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px}
.gapname .av{width:22px;height:22px}
.gapname b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gapbar{position:relative;height:22px;background:var(--row);border-radius:5px;overflow:hidden}
.gapbar i{position:absolute;top:4px;bottom:4px;border-radius:3px;min-width:2px}
.gapbar i.over{background:var(--over)} .gapbar i.under{background:var(--under)}
.gapbar .axis{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line);transform:translateX(-.5px)}
.gapnum{text-align:right;font:700 13px Figtree,sans-serif;font-variant-numeric:tabular-nums;color:var(--muted)}
.gapnum.over{color:var(--over)} .gapnum.under{color:var(--under)}
/* projected points vs the league average: same diverging pair, above is blue */
.subh{display:block;font-style:normal;font-size:10px;font-weight:500;opacity:.62;letter-spacing:.01em;text-transform:none}
.projv{display:block;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.02em}
.projv.hi{color:var(--under)} .projv.lo{color:var(--over)}
.tile b.good{color:var(--good)} .tile b.bad{color:var(--over)}
td b.good{color:var(--good)} td b.bad{color:var(--over)}

.scat{width:100%;height:auto;display:block}
.scat .gl{stroke:var(--line);stroke-width:1}
.scat .ax{fill:var(--muted);font:500 11px Figtree,sans-serif}
.scat .axt{fill:var(--muted);font:600 11.5px Figtree,sans-serif}
.scat .sdot{fill:var(--ctx);stroke:var(--panel);stroke-width:2}
.scat .sdot.over{fill:var(--over)} .scat .sdot.under{fill:var(--under)}
.scat .slbl{fill:var(--ink);font:500 11.5px Figtree,sans-serif}
.bump .zero{stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 3}

/* odds */
.obar{display:inline-block;width:62px;height:6px;border-radius:6px;background:var(--row-2);overflow:hidden;vertical-align:middle;margin-left:7px}
.obar i{display:block;height:100%;background:var(--acc);border-radius:6px}

/* closed-week notice */
.closed{text-align:center;padding:26px 18px}
.closed .big{font:700 17px/1.3 var(--head);margin:0 0 4px}
.roballot{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.roballot:last-child{border-bottom:0}

/* casino: a board of buttons, a bet slip beside it, tickets underneath */
/* the stat tiles and the view switcher under them are two different things; the
   switcher used to sit flush against the tiles (0px) and read as part of them */
main[data-tab="casino"] .tiles{margin-bottom:18px}
.csbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-bottom:18px}
.csbar .seg{margin-bottom:0}
/* is the sync still running? the page says so rather than showing stale scores as live */
.csfresh{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted)}
.csfresh i{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.csfresh.stale{color:var(--gold)}
.csfresh.stale i{background:var(--gold)}
.csgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;margin-top:16px;align-items:start}
/* a column that can shrink: the strip of games to jump to is one long row (sixty college games on a
   Saturday) that scrolls inside itself, and a column sized to it pushed the whole page sideways */
.csgrid>*{min-width:0}
.csslip{position:sticky;top:118px}
.csweek{margin:0;padding:9px 15px;font:700 12px Figtree,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.csgame{border-bottom:1px solid var(--line)}
.csgame:last-child{border-bottom:0}
.cshd{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;padding:8px 14px 0;font-size:12.5px;color:var(--muted)}
.csown{flex-basis:100%;font-size:12px;color:var(--muted);font-style:italic}
.cshd b{color:var(--ink);font:700 13.5px var(--head)}
.cshd .csst{margin-left:auto}
.cschip{font:700 10.5px Figtree,sans-serif;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:2px 6px;background:var(--row);border:1px solid var(--line);color:var(--muted)}
.cschip.live{background:var(--bad);border-color:var(--bad);color:#fff}
.csmk{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr));gap:6px;padding:6px 14px;align-items:center}
.csmk.head{padding-top:6px;padding-bottom:0;font:700 10.5px Figtree,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.csmk.head span:first-child{text-align:left}
.csmk.fan{grid-template-columns:minmax(0,2fr) repeat(2,minmax(0,1fr))}
.csteam{display:flex;align-items:center;gap:11px;min-width:0;font-size:14px;font-weight:700}
.csteam span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csteam .av{width:36px;height:36px}
/* ESPN draws its marks inside a padded square, so the box has to be generous:
   at 46px a logo reads as a logo, at 30px it was a speck. It still fits the 48px
   a price button is tall, so the rows do not grow. */
.csteam .lg{width:46px;height:46px;object-fit:contain;flex:none}
.csteam i{font-style:normal;font-size:11.5px;color:var(--dim);font-weight:500}
/* A price: the point it is at above, what it pays below. Pressed turns green,
   the way a slip selection does everywhere else on the board. */
.odd{border:1px solid transparent;background:var(--row-2);border-radius:10px;padding:5px 4px;font:inherit;color:var(--ink);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.15;min-height:48px;transition:background .12s,border-color .12s}
.odd small{font-size:11.5px;color:var(--muted)}
.odd b{font-size:14.5px;font-weight:800}
.odd:hover:not(:disabled){border-color:var(--edge)}
.odd:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.odd:disabled{opacity:.3;cursor:not-allowed}
.odd[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.odd[aria-pressed="true"] small{color:var(--acc-ink);opacity:.85}     /* was white: 1.7:1 on the casino's green, against 6.9:1 in the ink the price below it uses */
.odd:disabled{opacity:.42;cursor:not-allowed}
.odd.none{border-style:dashed;cursor:default;color:var(--muted);background:transparent}
.csmore{display:block;width:100%;background:#1a1c1f;border:0;border-top:1px solid var(--line);padding:11px;
  color:var(--acc);font-size:13px;font-weight:700;cursor:pointer}
.csmore:hover{background:var(--row)}
.csprops{padding:0 0 8px}
/* a player on his own jersey: his number, his team's colours */
.csplayer{display:flex;align-items:center;gap:11px;margin:14px 14px 4px;font-size:12px;color:var(--muted)}
.csplayer .who{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.csplayer b{font:700 15px var(--head);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csplayer i{font-style:normal;font-weight:600;letter-spacing:.04em}
.jsy{display:block;overflow:visible}
.jsy .jn{font:700 17px var(--head);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke-linejoin:round}
.jsw{width:46px;height:46px;border-radius:12px;background:var(--row-2);display:flex;align-items:center;justify-content:center;flex:none}
.csprop{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(2,minmax(0,1fr));gap:6px;padding:3px 14px;align-items:center;font-size:13.5px}
.csprop .nm{min-width:0;color:var(--muted)}
.csladder{display:flex;flex-wrap:wrap;gap:6px;padding:4px 14px;align-items:center}
.csladder .lbl{flex:0 0 100%;font-size:12.5px;color:var(--muted)}
.csladder .odd{flex:0 0 auto;min-width:70px;padding:5px 9px}
/* ---- finding a bet ----
   The section tabs stick to the top of the screen (under the top bar on a
   phone), so changing section never needs a scroll back up. The search box is
   16px so iOS doesn't zoom the page when it is tapped. */
.cssport{position:sticky;top:0;z-index:15;display:flex;gap:6px;margin:0 0 12px;padding:8px 0;background:var(--frame);overflow-x:auto;scrollbar-width:none}
.cssport::-webkit-scrollbar{display:none}
.cssport button{flex:1 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink-3);border-radius:999px;padding:8px 15px;font:700 14px Figtree,sans-serif;cursor:pointer}
.cssport button i{font-style:normal;font-size:11.5px;font-weight:800;color:var(--muted);background:var(--row-2);border-radius:999px;padding:1px 7px}
.cssport button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.cssport button[aria-selected="true"] i{background:rgba(0,0,0,.18);color:var(--acc-ink)}
.csfind{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px 6px}
.csq{flex:1 1 220px;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;background:var(--row);border:1px solid var(--line);border-radius:12px}
.csq:focus-within{border-color:var(--acc)}
.csq svg{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;flex:none}
.csq input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 16px Figtree,sans-serif;padding:10px 0;outline:none}
.cscfb select{min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--row);color:var(--ink);font:600 14px Figtree,sans-serif;padding:0 10px}
/* every game on the list, to jump straight to one: a strip on a phone, an index on a desktop */
.csjump{display:flex;gap:8px;padding:6px 14px 12px;overflow-x:auto;border-bottom:1px solid var(--line)}
.csjump button{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 10px;border:1px solid var(--line);
  background:var(--row);color:var(--ink);border-radius:10px;cursor:pointer;text-align:left}
.csjump button:hover{border-color:var(--edge)}
.csjump b{font:700 13.5px var(--head);white-space:nowrap}
.csjump i{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap}
@media (min-width:761px){ .csjump{flex-wrap:wrap;overflow:visible} }
.csday{margin:0;padding:9px 15px 1px;font:700 12px Figtree,sans-serif;color:var(--ink-3)}
.csrk{font:700 11px Figtree,sans-serif;color:var(--muted);margin-right:5px;font-style:normal}
.csteam b{font-weight:inherit}
.csteam .na{display:none}
@container (max-width:479px){ .csgame .csteam .nf{display:none} .csgame .csteam .na{display:inline} }
/* and a narrow college card gives the name more of the row: smaller marks, a wider column, the abbreviation
   never broken across two lines (a phone rule lets names wrap anywhere, which split "WAS-H"), and below
   340px no room for the ranking at all, which the Top 25 filter already implies */
@container (max-width:479px){ .csgame.cfb .csmk{grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr))} .csgame.cfb .csteam{gap:6px} .csgame.cfb .csteam .lg{width:30px;height:30px} .csgame.cfb .csteam span{white-space:nowrap;overflow-wrap:normal} }
@container (max-width:339px){ .csgame.cfb .csteam .csrk{display:none} }
/* the drawer shows one kind of prop at a time */
.cscat{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:10px 14px 2px}
.cscat button{min-height:36px;border:1px solid var(--line);background:var(--row);color:var(--ink-3);border-radius:999px;padding:6px 13px;font:700 13px Figtree,sans-serif;cursor:pointer}
.cscat button[aria-pressed="true"],.cscat button.on{background:var(--ink);border-color:var(--ink);color:var(--frame)}
.cscat .hint{font-size:12px}
.csfound{display:grid;gap:6px;padding:2px 14px 12px;border-bottom:1px solid var(--line)}
.csfound .lbl{margin:4px 0 0;font:700 10.5px Figtree,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.csfound button{display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--line);background:var(--row);border-radius:12px;color:var(--ink);cursor:pointer;text-align:left}
.csfound button span{display:flex;flex-direction:column;min-width:0}
.csfound b{font:700 14.5px var(--head)}
.csfound i{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* futures: one row per team, its price (or its yes and no) on the right */
.csfut h3{margin:0;padding:13px 15px 5px;font:700 16px var(--head);letter-spacing:.02em}
.csfmk{border-top:1px solid var(--line);padding-bottom:8px}
.csfmk:first-of-type{border-top:0}
.csfrow{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:8px;align-items:center;padding:4px 15px}
.csfrow.two,.csfrow.head{grid-template-columns:minmax(0,1fr) 84px 84px}
.csfrow.head{padding-top:0;padding-bottom:0;font:700 10.5px Figtree,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.csfwho{display:flex;align-items:center;gap:10px;min-width:0}
.csfwho .av{width:32px;height:32px}
.csfwho .flg{width:36px;height:36px;object-fit:contain;flex:none}
.csfwho .nm{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.csfwho b{font:700 14.5px var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csfwho i{font-style:normal;font-size:12px;color:var(--muted)}
.csfdiv{margin:8px 15px 2px;font:700 12px Figtree,sans-serif;color:var(--ink-3)}
.csfnote{margin:4px 15px 10px}
.tkfut{margin:-4px 0 6px 66px;font-size:12px;color:var(--muted)}
.slipleg{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.slipleg .nm{flex:1;min-width:0;font-size:13.5px;line-height:1.35}
.slipleg .nm b{display:block;font:700 14px var(--head)}
.slipleg .nm i{font-style:normal;color:var(--muted);font-size:12px}
.slipleg .nm em{font-style:normal;color:var(--bad);font-size:12px;display:block}
.slipnum{font:700 14.5px var(--head);font-variant-numeric:tabular-nums;white-space:nowrap}
.csform{display:grid;gap:10px;margin-top:12px}
.csform .pwrap input,.csform .pwrap select{min-width:0;width:100%;font:400 15px Figtree,sans-serif;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.cscalc{display:grid;grid-template-columns:1fr auto;gap:3px 10px;margin-top:12px;font-size:13.5px}
.cscalc b{font:700 15px var(--head);text-align:right;font-variant-numeric:tabular-nums}
.cswarn{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:3px}
.cswarn li{color:var(--bad);font-size:12.5px}
.csmsg{margin:10px 0 0;font-size:13.5px}
.csmsg.err{color:var(--bad)} .csmsg.ok{color:var(--good)}
.csbal{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.csbal b{font:700 18px var(--head);color:var(--ink)}
.csfeed{display:grid;gap:9px}
/* ---- a ticket, in the shape a sportsbook uses ---- */
.tkfilters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.tkfilters .seg{margin-bottom:0}
.tkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(380px,100%),1fr));gap:16px;align-items:start}
.tk{background:#1c1e21;border:1px solid var(--line);border-radius:22px;overflow:hidden}
.tkhd{padding:18px 18px 4px}
.tkwho{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:13px}
.tkwho span{color:var(--dim)}
.tkav{width:22px;height:22px;border-radius:50%;object-fit:cover;flex:none;background:var(--row-2)}
.tktop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tkttl{font-size:19px;font-weight:800}
.tkbar2{width:2px;height:16px;background:var(--edge);border-radius:2px;flex:none}
.tksgp{border:1.5px solid var(--acc);color:var(--acc);border-radius:6px;padding:1px 6px;
  font-size:12px;font-weight:800;letter-spacing:.3px;flex:none}
.tkst{margin-left:auto;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800;flex:none;
  background:var(--row-2);color:var(--muted)}
.tkst.open,.tkst.pending{background:var(--gold-bg);color:var(--gold)}
.tkst.won{background:var(--green-bg);color:var(--green)}
.tkst.lost{background:var(--bad-bg);color:var(--bad)}
.tksum{font-size:13px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkmoney{display:flex;align-items:baseline;gap:12px;margin-top:14px;flex-wrap:wrap;font-size:18px}
.tkmoney span{color:var(--muted)}
.tkmoney b{color:var(--ink)}
.tkmoney b.win{color:var(--green)}
.tknote{font-size:12.5px;color:var(--muted);margin-top:8px}
.tkbody{padding:8px 18px 4px;display:flex;flex-direction:column}
.tkleg{display:flex;align-items:center;gap:12px;padding:8px 0}
.tkmark{width:38px;height:38px;border-radius:11px;background:var(--row-2);display:flex;
  align-items:center;justify-content:center;flex:none}
.tkmark.win{background:var(--green-bg)} .tkmark.loss{background:var(--bad-bg)}
.tkmark svg{width:22px;height:22px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tkmark svg.ok{stroke:var(--green)} .tkmark svg.no{stroke:var(--bad)}
.tkmark svg.mid{stroke:var(--muted)} .tkmark svg.wait{stroke:var(--gold);stroke-width:2}
.tkart{width:54px;height:54px;border-radius:13px;background:var(--row-2);display:flex;align-items:center;
  justify-content:center;flex:none;overflow:hidden}
.tkart img{width:44px;height:44px;object-fit:contain}
.tkart .tkav{width:54px;height:54px;border-radius:13px}
.tkart.sm{width:40px;height:40px;border-radius:10px}
.tkart.sm img{width:34px;height:34px}
.tkart.sm .tkav{width:40px;height:40px;border-radius:10px}
.tkany{font-style:normal;font:700 20px var(--head);color:var(--muted)}
.tktxt{min-width:0;flex:1}
.tktxt b{display:block;font-size:17px;font-weight:800}
.tktxt i{display:block;font-style:normal;font-size:14px;color:var(--muted);font-weight:600}
.tkprice{font-size:15px;font-weight:800;flex:none}
/* how far a prop has got, against the line it was taken at */
.tkprog{position:relative;height:42px;margin:2px 0 10px 104px}
.tkbar{position:absolute;left:0;right:0;top:10px;height:10px;border-radius:10px;background:var(--row-2);overflow:hidden}
.tkbar i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#1f4d1a,var(--green));transition:width .8s ease}
.tkprog.lost .tkbar i{background:linear-gradient(90deg,#4a2121,var(--bad))}
.tktick{position:absolute;top:5px;width:2px;height:20px;background:var(--dim);transform:translateX(-1px)}
.tkline{position:absolute;top:27px;transform:translateX(-50%);font-size:11.5px;color:var(--muted);font-weight:600}
.tkbub{position:absolute;top:0;transform:translateX(-60%);border:2px solid var(--green);background:var(--green-bg);
  color:var(--green);border-radius:999px;padding:3px 10px;font:700 17px/1 var(--head);transition:left .8s ease}
.tkprog.lost .tkbub{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
/* the game the legs above are riding on */
.tkbox{background:var(--row-2);border-radius:16px;padding:12px 14px;margin:6px 0 10px}
.bxhd{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bxdot{color:var(--bad);font-size:11px;letter-spacing:.5px;font-weight:800}
.bxcols{margin-left:auto;display:grid;grid-template-columns:repeat(4,26px) 34px;gap:4px;text-align:center}
.bxrow{display:flex;align-items:center;gap:10px;margin-top:8px}
.bxq{display:grid;grid-template-columns:4px 38px minmax(0,1fr) repeat(4,26px) 34px;gap:4px;align-items:center}
.tkbox:not(.bxlive) .bxq{grid-template-columns:4px 38px minmax(0,1fr) 34px}
.bxposs{width:4px;height:26px;border-radius:3px;background:transparent}
.bxposs[data-on]{background:var(--gold)}
.bxlg{width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex:none}
.bxlg img{width:36px;height:36px;object-fit:contain}
.bxnm{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.bxqn{text-align:center;font:600 18px var(--head)}
.bxsc{text-align:right;font:700 20px var(--head);color:var(--gold)}
.tkbox:not(.bxlive) .bxsc{color:var(--ink)}
.tkpre{display:flex;align-items:center;gap:10px}
.tkpre .bxlg{width:46px;height:46px;border-radius:12px;background:#2f3338}
.bxwhen{flex:1;text-align:center;font-size:14px;color:var(--muted)}
.tkft{border-top:1px solid var(--row-2);padding:12px 18px 14px;display:flex;flex-direction:column;gap:10px}
.tkmore{display:flex;align-items:center;gap:8px;margin-left:auto;border:1.5px solid var(--edge);
  background:transparent;color:var(--ink);border-radius:12px;padding:9px 14px;font-size:14px;font-weight:700}
.tkmore svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tkid{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--dim);flex-wrap:wrap}
.tkid span:nth-child(2){flex:1}
.tkbet{background:var(--acc-bg);color:var(--acc);border-radius:6px;padding:2px 7px;font-weight:800;font-size:12px}
.csfab{display:none}
td b.pos{color:var(--good)} td b.neg{color:var(--bad)}

/* The board sits beside a 330px slip, and the desktop rail takes 240px more, so in a
   half-width window (860-1080px) the board was left about 240px: a team's name cut to
   "Pha…", records wrapping, the three prices squeezed to 43px each. Until there is room
   for it, the slip goes under the board, and the shortcut button takes you to it. */
@media (max-width:1079px){
  .csgrid{grid-template-columns:minmax(0,1fr);gap:13px}
  .csslip{position:static;scroll-margin-top:110px}
  .csfab{display:flex;position:fixed;right:14px;bottom:14px;z-index:30;
    border:0;border-radius:999px;padding:12px 18px;background:var(--acc);color:var(--acc-ink);font:700 14px Figtree,sans-serif;box-shadow:var(--sh)}
}
/* However wide the page, a game is sized by the room IT has: on a narrow phone the logo gives
   way before the team's abbreviation does. */
.csgame{container-type:inline-size}
@container (max-width:479px){ .csgame .csteam .av{width:32px;height:32px} .csgame .csteam{gap:9px} }
@container (max-width:339px){ .csgame .csteam .lg{width:34px;height:34px} .csgame .csteam{gap:7px} }
@container (max-width:299px){ .csgame .csteam .lg{width:30px;height:30px} }

/* ===================== MOBILE ===================== */
@media (max-width:860px){
  /* the rail becomes a bar along the bottom, where a thumb reaches it */
  .shell{grid-template-columns:minmax(0,1fr)}
  /* the tab bar is along the bottom from here down, so the slip shortcut rides above it */
  .csfab{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
  /* and the casino's section tabs stick under the top bar, not behind it: --tbh is
     the bar's measured height (it depends on the fonts and the notch) */
  .cssport{top:var(--tbh, calc(56px + var(--topgap)))}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;width:auto;z-index:40;
    flex-direction:row;gap:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
    border-right:0;border-top:1px solid #1d2024;background:rgba(14,16,18,.95);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .rail .brand,.rail .weekpick,.rail .railfoot{display:none}
  .navlist{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:0}
  .tab{flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:52px;
    border-radius:0;background:transparent!important;font-size:10.5px;font-weight:700;text-align:center}
  .tab svg{width:22px;height:22px}
  .tab .dot{position:absolute;margin:0;transform:translate(14px,-4px)}
  .tab[aria-selected="true"]{color:var(--ink)}
  /* the brand and the week picker move into a sticky bar at the top */
  .topbar{display:flex;position:sticky;top:0;z-index:30;align-items:center;gap:10px;
    padding:calc(10px + var(--topgap)) 16px 10px;border-bottom:1px solid #1d2024;
    background:rgba(14,16,18,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .topbar img{width:30px;height:30px;border-radius:9px;object-fit:cover;flex:none}
  .topbar b{flex:1;font:700 21px/1 var(--head);letter-spacing:.3px;min-width:0}
  .topbar .wk select{width:auto;border-radius:999px;padding:7px 30px 7px 14px;font-size:13px;font-weight:700}
  .topbar .wkflag{font-size:0;gap:0}
  .topbar .wkflag::before{width:8px;height:8px}
  main{padding:16px 16px calc(24px + 58px + env(safe-area-inset-bottom,0px))}
  h1{font-size:32px}
  .seg{margin-bottom:14px}
}
@media (max-width:760px){
  .csmk{padding:6px 10px;gap:5px;grid-template-columns:minmax(0,1.2fr) repeat(3,minmax(0,1fr))}
  .cshd{padding:8px 10px 0}
  .csprop{padding:3px 10px}
  .csplayer{margin:10px 10px 2px}
  .csladder{padding:4px 10px}
  /* names wrap to two lines rather than lose their ending */
  .csteam{font-size:13px;line-height:1.15}
  .csteam span{white-space:normal;overflow-wrap:anywhere}
  .csteam .av{width:30px;height:30px}
  .csteam .lg{width:40px;height:40px}
  .csteam{gap:9px}
  .jsw{width:42px;height:42px}
  main[data-tab="casino"] .tiles{margin-bottom:14px}
  .csbar{margin-bottom:14px}
  .csfresh{margin-left:0;flex-basis:100%}
  .cssport{gap:5px}
  .cssport button{padding:6px 9px;gap:4px;font-size:13px;min-height:40px}
  .cssport button i{font-size:10.5px;padding:1px 5px}
  .odd b{font-size:13.5px}
  h1{font-size:30px}
  .lede{font-size:14px;margin-bottom:15px}
  .pad{padding:13px}
  .panel h2{font-size:19px;padding:12px 13px 4px}

  /* ---- wide tables become stacked cards ---- */
  .cards thead{display:none}
  .cards,.cards tbody,.cards tr,.cards td{display:block}
  .cards tr{position:relative;padding:11px 12px 12px 54px;border-bottom:1px solid var(--line)}
  .cards tbody tr:nth-child(even){background:var(--row)}
  .cards td{border:0;padding:0}
  .cards td.bigrk{position:absolute;left:10px;top:13px;width:36px;font-size:22px;text-align:center}
  .cards .teamcell{min-width:0}
  .cards td.stat{display:inline-block;margin:7px 14px 0 0;font-size:12.5px;color:var(--muted);text-align:left}
  .cards td.stat::before{content:attr(data-l) " ";opacity:.75;font-weight:600}
  .cards td.stat b{font-weight:700;color:var(--ink)}
  .cards td.hide-m{display:none}
  /* tables with no rank badge shouldn't reserve the gutter for one */
  .cards.norank tr{padding-left:12px}

  /* voter profile */
  .phead{gap:11px}
  .pav{width:46px;height:46px}
  .phead h1{font-size:21px}
  .phead .btn{margin-left:0!important;width:100%}
  .tiles{grid-template-columns:1fr 1fr;gap:9px}
  .tile{padding:11px 12px}
  .tile b{font-size:18px}
  .tile span{font-size:12px}
  .tile i{font-size:11px}
  .obar{width:38px}

  /* analysis controls stack into full-width rows rather than cramming */
  .ctrls{gap:8px;padding:11px 12px}
  .ctrls label{width:100%;justify-content:space-between;font-size:13px}
  .ctrls select{flex:0 1 auto;max-width:62%}
  .gaprow{grid-template-columns:minmax(96px,1fr) minmax(84px,1.6fr) 34px;gap:7px}
  .gapname{font-size:12.5px}
  .gapname .av{width:19px;height:19px}
  .gapnum{font-size:12px}
  .scat .slbl{font-size:13px}
  .card{padding:13px 14px}
  .card h3{font-size:17px}
  .story{padding:17px 16px 15px}
  .story h1{font-size:24px}
  .story .lede{font-size:15.5px}
  .prose p{font-size:15.5px;line-height:1.62;margin-bottom:13px}
  .prose p:first-child{font-size:16px}
  .boxgrid{grid-template-columns:1fr}
  .boxside+.boxside{border-left:0;border-top:1px solid var(--line)}
  .boxnums b{font-size:17px}
  .watch li{font-size:14px}
  .wproj{margin-left:0}
  .cmt{padding:11px 12px}
  .cmtbody{font-size:14.5px}
  .cmtwhen{margin-left:0;flex-basis:100%}
  .vbtn{padding:6px 13px}
  .fig.big{gap:14px;padding:13px 0}
  .fig.big .figav{width:50px;height:50px}
  .fig.big .figteam b{font-size:13px;max-width:104px}
  .figav{width:29px;height:29px}
  .chip{padding:6px 11px;font-size:12.5px}

  /* ---- matrix tables keep scrolling, but pin the first column ---- */
  .matrix td:first-child,.matrix th:first-child{position:sticky;left:0;z-index:2;background:var(--panel)}
  .matrix tbody tr:nth-child(even) td:first-child{background:var(--row)}
  .matrix td:first-child::after,.matrix th:first-child::after{content:"";position:absolute;top:0;right:0;
    bottom:0;width:1px;background:var(--line)}
  .matrix .teamcell{min-width:132px}
  .matrix td.who{min-width:0}
  .grid .cell img{width:28px;height:28px}
  .grid th.c,.grid td.c{min-width:36px}

  /* ---- ballot editor ---- */
  /* pool first: tapping teams is the primary action on a phone */
  .cols{gap:13px}
  .cols .pool-panel{order:1}
  .cols .ballot-panel{order:2}
  /* only show filled slots plus the next target, so the list stays short */
  .slot.empty:not(.next){display:none}
  .slot{min-height:52px;gap:9px}
  .mini{width:36px;height:36px;font-size:15px}
  .pick{padding:11px 10px}
  .voters{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:7px}
  .vchip{padding:9px 10px}
  .authrow input{width:100%;flex:1 1 180px;padding:11px 12px}

  /* submit rides along the bottom instead of hiding below the fold */
  /* The tab bar (66px, and the home-indicator inset it pads for) is fixed along the bottom, so the
     bar rides on top of it: at bottom:0 the Submit button sat half behind the nav. */
  .actions.stick{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:25;margin:14px -13px 0;padding:11px 13px;
    background:var(--panel);border-top:1px solid var(--line);box-shadow:var(--sh-up)}

/* League scoring, needed to turn Sleeper's raw projected stat lines into this

/* ---------- the voting window ----------
   Ballots open Tuesday 12:00 AM ET and close Thursday 8:00 PM ET — the gap
   between one week's Monday night game and the next week's Thursday kickoff.

   The week being voted on is derived from the season start date rather than
   Sleeper's state.week. Sleeper doesn't advance its week at a guaranteed time
   (it was still reporting week 2 late on the Monday of week 2), so keying off
   it risks opening voting for a week that has already been played. Counting
   Tuesday-to-Tuesday from the season start rolls over at exactly the moment
   voting opens, with no dependency on anyone else's clock.                  */
const DAY_MS = 86400000;
const ET = "America/New_York";
const etFmt = new Intl.DateTimeFormat("en-US",{timeZone:ET,weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
const etDateFmt = new Intl.DateTimeFormat("en-CA",{timeZone:ET,year:"numeric",month:"2-digit",day:"2-digit"});
const DOW = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};

function etNow(now=new Date()){
  const p = etFmt.formatToParts(now), g = t => p.find(x=>x.type===t)?.value;
  return {dow:DOW[g("weekday")] ?? 0, hour:+g("hour"), min:+g("minute")};
}
// whole-day counter for the ET calendar date, immune to DST drift
function etDayNum(now=new Date()){
  const p = etDateFmt.formatToParts(now), g = t => p.find(x=>x.type===t)?.value;
  return Math.floor(Date.parse(`${g("year")}-${g("month")}-${g("day")}T00:00:00Z`)/DAY_MS);
}
function pollWeekFor(now=new Date()){
  const start = Math.floor(Date.parse(SEASON_START+"T00:00:00Z")/DAY_MS);
  if(!Number.isFinite(start)) return CURRENT_WEEK;
  const dow = new Date(start*DAY_MS).getUTCDay();
  const anchor = start - ((dow-2+7)%7);              // the Tuesday on or before kickoff
  return Math.min(18, Math.max(1, Math.floor((etDayNum(now)-anchor)/7) + 1));
}
// Tue 00:00 -> Thu 20:00 ET
function windowOpen(now=new Date()){
  const {dow,hour} = etNow(now);
  return dow===2 || dow===3 || (dow===4 && hour<20);
}
// minutes to the next open/close flip (display only; a DST week can be an hour out)
function minsToFlip(now=new Date()){
  const {dow,hour,min} = etNow(now), t = windowOpen(now) ? {d:4,h:20} : {d:2,h:0};
  let m = ((t.d-dow+7)%7)*1440 + t.h*60 - (hour*60+min);
  return m<=0 ? m+7*1440 : m;
}
const humanMins = m => { const d=Math.floor(m/1440), h=Math.floor((m%1440)/60), mm=m%60;
  return d ? `${d}d ${h}h` : h ? `${h}h ${mm}m` : `${mm}m`; };

/* The week a ballot is FOR. Ballots cast Tue-Thu are the rankings going into

   to the following week — on a Monday the ballots opening tonight are next
   week's, not the week whose games are finishing. */
function ballotWeek(now=new Date()){
  if(windowOpen(now)) return pollWeekFor(now);
  return pollWeekFor(new Date(now.getTime() + (minsToFlip(now)+1)*60000));
}
const votingOpen = () => windowOpen() && S.week === ballotWeek();

/* ---------- data ---------- */
async function loadSleeper(){
  try{
    const j = u => fetch(u).then(r=>{if(!r.ok) throw 0; return r.json()});
    const base = `https://api.sleeper.app/v1/league/${LEAGUE_ID}`;
    const [league, users, rosters, state] = await Promise.all([j(base), j(base+"/users"), j(base+"/rosters"), j("https://api.sleeper.app/v1/state/nfl")]);
    SEASON = +league.season || SEASON;
    const U = Object.fromEntries(users.map(u=>[u.user_id,u]));
    const meta = league.metadata || {};
    DIVISIONS = {};
    for(let i=1;i<=(league.settings?.divisions||0);i++) DIVISIONS[i] = meta["division_"+i] || `Division ${i}`;
    PLAYOFF_TEAMS = league.settings?.playoff_teams || 6;
    LAST_REG_WEEK = (league.settings?.playoff_week_start || 15) - 1;
    // league_average_match: every team also plays the league median each week,
    // so a "week" is two results, not one. Verified against week 1: head-to-head
    // plus median reproduces all 12 Sleeper records exactly.
    MEDIAN_MATCH = !!league.settings?.league_average_match;
    if(league.scoring_settings) SCORING = league.scoring_settings;
    TEAMS = rosters.map(r=>{
      const u = U[r.owner_id] || {}, s = r.settings || {};
      const av = u.metadata?.avatar || (u.avatar ? `https://sleepercdn.com/avatars/thumbs/${u.avatar}` : null);
      return {id:r.roster_id, name:u.metadata?.team_name || u.display_name || `Team ${r.roster_id}`,
        owner: MANAGERS[r.roster_id] || u.display_name || "Open slot",
        w:s.wins||0, l:s.losses||0, t:s.ties||0, pf:(s.fpts||0)+(s.fpts_decimal||0)/100, av,
        pp:(s.ppts||0)+(s.ppts_decimal||0)/100,          // optimal-lineup points: roster ceiling
        pa:(s.fpts_against||0)+(s.fpts_against_decimal||0)/100,
        div:s.division||1, players:r.players||[]};
    }).sort((a,b)=>a.id-b.id);
    indexTeams();
    if(league.avatar) document.getElementById("lgav").src = `https://sleepercdn.com/avatars/thumbs/${league.avatar}`;
    if(state.season_start_date) SEASON_START = state.season_start_date;
    CURRENT_WEEK = state.season_type==="regular" ? pollWeekFor() : 1;
    await catchUpRecords();   // fill in any finished week Sleeper has not posted yet
    document.getElementById("foot").textContent = UNOFFICIAL.length
      ? `Records include Week ${UNOFFICIAL.join(" and ")}, counted here from the final scores — Sleeper posts its own totals later on Tuesday. Poll points: 12 for a first-place vote down to 1 for 12th.`
      : `Records and points live from Sleeper. Poll points: 12 for a first-place vote down to 1 for 12th.`;
  }catch(e){
    document.getElementById("foot").textContent = `Couldn't reach Sleeper, showing records from Sep 20. Poll points: 12 for a first-place vote down to 1 for 12th.`;

/* ---------- catching up on results Sleeper hasn't posted yet ----------
   Sleeper's roster settings (wins, losses, points for/against) only move when it
   does its own weekly rollover, which lands around Tuesday midday. Ballots open
   Tuesday at midnight. For twelve hours every week the site would otherwise show
   records a full week out of date, to the people actively voting on them.

   So: if an NFL week is finished but isn't in Sleeper's totals yet, apply it here
   from the raw matchups — head-to-head and the league median both. Sleeper's own
   numbers take over again the moment it catches up, because the check is simply
   how many games its record already accounts for. */
let UNOFFICIAL = [], RECORDED_WEEKS = 0, OFFICIAL_WEEKS = 0;

async function weekComplete(w){
  try{
    const g = await fetch(`https://api.sleeper.app/scores/nfl/regular/${SEASON}/${w}`).then(r=>r.ok?r.json():null);
    const arr = Array.isArray(g) ? g : g ? Object.values(g) : [];
    if(!arr.length) return false;
    return arr.every(x => x && (x.status==="complete" || (x.metadata && x.metadata.is_over===true)));
  }catch(e){ return false }
}

async function catchUpRecords(){
  const perWeek = MEDIAN_MATCH ? 2 : 1;
  const played = (TEAMS[0]?.w||0)+(TEAMS[0]?.l||0)+(TEAMS[0]?.t||0);
  RECORDED_WEEKS = Math.floor(played/perWeek);
  // Keep Sleeper's own figures before we add to them. ppts (optimal-lineup
  // points) can't be recomputed from matchups, so efficiency has to be measured
  // on the weeks where points-for and points-possible still cover the same
  // ground — otherwise catching one up and not the other reads as >100%.
  OFFICIAL_WEEKS = RECORDED_WEEKS;
  TEAMS.forEach(t=>{ t.pfOff = t.pf; t.ppOff = t.pp; });
  UNOFFICIAL = [];
  for(let w = RECORDED_WEEKS+1; w <= LAST_REG_WEEK; w++){
    if(!(await weekComplete(w))) break;
    let d;
    try{ d = await fetch(`https://api.sleeper.app/v1/league/${LEAGUE_ID}/matchups/${w}`).then(r=>r.ok?r.json():null) }catch(e){ break }
    if(!d || !d.length) break;
    const pts = {}; d.forEach(m=>{ if(typeof m.points==="number") pts[m.roster_id]=m.points });
    if(Object.keys(pts).length < TEAMS.length) break;

    const byId = {};
    d.forEach(m=>{ if(m.matchup_id!=null) (byId[m.matchup_id]=byId[m.matchup_id]||[]).push(m) });
    const pairs = Object.values(byId).filter(p=>p.length===2);
    if(pairs.length !== TEAMS.length/2) break;

    pairs.forEach(([a,b])=>{
      const A=T[a.roster_id], B=T[b.roster_id]; if(!A||!B) return;
      A.pf+=a.points; A.pa+=b.points;
      B.pf+=b.points; B.pa+=a.points;
      if(a.points>b.points){ A.w++; B.l++ }
      else if(b.points>a.points){ B.w++; A.l++ }
      else { A.t=(A.t||0)+1; B.t=(B.t||0)+1 }
    });
    if(MEDIAN_MATCH){
      const vals=Object.values(pts).sort((x,y)=>x-y), n=vals.length;
      const med = n%2 ? vals[(n-1)/2] : (vals[n/2-1]+vals[n/2])/2;
      TEAMS.forEach(t=>{
        const p=pts[t.id]; if(p==null) return;
        if(p>med) t.w++; else if(p<med) t.l++; else t.t=(t.t||0)+1;
      });
    }
    UNOFFICIAL.push(w);
    RECORDED_WEEKS = w;
  }
  return UNOFFICIAL;
}

let sb = null;
const configured = !SUPABASE_URL.includes("YOUR-PROJECT") && !SUPABASE_KEY.startsWith("YOUR-");
/* Refreshing ballots without stealing work in progress.
   Realtime pushes updates, but a websocket that quietly dropped would leave the
   grid stale forever, so this also runs on a timer and on tab changes. It only
   re-renders when the data genuinely moved — otherwise someone mid-ballot or
   mid-comment would have it wiped from under them every thirty seconds. */
const ballotSig = () => S.ballots.map(b=>b.week+":"+b.voter+":"+(b.at||"")).sort().join("|");
function busyComposing(){
  if(S.tab==="vote" && S.ranked.length) return true;         // part-way through a ballot
  if(S.tab==="news" && S.article && CM.draft.trim()) return true;  // part-way through a comment
  // typing a stake or password: a redraw would steal the cursor
  if(S.tab==="casino" && main.contains(document.activeElement) && /^(INPUT|SELECT)$/.test(document.activeElement.tagName)) return true;
  return false;
}
async function refreshBallots(){
  if(!sb || !configured) return;
  const before = ballotSig();
  const {data,error} = await sb.from("ballots").select("season,week,voter,ranking,updated_at").eq("season",SEASON);
  if(error || !data) return;
  const next = data.map(b=>({week:b.week, voter:b.voter, order:b.ranking, at:b.updated_at}));
  const sig = next.map(b=>b.week+":"+b.voter+":"+(b.at||"")).sort().join("|");
  if(sig === before) return;                                  // nothing changed, leave the page alone
  S.ballots = next; S.loaded = true;
  if(busyComposing()) return;                                 // data is fresh; redraw when they're done
  if(S.tab==="vote" && !S.ranked.length) preloadOwn();
  render();
}

async function loadBallots(){
  if(!sb) return;
  const {data,error} = await sb.from("ballots").select("season,week,voter,ranking,updated_at").eq("season",SEASON);
  if(error){S.error="Couldn't load ballots. Refresh to try again."; render(); return}
  S.error=null; S.loaded=true;
  S.ballots = data.map(b=>({week:b.week, voter:b.voter, order:b.ranking, at:b.updated_at}));
  if(S.tab==="vote" && !S.ranked.length) preloadOwn();
  render();
}
// a settlement run writes many rows at once; reload the casino once, not per row
let csTimer = null;
const csSoon = () => {
  if(S.tab!=="casino") return;                 // switching to the tab reloads it anyway
  clearTimeout(csTimer); csTimer = setTimeout(loadCasino, 800);
};
function subscribe(){
  sb.channel("ballots-live")
    .on("postgres_changes",{event:"*",schema:"public",table:"ballots"},()=>loadBallots())
    .on("postgres_changes",{event:"*",schema:"public",table:"bets"},()=>csSoon())
    .on("postgres_changes",{event:"*",schema:"public",table:"casino_ledger"},()=>csSoon())
    .subscribe();
  /* A score moving is pushed the same way, on a channel of its own: a table a
     project has not published to realtime fails the whole join, and the
     scoreboard must never be able to take ballots down with it. The sync writes
     a game row only when something about it moved, so each event is real. */
  sb.channel("casino-games-live")
    .on("postgres_changes",{event:"*",schema:"public",table:"casino_games"},()=>csSoon())
    .subscribe();
}

/* ---------- tally ---------- */
const weekBallots = w => S.ballots.filter(b=>b.week===w).sort((a,b)=>a.voter-b.voter);
function tally(w){
  const bs = weekBallots(w);
  const rows = TEAMS.map(t=>({t,pts:0,fp:0,ranks:[]}));
  const R = Object.fromEntries(rows.map(r=>[r.t.id,r]));
  bs.forEach(b=>b.order.forEach((id,i)=>{const r=R[id]; if(!r) return; r.pts+=12-i; r.ranks.push(i+1); if(i===0) r.fp++}));
  rows.forEach(r=>{r.avg=r.ranks.length?r.ranks.reduce((a,b)=>a+b,0)/r.ranks.length:null; r.hi=r.ranks.length?Math.min(...r.ranks):null; r.lo=r.ranks.length?Math.max(...r.ranks):null});
  rows.sort((a,b)=>b.pts-a.pts||b.fp-a.fp||b.t.pf-a.t.pf);
  return {bs,rows};
}

/* ---------- render ---------- */

/* The views inside the current section, as a segmented control. Nothing is

}

}
const emptyState = () => `<div class="panel empty-state">${S.loaded||!configured?`No ballots for Week ${S.week} yet. Be the first.`:"Loading ballots…"}<br><button class="btn" data-go="vote">Cast ballot</button></div>`;
function waitingOn(bs){
  const have = new Set(bs.map(b=>b.voter)), miss = TEAMS.filter(t=>!have.has(t.id));

}

function renderVote(){

      slots+=`<div class="slot" draggable="true" data-i="${i}"><span class="grab" aria-hidden="true">⠿</span><span class="rk">${i+1}</span>${img(id)}<span class="nm"><b>${esc(t.name)}</b><i>${rec(t)} · ${t.pf.toFixed(1)} pts</i></span>

    } else slots+=`<div class="slot empty ${i===next?"next":""}"><span class="rk">${i+1}</span><span class="nm">${i===next?"Tap a team to put it here":""}</span></div>`;
  }
  const left=TEAMS.filter(t=>!S.ranked.includes(t.id)).sort((a,b)=>b.w-a.w||b.pf-a.pf);

    :`<div class="done">Every team is ranked. Drag a row or use the arrows to fine-tune, then submit.</div>`;

   </div>` : "";

  const pwVal = S.pwDraft!==null ? S.pwDraft : savedPw;
  const hint = !v ? "Pick your team first." : S.ranked.length<n ? `${n-S.ranked.length} teams left to rank.` : mine ? "Submitting replaces your earlier ballot." : "Ready to submit.";
  main.innerHTML = banner()+header(mine?"Update your ballot":"Cast your ballot","Pick your team, then tap teams in the order you'd rank them, best first. Drag a row or use the arrows to fine-tune.")+
  `<section class="panel"><h2>1. Who's voting?</h2><div class="pad"><div class="voters">${TEAMS.map(t=>`<button class="vchip" data-voter="${t.id}" aria-pressed="${v===t.id}">${img(t.id)}<span>${esc(t.name)}</span></button>`).join("")}</div>
   ${v?`<div class="authrow">
     <label for="pw"><b>Team password</b></label>
     <input id="pw" type="password" autocomplete="current-password" minlength="4" value="${esc(pwVal)}" placeholder="Your team's password">
     <span class="hint">Your first ballot sets your team's password. Use the same one every week so nobody else can vote as you.</span>
     ${savedPw?`<button type="button" class="linkish" id="forgetpw">Not you? Clear saved password</button>`:""}
   </div>`:""}
  </div></section>
  <div class="cols">
    <section class="panel ballot-panel"><h2>2. Your Week ${S.week} ballot (${S.ranked.length}/${n})</h2>${slots}</section>

  </div>

    ${S.ranked.length?`<button class="btn ghost" id="reset">Start over</button>`:""}
    <span class="hint">${hint}</span>
  </div>
  <p class="status ${S.msg?.err?"err":""}" id="submitStatus" role="status" style="margin:10px 0 0">${S.msg?esc(S.msg.text):""}</p>`;
}

function renderPoll(){
  const {bs,rows}=tally(S.week);
  if(!bs.length){main.innerHTML=banner()+header("Power Poll")+emptyState();return}
  if(!oddsLoaded&&!oddsRunning){oddsRunning=true;loadOdds();}
  const chances = new Map((ODDS?.rows||[]).map(r=>[r.id,r.po]));
  const oddsDate = ODDS ? new Date(ODDS.generated).toLocaleString("en-US",{timeZone:"America/New_York",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : null;
  const oddsBehind = ODDS && (Date.now()-Date.parse(ODDS.generated)>36*3600000 || TEAMS.some(t=>{const r=ODDS.records?.[t.id];return !r || t.w+t.l+(t.t||0)>r.w+r.l+r.t;}));
  const prev = tally(S.week-1), prevRank = {};
  if(prev.bs.length) prev.rows.forEach((r,i)=>prevRank[r.t.id]=i+1);
  const mv = (id,i) => { if(!prev.bs.length) return ""; const p=prevRank[id]; const d=p-(i+1);
    return d>0?`<span class="mv up">▲${d}</span>`:d<0?`<span class="mv dn">▼${-d}</span>`:`<span class="mv nw">–</span>` };
  main.innerHTML = banner()+header("Power Poll")+
  `<section class="panel"><h2>Week ${S.week} WCXC Power Poll · ${bs.length} ballot${bs.length>1?"s":""}</h2><div class="scroll"><table class="cards">
   <thead><tr><th class="num">Rank</th><th>Team</th><th>Record</th><th class="num">PF</th><th class="num">Points</th><th class="num">Avg</th><th class="num">High</th><th class="num">Low</th><th class="num">Playoffs<i class="subh">latest odds</i></th></tr></thead><tbody>
   ${rows.map((r,i)=>`<tr${i===5?' class="cut"':''}><td class="bigrk"><b>${i+1}</b>${mv(r.t.id,i)}</td><td><div class="teamcell">${img(r.t.id)}<div class="nm"><b>${esc(r.t.name)}${r.fp?`<span class="fp">(${r.fp})</span>`:""}</b><i>${esc(r.t.owner)}</i></div></div></td>
   <td class="stat" data-l="Record">${rec(r.t)}</td><td class="num stat" data-l="PF">${r.t.pf.toFixed(1)}</td><td class="num stat" data-l="Points"><b>${r.pts}</b></td><td class="num stat" data-l="Avg">${r.avg?r.avg.toFixed(2):"–"}</td><td class="num stat" data-l="High">${r.hi??"–"}</td><td class="num stat" data-l="Low">${r.lo??"–"}</td><td class="num stat" data-l="Playoffs (latest)" title="${oddsDate?`Latest forecast: ${esc(oddsDate)} ET${oddsBehind?'; update pending':''}`:oddsLoaded?'Forecast unavailable':'Loading forecast'}">${chances.has(r.t.id)?oddsBar(chances.get(r.t.id))+oddsPct(chances.get(r.t.id)):"—"}</td></tr>`).join("")}
   </tbody></table></div></section>${waitingOn(bs)}
   <div class="actions"><button class="btn ghost" id="copypoll">Copy results</button><span class="hint">Number in parentheses is first-place votes.${prev.bs.length?" Arrows show movement from last week's poll.":""} The dashed line is the six-team playoff cut.</span></div>
   <p class="hint">${ODDS?`Playoff chances are the latest daily forecast (${esc(oddsDate)} ET), including when viewing an older poll.${oddsBehind?" Update pending; showing the last successful forecast.":""}`:oddsLoaded?"Playoff forecast unavailable. Refresh to try again.":"Loading the latest playoff forecast…"} <button class="linkish" data-go="odds">Full playoff odds</button></p>`;
}

/* The same ballots counted the other way round — by team rather than by voter.
   It lives under the grid because it answers the question the grid raises. */
function distPanel(){
  const {bs,rows}=tally(S.week), n=bs.length;
  if(!n) return "";
  return `<section class="panel" style="margin-top:16px"><h2>Vote distribution</h2>
   <p class="hint" style="margin:0 12px 10px">How many voters put each team at each spot. Darker means more agreement.</p>
   <div class="scroll"><table class="matrix">
   <thead><tr><th>Team</th>${TEAMS.map((_,i)=>`<th class="num" style="text-align:center">${i+1}</th>`).join("")}</tr></thead><tbody>
   ${rows.map(r=>{const c=Array(TEAMS.length).fill(0); r.ranks.forEach(k=>c[k-1]++);
     return `<tr><td><div class="teamcell">${img(r.t.id)}<div class="nm"><b>${esc(r.t.name)}</b></div></div></td>${c.map(x=>{const a=x/n;return `<td style="padding:4px 3px"><span class="heat" style="background:${x?`rgba(10,91,171,${.15+.85*a})`:"transparent"};color:${a>.45?"#fff":"inherit"}">${x||""}</span></td>`}).join("")}</tr>`}).join("")}
   </tbody></table></div></section>`;
}
function applyHighlight(){
