<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WCXC Poll Tracker</title>
<meta name="description" content="WCXC Dynasty power rankings, voted on by the league.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --blue:#014587; --blue-2:#0a5bab; --blue-soft:#e6eef7;
  --bg:#eef1f4; --panel:#ffffff; --row:#f6f8fa; --line:#d7dde4;
  --ink:#1c2530; --muted:#5f6b78; --gold:#f2b705; --good:#1f8a4c; --bad:#c0392b;
  --hl:#ffe36b;
  /* chart: emphasis form — one hue + recessive gray (validated, see README) */
  --em:#0a5bab; --ctx:#aab4bf;
  --sh:0 1px 2px rgba(16,24,32,.05),0 3px 10px rgba(16,24,32,.05);
  --sh-up:0 -4px 14px rgba(16,24,32,.08);
  --r:10px;
  --topgap:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --blue:#12233a; --blue-2:#5b9ae0; --blue-soft:#17283c;
    --bg:#0d1218; --panel:#161d26; --row:#1b232d; --line:#2b3643;
    --ink:#e6ebf0; --muted:#95a2b0; --hl:#8a7412;
    --em:#5b9ae0; --ctx:#48545f;
    --sh:0 1px 2px rgba(0,0,0,.4),0 3px 12px rgba(0,0,0,.3);
    --sh-up:0 -4px 14px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --blue:#12233a; --blue-2:#5b9ae0; --blue-soft:#17283c;
  --bg:#0d1218; --panel:#161d26; --row:#1b232d; --line:#2b3643;
  --ink:#e6ebf0; --muted:#95a2b0; --hl:#8a7412;
  --em:#5b9ae0; --ctx:#48545f;
  --sh:0 1px 2px rgba(0,0,0,.4),0 3px 12px rgba(0,0,0,.3);
  --sh-up:0 -4px 14px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:120px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header + tabs travel together so one sticky container handles both */
.chrome{position:sticky;top:0;z-index:40}
.top{background:var(--blue);color:#fff;padding-top:var(--topgap)}
.top .in{max-width:1180px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font:700 20px/1.1 "Roboto Condensed",Roboto,sans-serif;letter-spacing:.2px;min-width:0}
.brand img{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.85);flex:none}
.brand small{display:block;font:400 12px/1.25 Roboto,sans-serif;opacity:.78;margin-top:3px}
.weekpick{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}

/* week picker: styled pill, not the raw OS dropdown */
.wk{position:relative;display:inline-flex;align-items:center}
.wk select{appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.14);color:#fff;
  border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:8px 32px 8px 14px;
  font:700 14px/1 Roboto,sans-serif;cursor:pointer;transition:background .12s}
.wk select:hover{background:rgba(255,255,255,.22)}
.wk select option{background:var(--panel);color:var(--ink);font-weight:400}
.wk::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;margin-top:-5px;
  border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg);pointer-events:none;opacity:.9}
.wkflag{font:700 11px/1 Roboto,sans-serif;letter-spacing:.3px;text-transform:uppercase;
  padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;opacity:.85;white-space:nowrap}
.wkflag.open{background:#1f8a4c;opacity:1}

.sub{background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--sh)}
.sub .in{max-width:1180px;margin:0 auto;padding:0 8px;display:flex;gap:2px;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sub .in::-webkit-scrollbar{display:none}
.tab{position:relative;background:none;border:0;padding:13px 13px;font-weight:600;font-size:14.5px;
  color:var(--muted);white-space:nowrap;border-radius:8px 8px 0 0;transition:color .12s,background .12s}
.tab:hover{color:var(--ink);background:var(--row)}
.tab[aria-selected="true"]{color:var(--blue-2)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;
  border-radius:3px 3px 0 0;background:var(--blue-2)}
.t-short{display:none}

main{max-width:1180px;margin:0 auto;padding:20px 16px 44px}
.kicker{color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin:0 0 4px}
h1{font:700 29px/1.15 "Roboto Condensed",Roboto,sans-serif;margin:0 0 7px;letter-spacing:.2px}
.lede{color:var(--muted);max-width:72ch;margin:0 0 18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.panel h2{font:700 15px/1.25 "Roboto Condensed",Roboto,sans-serif;margin:0;padding:11px 15px;
  background:var(--blue);color:#fff;letter-spacing:.3px}
.pad{padding:15px}
.btn{border:0;border-radius:8px;padding:10px 15px;font-weight:700;background:var(--blue-2);color:#fff;
  transition:filter .12s,opacity .12s}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--blue-2);border:1px solid var(--line)}
.btn.ghost:hover:not(:disabled){background:var(--row);filter:none}
.btn.big{padding:13px 22px;font-size:16px}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none;background:var(--row)}

/* vote */
.voters{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.vchip{display:flex;align-items:center;gap:9px;text-align:left;background:var(--row);border:2px solid transparent;
  border-radius:9px;padding:8px 10px;min-width:0;transition:border-color .12s,background .12s}
.vchip:hover{border-color:var(--line)}
.vchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.vchip[aria-pressed="true"]{border-color:var(--blue-2);background:var(--blue-soft)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.slot{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);min-height:46px}
.slot:last-child{border-bottom:0}
.rk{width:26px;text-align:right;font:700 17px "Roboto Condensed",sans-serif;color:var(--blue-2);flex:none}
.slot .nm{flex:1;min-width:0}
.nm b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm i{font-style:normal;color:var(--muted);font-size:12.5px}
.slot.empty .nm{color:var(--muted);font-size:13.5px}
.slot.next{background:var(--blue-soft)}
.slot[draggable="true"]{cursor:grab}
.slot.dragging{opacity:.4}
.slot.over{background:var(--blue-soft);box-shadow:inset 0 2px 0 var(--blue-2)}
.grab{flex:none;color:var(--muted);font-size:14px;line-height:1;letter-spacing:-2px;user-select:none}
@media (max-width:760px){.grab{display:none}}
.mini{background:none;border:1px solid var(--line);border-radius:4px;width:30px;height:30px;padding:0;color:var(--muted);font-size:13px}
.mini:hover{color:var(--ink)}
.pool{display:flex;flex-direction:column}
.pick{display:flex;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;width:100%}
.pick:hover{background:var(--row)}
.pick .plus{margin-left:auto;color:var(--blue-2);font-weight:700;font-size:20px;line-height:1}
.done{color:var(--muted);padding:16px;text-align:center;font-size:14px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.hint{color:var(--muted);font-size:13.5px}
.result{margin-top:16px;border-left:4px solid var(--good)}
.result textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:4px;background:var(--row);padding:10px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}

/* status */
.status{font-size:13.5px;color:var(--good);margin-left:4px}
.status.err{color:#c0392b}

/* tables */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font:700 12.5px "Roboto Condensed",sans-serif;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even){background:var(--row)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.teamcell{display:flex;align-items:center;gap:10px;min-width:210px}
.fp{color:var(--muted);font-size:12.5px;margin-left:4px}
.bigrk{font:700 20px "Roboto Condensed",sans-serif;color:var(--blue-2);width:40px;text-align:center}

/* grid */
.grid th.c,.grid td.c{text-align:center;padding:5px 3px;min-width:44px}
.grid td.who{min-width:180px;white-space:nowrap}
.who b{font-weight:500;display:block;font-size:14px}
.who i{font-style:normal;color:var(--muted);font-size:12px}
.cell{display:inline-flex;border-radius:50%;padding:3px;transition:opacity .12s, background .12s}
.cell img{width:34px;height:34px;border-radius:50%;display:block}
.grid.dim .cell{opacity:.18}
.grid.dim .cell.on{opacity:1;background:var(--hl)}
.cell:hover{cursor:pointer}
.lockbar{font-size:13.5px;color:var(--muted);margin:0 0 10px;min-height:20px}
.lockbar b{color:var(--ink)}

/* distribution */
.heat{display:block;min-width:30px;padding:5px 0;border-radius:3px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px}

/* season: bump chart (emphasis form — every team gray, the chosen one in blue) */
.chartwrap{padding:16px 14px 6px}
.bump{width:100%;height:auto;display:block}
.bump .gl{stroke:var(--line);stroke-width:1}
.bump .ctx{fill:none;stroke:var(--ctx);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bump.dim .ctx{stroke-opacity:.5}
.bump .hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.bump .em{fill:none;stroke:var(--em);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.bump .dot{fill:var(--em);stroke:var(--panel);stroke-width:2}
.bump .ax{fill:var(--muted);font:500 11px Roboto,sans-serif}
.bump .lbl{fill:var(--ink);font:700 12px "Roboto Condensed",sans-serif}
.bump .lbl.soft{fill:var(--muted);font-weight:500}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:4px;padding:12px 14px;border-top:1px solid var(--line)}
.lg{display:flex;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:6px;padding:5px 7px;text-align:left;min-width:0;font-size:13px}
.lg:hover{background:var(--row)}
.lg[aria-pressed="true"]{border-color:var(--em);background:var(--blue-soft)}
.lg .av{width:22px;height:22px}
.lg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.lg b{font:700 12px "Roboto Condensed",sans-serif;color:var(--muted);flex:none}
.rkcell{display:block;min-width:28px;padding:5px 0;border-radius:3px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px;font-weight:500}

/* voters */
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700;background:var(--row);color:var(--muted)}
.pill.up{background:rgba(31,138,76,.14);color:var(--good)}
.pill.dn{background:rgba(192,57,43,.14);color:#c0392b}

.empty-state{padding:30px 16px;text-align:center;color:var(--muted)}
.empty-state .btn{margin-top:12px}
.waiting{font-size:13.5px;color:var(--muted);margin:10px 0 0}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding:20px}

.authrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.authrow input{border:1px solid var(--line);border-radius:4px;background:var(--row);padding:9px 10px;width:210px;font:inherit;color:inherit}
.linkish{background:none;border:0;padding:0;color:var(--blue-2);font:inherit;text-decoration:underline}
.banner{background:var(--blue-soft);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:16px;font-size:14px}
.banner.err{border-color:#c0392b}
.mv{font-size:12px;font-weight:700;margin-left:6px}
.mv.up{color:var(--good)} .mv.dn{color:#c0392b} .mv.nw{color:var(--muted);font-weight:500}
.avtxt{display:inline-flex;align-items:center;justify-content:center;font:700 11px Roboto,sans-serif;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;opacity:.85}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#7a8793}
.live.on::before{background:#3ddc84}

/* voter profile */
.phead{display:flex;align-items:center;gap:14px;margin:0 0 16px;flex-wrap:wrap}
.pav{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;background:var(--row)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:13px 15px}
.tile b{display:block;font:700 22px/1.15 "Roboto Condensed",Roboto,sans-serif;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile b.good{color:var(--good)} .tile b.bad{color:var(--bad)}
.tile span{display:block;font-size:13px;font-weight:600;color:var(--ink)}
.tile i{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.clickrow{cursor:pointer}
.clickrow:hover{background:var(--blue-soft)!important}

/* odds */
.obar{display:inline-block;width:52px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;vertical-align:middle;margin-left:7px}
.obar i{display:block;height:100%;background:var(--blue-2)}

/* closed-week notice */
.closed{text-align:center;padding:26px 18px}
.closed .big{font:700 17px/1.3 "Roboto Condensed",Roboto,sans-serif;margin:0 0 4px}
.roballot{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.roballot:last-child{border-bottom:0}

/* ===================== MOBILE ===================== */
@media (max-width:760px){
  main{padding:16px 13px 40px}
  h1{font-size:24px}
  .lede{font-size:14px;margin-bottom:15px}
  .pad{padding:13px}
  .panel h2{font-size:14.5px;padding:10px 13px}

  /* header compacts: title shrinks, subtitle and the "Live" word drop out */
  .top .in{padding:9px 13px;gap:10px}
  .brand{font-size:17px;gap:8px}
  .brand img{width:30px;height:30px}
  .brand small{display:none}
  .live{font-size:0;gap:0}
  .live::before{width:9px;height:9px}
  .weekpick{gap:7px}
  .wk select{padding:9px 30px 9px 13px;font-size:13.5px}
  .wkflag{font-size:10px;padding:5px 8px}

  /* tabs: short labels so all six fit without hunting */
  .sub .in{padding:0 6px}
  .tab{padding:12px 11px;font-size:14px}
  .t-full{display:none}
  .t-short{display:inline}

  /* ---- wide tables become stacked cards ---- */
  .cards thead{display:none}
  .cards,.cards tbody,.cards tr,.cards td{display:block}
  .cards tr{position:relative;padding:11px 12px 12px 54px;border-bottom:1px solid var(--line)}
  .cards tbody tr:nth-child(even){background:var(--row)}
  .cards td{border:0;padding:0}
  .cards td.bigrk{position:absolute;left:10px;top:13px;width:36px;font-size:22px;text-align:center}
  .cards .teamcell{min-width:0}
  .cards td.stat{display:inline-block;margin:7px 14px 0 0;font-size:12.5px;color:var(--muted);text-align:left}
  .cards td.stat::before{content:attr(data-l) " ";opacity:.75;font-weight:600}
  .cards td.stat b{font-weight:700;color:var(--ink)}
  .cards td.hide-m{display:none}
  /* tables with no rank badge shouldn't reserve the gutter for one */
  .cards.norank tr{padding-left:12px}

  /* voter profile */
  .phead{gap:11px}
  .pav{width:46px;height:46px}
  .phead h1{font-size:21px}
  .phead .btn{margin-left:0!important;width:100%}
  .tiles{grid-template-columns:1fr 1fr;gap:9px}
  .tile{padding:11px 12px}
  .tile b{font-size:18px}
  .tile span{font-size:12px}
  .tile i{font-size:11px}
  .obar{width:38px}

  /* ---- matrix tables keep scrolling, but pin the first column ---- */
  .matrix td:first-child,.matrix th:first-child{position:sticky;left:0;z-index:2;background:var(--panel)}
  .matrix tbody tr:nth-child(even) td:first-child{background:var(--row)}
  .matrix td:first-child::after,.matrix th:first-child::after{content:"";position:absolute;top:0;right:0;
    bottom:0;width:1px;background:var(--line)}
  .matrix .teamcell{min-width:132px}
  .matrix td.who{min-width:0}
  .grid .cell img{width:28px;height:28px}
  .grid th.c,.grid td.c{min-width:36px}

  /* ---- ballot editor ---- */
  /* pool first: tapping teams is the primary action on a phone */
  .cols{gap:13px}
  .cols .pool-panel{order:1}
  .cols .ballot-panel{order:2}
  /* only show filled slots plus the next target, so the list stays short */
  .slot.empty:not(.next){display:none}
  .slot{min-height:52px;gap:9px}
  .mini{width:36px;height:36px;font-size:15px}
  .pick{padding:11px 10px}
  .voters{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:7px}
  .vchip{padding:9px 10px}
  .authrow input{width:100%;flex:1 1 180px;padding:11px 12px}

  /* submit rides along the bottom instead of hiding below the fold */
  .actions.stick{position:sticky;bottom:0;z-index:25;margin:14px -13px 0;padding:11px 13px
    calc(11px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);
    box-shadow:var(--sh-up)}
  .actions.stick .btn.big{flex:1;padding:13px 16px}
  .actions.stick .hint{flex-basis:100%;order:3;margin:0}

  .legend{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .chartwrap{padding:12px 8px 4px}
  .lockbar{font-size:13px}
  footer{font-size:12px;padding:18px 14px}
}

/* very narrow phones */
@media (max-width:380px){
  .brand{font-size:15.5px}
  .tab{padding:12px 9px;font-size:13.5px}
  .voters{grid-template-columns:1fr 1fr}
  .cards tr{padding-left:48px}
  .cards td.bigrk{width:32px;left:8px;font-size:20px}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="chrome">
<header class="top"><div class="in">
  <div class="brand"><img id="lgav" alt="" src="https://sleepercdn.com/avatars/thumbs/aaaec022297bb5d7332893d529d8dc18">
    <div>WCXC Poll Tracker<small>Power rankings, voted on by the league</small></div></div>
  <div class="weekpick">
    <span class="live" id="live">Connecting</span>
    <span class="wkflag" id="wkflag"></span>
    <label class="sr" for="week">Poll week</label>
    <span class="wk"><select id="week"></select></span>
  </div>
</div></header>
<nav class="sub"><div class="in" role="tablist">
  <button type="button" class="tab" role="tab" data-tab="vote"><span class="t-full">Cast ballot</span><span class="t-short">Vote</span></button>
  <button type="button" class="tab" role="tab" data-tab="poll"><span class="t-full">Poll</span><span class="t-short">Poll</span></button>
  <button type="button" class="tab" role="tab" data-tab="grid"><span class="t-full">Ballot grid</span><span class="t-short">Grid</span></button>
  <button type="button" class="tab" role="tab" data-tab="dist"><span class="t-full">Distribution</span><span class="t-short">Spread</span></button>
  <button type="button" class="tab" role="tab" data-tab="season"><span class="t-full">Season</span><span class="t-short">Season</span></button>
  <button type="button" class="tab" role="tab" data-tab="voters"><span class="t-full">Voters</span><span class="t-short">Voters</span></button>

/* ---------- the voting window ----------
   Ballots open Tuesday 12:00 AM ET and close Thursday 8:00 PM ET — the gap
   between one week's Monday night game and the next week's Thursday kickoff.

   The week being voted on is derived from the season start date rather than
   Sleeper's state.week. Sleeper doesn't advance its week at a guaranteed time
   (it was still reporting week 2 late on the Monday of week 2), so keying off
   it risks opening voting for a week that has already been played. Counting
   Tuesday-to-Tuesday from the season start rolls over at exactly the moment
   voting opens, with no dependency on anyone else's clock.                  */
const DAY_MS = 86400000;
const ET = "America/New_York";
const etFmt = new Intl.DateTimeFormat("en-US",{timeZone:ET,weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
const etDateFmt = new Intl.DateTimeFormat("en-CA",{timeZone:ET,year:"numeric",month:"2-digit",day:"2-digit"});
const DOW = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};

function etNow(now=new Date()){
  const p = etFmt.formatToParts(now), g = t => p.find(x=>x.type===t)?.value;
  return {dow:DOW[g("weekday")] ?? 0, hour:+g("hour"), min:+g("minute")};
}
// whole-day counter for the ET calendar date, immune to DST drift
function etDayNum(now=new Date()){
  const p = etDateFmt.formatToParts(now), g = t => p.find(x=>x.type===t)?.value;
  return Math.floor(Date.parse(`${g("year")}-${g("month")}-${g("day")}T00:00:00Z`)/DAY_MS);
}
function pollWeekFor(now=new Date()){
  const start = Math.floor(Date.parse(SEASON_START+"T00:00:00Z")/DAY_MS);
  if(!Number.isFinite(start)) return CURRENT_WEEK;
  const dow = new Date(start*DAY_MS).getUTCDay();
  const anchor = start - ((dow-2+7)%7);              // the Tuesday on or before kickoff
  return Math.min(18, Math.max(1, Math.floor((etDayNum(now)-anchor)/7) + 1));
}
// Tue 00:00 -> Thu 20:00 ET
function windowOpen(now=new Date()){
  const {dow,hour} = etNow(now);
  return dow===2 || dow===3 || (dow===4 && hour<20);
}
// minutes to the next open/close flip (display only; a DST week can be an hour out)
function minsToFlip(now=new Date()){
  const {dow,hour,min} = etNow(now), t = windowOpen(now) ? {d:4,h:20} : {d:2,h:0};
  let m = ((t.d-dow+7)%7)*1440 + t.h*60 - (hour*60+min);
  return m<=0 ? m+7*1440 : m;
}
const humanMins = m => { const d=Math.floor(m/1440), h=Math.floor((m%1440)/60), mm=m%60;
  return d ? `${d}d ${h}h` : h ? `${h}h ${mm}m` : `${mm}m`; };
const votingOpen = () => windowOpen() && S.week === CURRENT_WEEK;
const indexTeams = () => { T = Object.fromEntries(TEAMS.map(t=>[t.id,t])) };
indexTeams();

const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const img = (id,cls="av") => { const t=T[id]; return t&&t.av ? `<img class="${cls}" src="${esc(t.av)}" alt="" referrerpolicy="no-referrer">` : `<span class="${cls||"av"} avtxt" style="width:28px;height:28px;border-radius:50%;background:var(--row)">${esc((t?.name||"?").slice(0,2))}</span>` };
const rec = t => `${t.w}-${t.l}${t.t?`-${t.t}`:""}`;
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};

const TABS = ["vote","poll","grid","dist","season","voters","odds"];
const S = {
  tab: TABS.includes(store.get("wcxc.tab")) ? store.get("wcxc.tab") : "vote",
  profile: null,
  week: null, voter: store.get("wcxc.voter",null), ranked: [], pwDraft: null,
  ballots: [], loaded: false, error: null, lock: null, hover: null,
  saving: false, msg: null
};

/* ---------- data ---------- */
async function loadSleeper(){
  try{
    const j = u => fetch(u).then(r=>{if(!r.ok) throw 0; return r.json()});
    const base = `https://api.sleeper.app/v1/league/${LEAGUE_ID}`;
    const [league, users, rosters, state] = await Promise.all([j(base), j(base+"/users"), j(base+"/rosters"), j("https://api.sleeper.app/v1/state/nfl")]);
    SEASON = +league.season || SEASON;
    const U = Object.fromEntries(users.map(u=>[u.user_id,u]));
    const meta = league.metadata || {};
    DIVISIONS = {};
    for(let i=1;i<=(league.settings?.divisions||0);i++) DIVISIONS[i] = meta["division_"+i] || `Division ${i}`;
    PLAYOFF_TEAMS = league.settings?.playoff_teams || 6;
    LAST_REG_WEEK = (league.settings?.playoff_week_start || 15) - 1;
    TEAMS = rosters.map(r=>{
      const u = U[r.owner_id] || {}, s = r.settings || {};
      const av = u.metadata?.avatar || (u.avatar ? `https://sleepercdn.com/avatars/thumbs/${u.avatar}` : null);
      return {id:r.roster_id, name:u.metadata?.team_name || u.display_name || `Team ${r.roster_id}`, owner:u.display_name || "Open slot",
        w:s.wins||0, l:s.losses||0, t:s.ties||0, pf:(s.fpts||0)+(s.fpts_decimal||0)/100, av,
        div:s.division||1, players:r.players||[]};
    }).sort((a,b)=>a.id-b.id);
    indexTeams();
    applyKtc();
    if(league.avatar) document.getElementById("lgav").src = `https://sleepercdn.com/avatars/thumbs/${league.avatar}`;
    if(state.season_start_date) SEASON_START = state.season_start_date;
    CURRENT_WEEK = state.season_type==="regular" ? pollWeekFor() : 1;
    document.getElementById("foot").textContent = `Records and points live from Sleeper. Poll points: 12 for a first-place vote down to 1 for 12th.`;
  }catch(e){
    document.getElementById("foot").textContent = `Couldn't reach Sleeper, showing records from Sep 20. Poll points: 12 for a first-place vote down to 1 for 12th.`;
  }
}

/* ---------- KeepTradeCut values ----------
   ktc.json is built by tools/refresh-ktc.js and keyed by Sleeper player id.
   KTC has no public API and no CORS headers, so the mapping is resolved at
   build time rather than in the browser. Values are dynasty superflex,
   rostered players only — draft picks aren't in Sleeper's roster.players.  */
let KTC = null;
async function loadKtc(){
  try{
    const r = await fetch("ktc.json", {cache:"no-cache"});
    if(!r.ok) throw 0;
    KTC = await r.json();
    applyKtc();
  }catch(e){ KTC = null; }
}
function applyKtc(){
  if(!KTC || !KTC.values) return;
  TEAMS.forEach(t=>{
    let sum=0, n=0;
    (t.players||[]).forEach(id=>{ const v=KTC.values[id]; if(v!=null){ sum+=v; n++ } });
    t.ktc = n ? sum : null;
    t.ktcN = n;
  });
  const ranked = TEAMS.filter(t=>t.ktc!=null).sort((a,b)=>b.ktc-a.ktc);
  ranked.forEach((t,i)=>t.ktcRank=i+1);
}

let sb = null;
const configured = !SUPABASE_URL.includes("YOUR-PROJECT") && !SUPABASE_KEY.startsWith("YOUR-");
async function loadBallots(){
  if(!sb) return;
  const {data,error} = await sb.from("ballots").select("season,week,voter,ranking,updated_at").eq("season",SEASON);
  if(error){S.error="Couldn't load ballots. Refresh to try again."; render(); return}
  S.error=null; S.loaded=true;
  S.ballots = data.map(b=>({week:b.week, voter:b.voter, order:b.ranking, at:b.updated_at}));
  if(S.tab==="vote" && !S.ranked.length) preloadOwn();
  render();
}
function setLive(on,text){const el=document.getElementById("live");el.classList.toggle("on",on);el.textContent=text}
function subscribe(){
  sb.channel("ballots-live")
    .on("postgres_changes",{event:"*",schema:"public",table:"ballots"},()=>loadBallots())
    .subscribe(status=>{ if(status==="SUBSCRIBED") setLive(true,"Live"); else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"||status==="CLOSED") setLive(false,"Offline"); });
}

/* ---------- tally ---------- */
const weekBallots = w => S.ballots.filter(b=>b.week===w).sort((a,b)=>a.voter-b.voter);
function tally(w){
  const bs = weekBallots(w);
  const rows = TEAMS.map(t=>({t,pts:0,fp:0,ranks:[]}));
  const R = Object.fromEntries(rows.map(r=>[r.t.id,r]));
  bs.forEach(b=>b.order.forEach((id,i)=>{const r=R[id]; if(!r) return; r.pts+=12-i; r.ranks.push(i+1); if(i===0) r.fp++}));
  rows.forEach(r=>{r.avg=r.ranks.length?r.ranks.reduce((a,b)=>a+b,0)/r.ranks.length:null; r.hi=r.ranks.length?Math.min(...r.ranks):null; r.lo=r.ranks.length?Math.max(...r.ranks):null});
  rows.sort((a,b)=>b.pts-a.pts||b.fp-a.fp||b.t.pf-a.t.pf);
  return {bs,rows};
}

/* ---------- render ---------- */
const main = document.getElementById("main");
const header = (title,lede) => `<p class="kicker">Week ${S.week} WCXC Power Poll</p><h1>${title}</h1>${lede?`<p class="lede">${lede}</p>`:""}`;
function banner(){
  if(!configured) return `<div class="banner err">Voting isn't connected yet. Add your Supabase URL and key at the top of index.html.</div>`;
  if(S.error) return `<div class="banner err">${esc(S.error)}</div>`;
  return "";
}
const emptyState = () => `<div class="panel empty-state">${S.loaded||!configured?`No ballots for Week ${S.week} yet. Be the first.`:"Loading ballots…"}<br><button class="btn" data-go="vote">Cast ballot</button></div>`;
function waitingOn(bs){
  const have = new Set(bs.map(b=>b.voter)), miss = TEAMS.filter(t=>!have.has(t.id));
  return miss.length ? `<p class="waiting">Still waiting on: ${miss.map(t=>esc(t.name)).join(", ")}</p>` : `<p class="waiting">All ${TEAMS.length} ballots are in.</p>`;
}
function preloadOwn(){
  const mine = S.ballots.find(b=>b.week===S.week && b.voter===S.voter);
  S.ranked = mine ? [...mine.order] : [];
}

function renderClosed(){
  const mine = S.voter ? S.ballots.find(b=>b.week===S.week && b.voter===S.voter) : null;
  const onPollWeek = S.week === CURRENT_WEEK, flip = humanMins(minsToFlip());
  const bs = weekBallots(S.week);
  let title, lede, big, sub;
  if(onPollWeek){                                  // right week, outside the window
    title = "Voting is closed right now";
    lede  = `Ballots for Week ${S.week} open Tuesday at 12:00 AM and close Thursday at 8:00 PM, Eastern. Everything else on the site stays open.`;
    big   = `Week ${S.week} ballots open in ${flip}`;
    sub   = "Tuesday 12:00 AM – Thursday 8:00 PM ET, every week.";
  } else if(S.week < CURRENT_WEEK){
    title = "Week " + S.week + " is in the books";
    lede  = `That week is settled, so ballots are closed — but all of its results are still here. The poll, every ballot, the spread, and the voter report all work for past weeks.`;
    big   = `Week ${S.week} is finished`;
    sub   = `${bs.length} ballot${bs.length===1?"":"s"} were cast. Voting is now on Week ${CURRENT_WEEK}.`;
  } else {
    title = "Week " + S.week + " hasn't opened yet";
    lede  = `Ballots open Tuesday at 12:00 AM Eastern of that week's game week and close Thursday at 8:00 PM.`;
    big   = `Week ${S.week} isn't open yet`;
    sub   = `Voting is currently on Week ${CURRENT_WEEK}.`;
  }
  main.innerHTML = banner()+header(title,lede)+
  `<section class="panel"><div class="closed">
     <p class="big">${esc(big)}</p>
     <p class="hint" style="margin:0">${esc(sub)}</p>
     <div class="actions" style="justify-content:center;margin-top:15px">
       ${!onPollWeek?`<button class="btn" id="gonow">Go to Week ${CURRENT_WEEK}</button>`:""}
       ${bs.length?`<button class="btn ghost" data-go="poll">Week ${S.week} poll</button>
       <button class="btn ghost" data-go="grid">Every ballot</button>`:""}
     </div>
   </div></section>`+
  (mine?`<section class="panel" style="margin-top:16px"><h2>Your Week ${S.week} ballot</h2>
     ${mine.order.map((id,i)=>`<div class="roballot"><span class="rk">${i+1}</span>${img(id)}<span class="nm"><b>${esc(T[id]?.name||"")}</b></span></div>`).join("")}
   </section>`:"")+
  (bs.length?`<p class="hint" style="margin-top:14px">All ${bs.length} Week ${S.week} ballot${bs.length===1?"":"s"} — everyone's, not just yours — stay readable on the <b>Poll</b>, <b>Grid</b>, <b>Spread</b>, <b>Season</b> and <b>Voters</b> tabs.</p>`:"");
}

function renderVote(){
  if(!votingOpen()) return renderClosed();
  const v=S.voter, next=S.ranked.length, n=TEAMS.length;
  const mine = S.ballots.find(b=>b.week===S.week && b.voter===v);
  let slots="";
  for(let i=0;i<n;i++){
    const id=S.ranked[i];
    if(id){const t=T[id];
      slots+=`<div class="slot" draggable="true" data-i="${i}"><span class="grab" aria-hidden="true">⠿</span><span class="rk">${i+1}</span>${img(id)}<span class="nm"><b>${esc(t.name)}</b><i>${rec(t)} · ${t.pf.toFixed(1)} pts</i></span>
      <button class="mini" data-up="${i}" aria-label="Move ${esc(t.name)} up" ${i===0?"disabled":""}>▲</button>
      <button class="mini" data-dn="${i}" aria-label="Move ${esc(t.name)} down" ${i===S.ranked.length-1?"disabled":""}>▼</button>
      <button class="mini" data-rm="${i}" aria-label="Remove ${esc(t.name)}">✕</button></div>`;
    } else slots+=`<div class="slot empty ${i===next?"next":""}"><span class="rk">${i+1}</span><span class="nm">${i===next?"Tap a team to put it here":""}</span></div>`;
  }
  const left=TEAMS.filter(t=>!S.ranked.includes(t.id)).sort((a,b)=>b.w-a.w||b.pf-a.pf);
  const pool=left.length?left.map(t=>`<button class="pick" data-add="${t.id}">${img(t.id)}<span class="nm"><b>${esc(t.name)}</b><i>${rec(t)} · ${t.pf.toFixed(1)} pts · ${esc(t.owner)}</i></span><span class="plus" aria-hidden="true">+</span></button>`).join("")
    :`<div class="done">Every team is ranked. Drag a row or use the arrows to fine-tune, then submit.</div>`;
  const lastWeek = v ? S.ballots.find(b=>b.week===S.week-1 && b.voter===v) : null;
  const quick = v && (lastWeek || left.length) ? `<div style="display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)">
    ${lastWeek?`<button class="btn ghost" data-fill="last">Start from Week ${S.week-1}</button>`:""}
    ${left.length?`<button class="btn ghost" data-fill="record">Fill rest by record</button>`:""}
   </div>` : "";
  const ready = v && S.ranked.length===n && configured && !S.saving;
  const savedPw = v ? store.get("wcxc.pw."+v,"") : "";
  const pwVal = S.pwDraft!==null ? S.pwDraft : savedPw;
  const hint = !v ? "Pick your team first." : S.ranked.length<n ? `${n-S.ranked.length} teams left to rank.` : mine ? "Submitting replaces your earlier ballot." : "Ready to submit.";
  main.innerHTML = banner()+header(mine?"Update your ballot":"Cast your ballot","Pick your team, then tap teams in the order you'd rank them, best first. Drag a row or use the arrows to fine-tune.")+
  `<section class="panel"><h2>1. Who's voting?</h2><div class="pad"><div class="voters">${TEAMS.map(t=>`<button class="vchip" data-voter="${t.id}" aria-pressed="${v===t.id}">${img(t.id)}<span>${esc(t.name)}</span></button>`).join("")}</div>
   ${v?`<div class="authrow">
     <label for="pw"><b>Team password</b></label>
     <input id="pw" type="password" autocomplete="current-password" minlength="4" value="${esc(pwVal)}" placeholder="Your team's password">
     <span class="hint">Your first ballot sets your team's password. Use the same one every week so nobody else can vote as you.</span>
     ${savedPw?`<button type="button" class="linkish" id="forgetpw">Not you? Clear saved password</button>`:""}
   </div>`:""}
  </div></section>
  <div class="cols">
    <section class="panel ballot-panel"><h2>2. Your Week ${S.week} ballot (${S.ranked.length}/${n})</h2>${slots}</section>
    <section class="panel pool-panel"><h2>Teams left to rank (${left.length})</h2>${quick}<div class="pool">${pool}</div></section>
  </div>
  <div class="actions stick">
    <button class="btn big" id="submit" ${ready?"":"disabled"}>${S.saving?"Submitting…":mine?"Update ballot":"Submit ballot"}</button>
    ${S.ranked.length?`<button class="btn ghost" id="reset">Start over</button>`:""}
    <span class="hint">${hint}</span>
  </div>
  <p class="status ${S.msg?.err?"err":""}" id="submitStatus" role="status" style="margin:10px 0 0">${S.msg?esc(S.msg.text):""}</p>`;
}

// Roster value beside poll rank: the gap is the interesting part — who does the
// league rate above or below what their roster is actually worth?
const fmtKtc = v => v>=1000 ? (v/1000).toFixed(1)+"k" : String(v);
function ktcCell(t,pollRank){
  if(t.ktc==null) return "–";
  const d = pollRank - t.ktcRank;   // poll worse than value = underrated
  const tag = d>=2 ? `<span class="pill up" title="Poll ranks them ${d} spots below their roster value">▲${d} value</span>`
            : d<=-2 ? `<span class="pill dn" title="Poll ranks them ${-d} spots above their roster value">▼${-d} value</span>` : "";
  return `<b>${fmtKtc(t.ktc)}</b> <span class="hint">#${t.ktcRank}</span> ${tag}`;
}

function renderPoll(){
  const {bs,rows}=tally(S.week);
  if(!bs.length){main.innerHTML=banner()+header("Poll")+emptyState();return}
  const hasKtc = TEAMS.some(t=>t.ktc!=null);
  const prev = tally(S.week-1), prevRank = {};
  if(prev.bs.length) prev.rows.forEach((r,i)=>prevRank[r.t.id]=i+1);
  const mv = (id,i) => { if(!prev.bs.length) return ""; const p=prevRank[id]; const d=p-(i+1);
    return d>0?`<span class="mv up">▲${d}</span>`:d<0?`<span class="mv dn">▼${-d}</span>`:`<span class="mv nw">–</span>` };
  main.innerHTML = banner()+header("Poll")+
  `<section class="panel"><h2>Week ${S.week} WCXC Power Poll · ${bs.length} ballot${bs.length>1?"s":""}</h2><div class="scroll"><table class="cards">
   <thead><tr><th class="num">Rank</th><th>Team</th><th>Record</th><th class="num">PF</th><th class="num">Points</th><th class="num">Avg</th><th class="num">High</th><th class="num">Low</th>${hasKtc?`<th class="num">KTC</th>`:""}</tr></thead><tbody>
   ${rows.map((r,i)=>`<tr><td class="bigrk">${i+1}</td><td><div class="teamcell">${img(r.t.id)}<div class="nm"><b>${esc(r.t.name)}${r.fp?`<span class="fp">(${r.fp})</span>`:""}${mv(r.t.id,i)}</b><i>${esc(r.t.owner)}</i></div></div></td>
   <td class="stat" data-l="Record">${rec(r.t)}</td><td class="num stat" data-l="PF">${r.t.pf.toFixed(1)}</td><td class="num stat" data-l="Points"><b>${r.pts}</b></td><td class="num stat" data-l="Avg">${r.avg?r.avg.toFixed(2):"–"}</td><td class="num stat" data-l="High">${r.hi??"–"}</td><td class="num stat" data-l="Low">${r.lo??"–"}</td>${hasKtc?`<td class="num stat" data-l="KTC">${ktcCell(r.t,i+1)}</td>`:""}</tr>`).join("")}
   </tbody></table></div></section>${waitingOn(bs)}
   <div class="actions"><button class="btn ghost" id="copypoll">Copy results</button><span class="hint">Number in parentheses is first-place votes.${prev.bs.length?" Arrows show movement from last week's poll.":""}${hasKtc?` KTC is dynasty superflex roster value; the tag flags teams the poll rates well above or below their roster.`:""}</span></div>`;

/* ---------- playoff odds ----------
   League rules, from Sleeper: 3 divisions, 6 playoff teams, regular season
   through week 14. Each division winner qualifies, plus the next 3 best by
   record then points for. The top 2 division winners get byes; the remaining
   4 are seeded 3-6 on record then PF, and the bracket reseeds every round.  */
let SCHED = null, ODDS = null, oddsRunning = false;

async function loadSchedule(){
  const base = `https://api.sleeper.app/v1/league/${LEAGUE_ID}/matchups/`;
  const weeks = [];
  for(let w=1; w<=LAST_REG_WEEK; w++) weeks.push(w);
  const all = await Promise.all(weeks.map(w =>
    fetch(base+w).then(r=>r.ok?r.json():[]).then(d=>({w, d:d||[]})).catch(()=>({w, d:[]}))));
  const games = [], scores = {};
  TEAMS.forEach(t=>scores[t.id]=[]);
  all.sort((a,b)=>a.w-b.w).forEach(({w,d})=>{
    const byId = {};
    d.forEach(m=>{ if(m.matchup_id==null) return; (byId[m.matchup_id]=byId[m.matchup_id]||[]).push(m) });
    Object.values(byId).forEach(pair=>{
      if(pair.length!==2) return;
      const [a,b]=pair;
      const played = typeof a.points==="number" && typeof b.points==="number" && (a.points>0||b.points>0);
      if(played){ if(scores[a.roster_id]) scores[a.roster_id].push(a.points); if(scores[b.roster_id]) scores[b.roster_id].push(b.points); }
      else games.push({w, a:a.roster_id, b:b.roster_id});
    });
  });
  SCHED = {games, scores};
  return SCHED;
}

// Score model: each team's weekly score ~ Normal(mu, sd). mu is shrunk toward the
// league mean so two weeks of data doesn't crown a champion; sd is pooled within-team.
function strength(){
  const {scores}=SCHED;
  const all = Object.values(scores).flat();
  const lgMean = all.length ? all.reduce((a,b)=>a+b,0)/all.length : 110;
  let ss=0, n=0;
  Object.values(scores).forEach(xs=>{
    if(xs.length<2) return;
    const m=xs.reduce((a,b)=>a+b,0)/xs.length;
    xs.forEach(x=>{ ss+=(x-m)**2; n++ });
  });
  const sd = n>1 ? Math.sqrt(ss/(n-1)) : 26;
  const PRIOR = 3;                                  // games worth of league-average prior
  const mu = {};
  TEAMS.forEach(t=>{
    const xs = scores[t.id]||[];
    const tot = xs.reduce((a,b)=>a+b,0);
    mu[t.id] = (tot + PRIOR*lgMean) / (xs.length + PRIOR);
  });
  return {mu, sd:Math.max(12, sd), lgMean};
}

let spare=null;
function gauss(){                                    // Box-Muller with a cached second draw
  if(spare!==null){const s=spare; spare=null; return s}
  let u=0,v=0,s=0;
  do{ u=Math.random()*2-1; v=Math.random()*2-1; s=u*u+v*v }while(s===0||s>=1);
  const f=Math.sqrt(-2*Math.log(s)/s);
  spare=v*f; return u*f;
}

function seedField(st){
  // st: {id:{w,l,pf}} for the full season
  const arr = TEAMS.map(t=>({id:t.id, div:t.div, w:st[t.id].w, pf:st[t.id].pf}));
  const better = (a,b)=> b.w-a.w || b.pf-a.pf;
  const winners = [];
  Object.keys(DIVISIONS).length
    ? Object.keys(DIVISIONS).forEach(d=>{
        const inDiv = arr.filter(x=>String(x.div)===String(d)).sort(better);
        if(inDiv.length) winners.push(inDiv[0]);
      })
    : null;
  if(!winners.length){                               // no divisions configured: top seeds by record
    const s=arr.slice().sort(better); return s.slice(0,PLAYOFF_TEAMS);
  }
  const wIds = new Set(winners.map(x=>x.id));
  const rest = arr.filter(x=>!wIds.has(x.id)).sort(better);
  const wildcards = rest.slice(0, Math.max(0, PLAYOFF_TEAMS - winners.length));
  const byes = winners.slice().sort(better).slice(0,2);                    // seeds 1-2
  const byeIds = new Set(byes.map(x=>x.id));
  const remaining = winners.filter(x=>!byeIds.has(x.id)).concat(wildcards).sort(better);  // seeds 3-6
  return {seeds: byes.concat(remaining), winners, byes};
}

function simulate(sims=10000){
  const {mu,sd}=strength();
  const base={};
  TEAMS.forEach(t=>base[t.id]={w:t.w, l:t.l, pf:t.pf});
  const acc={};
  TEAMS.forEach(t=>acc[t.id]={po:0,div:0,bye:0,final:0,title:0,w:0,seed:0,seedN:0});
  const draw = id => mu[id] + gauss()*sd;
  const beat = (a,b) => draw(a) >= draw(b) ? a : b;

  for(let s=0;s<sims;s++){
    const st={};
    TEAMS.forEach(t=>st[t.id]={w:base[t.id].w, l:base[t.id].l, pf:base[t.id].pf});
    SCHED.games.forEach(g=>{
      const sa=draw(g.a), sb=draw(g.b);
      st[g.a].pf+=sa; st[g.b].pf+=sb;
      if(sa>=sb){ st[g.a].w++; st[g.b].l++ } else { st[g.b].w++; st[g.a].l++ }
    });
    const f=seedField(st);
    const seeds=f.seeds||f, winners=f.winners||[], byes=f.byes||[];
    seeds.forEach((x,i)=>{ acc[x.id].po++; acc[x.id].seed+=i+1; acc[x.id].seedN++ });
    winners.forEach(x=>acc[x.id].div++);
    byes.forEach(x=>acc[x.id].bye++);
    TEAMS.forEach(t=>acc[t.id].w+=st[t.id].w);

    if(seeds.length>=6){
      const id=i=>seeds[i].id;
      const r1a=beat(id(2),id(5)), r1b=beat(id(3),id(4));          // 3v6, 4v5
      const seedOf=x=>seeds.findIndex(s2=>s2.id===x);
      const alive=[r1a,r1b].sort((x,y)=>seedOf(y)-seedOf(x));      // worst seed first
      const semiA=beat(id(0), alive[0]);                            // 1 v worst remaining
      const semiB=beat(id(1), alive[1]);
      acc[semiA].final++; acc[semiB].final++;
      acc[beat(semiA,semiB)].title++;
    }
  }
  const out=TEAMS.map(t=>({
    t,
    po:acc[t.id].po/sims, div:acc[t.id].div/sims, bye:acc[t.id].bye/sims,
    final:acc[t.id].final/sims, title:acc[t.id].title/sims,
    projW:acc[t.id].w/sims,
    seed:acc[t.id].seedN?acc[t.id].seed/acc[t.id].seedN:null
  })).sort((a,b)=>b.po-a.po||b.title-a.title||b.projW-a.projW);
  return {rows:out, sims, remaining:SCHED.games.length, sd};
}

/* ---------- voters ---------- */
function voterGaps(w){
  const {bs,rows}=tally(w);
  if(!bs.length) return [];
  const cons={}; rows.forEach((r,i)=>cons[r.t.id]=i+1);
  return bs.map(b=>{
    let dev=0, worst=null;
    b.order.forEach((id,i)=>{const diff=Math.abs((i+1)-cons[id]); dev+=diff;
      if(!worst||diff>worst.diff) worst={id,diff,mine:i+1,cons:cons[id]}});
    const own=b.order.indexOf(b.voter)+1;
    return {v:b.voter, top:b.order[0], avg:dev/b.order.length, own, homer:cons[b.voter]-own, worst, at:b.at};
  }).sort((a,b)=>a.avg-b.avg);
}
/* How one voter treats every team, across whichever weeks they voted in.
   Positive bias = they rank that team HIGHER (better) than the league does. */
function voterProfile(v){
  const weeks = weeksWithBallots().filter(w => S.ballots.some(b=>b.week===w && b.voter===v));
  const bias = {};   // teamId -> {diffs:[], weeks:[]}
  TEAMS.forEach(t=>bias[t.id]={diffs:[],byWeek:{}});
  const perWeek = [];
  weeks.forEach(w=>{
    const {rows} = tally(w);
    const cons = {}; rows.forEach((r,i)=>cons[r.t.id]=i+1);
    const b = S.ballots.find(x=>x.week===w && x.voter===v);
    if(!b) return;
    let dev=0;
    b.order.forEach((id,i)=>{
      const mine=i+1, d=cons[id]-mine;     // + = voter ranks them higher than consensus
      if(bias[id]){ bias[id].diffs.push(d); bias[id].byWeek[w]=d }
      dev += Math.abs(d);
    });
    const own = b.order.indexOf(v)+1;
    perWeek.push({w, order:b.order, gap:dev/b.order.length, own, ownCons:cons[v], homer:cons[v]-own, at:b.at});
  });
  const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
  const teams = TEAMS.map(t=>({
    t, n:bias[t.id].diffs.length, avg:avg(bias[t.id].diffs), byWeek:bias[t.id].byWeek
  })).filter(x=>x.n>0).sort((a,b)=>b.avg-a.avg);
  return {
    weeks, perWeek, teams,
    high: teams.filter(x=>x.avg>0).slice(0,5),
    low: teams.filter(x=>x.avg<0).slice(-5).reverse(),
    gap: avg(perWeek.map(p=>p.gap)),
    homer: avg(perWeek.map(p=>p.homer)),
    ballots: perWeek.length
  };
}

       <td class="num"><b>${sign(x.avg)}</b></td></tr>`).join("")}
     </tbody></table></div></section>
   <p class="hint" style="margin-top:10px">Positive means this voter ranked that team <b style="color:var(--good)">higher</b> (better) than the final poll had them; negative means <b style="color:var(--bad)">lower</b>.</p>

   <section class="panel" style="margin-top:16px"><h2>Week by week</h2><div class="scroll"><table class="cards">
     <thead><tr><th>Week</th><th>Their #1</th><th>Own team</th><th class="num">Gap</th><th>Full ballot</th></tr></thead>
     <tbody>${p.perWeek.slice().reverse().map(x=>`<tr>
       <td class="bigrk">${x.w}</td>
       <td class="stat" data-l="Their #1">${esc(T[x.order[0]]?.name||"")}</td>
       <td class="stat" data-l="Own team">#${x.own} <span class="pill ${x.homer>0?"dn":x.homer<0?"up":""}">${x.homer>0?`${x.homer} above`:x.homer<0?`${-x.homer} below`:"matches"}</span></td>
       <td class="num stat" data-l="Gap"><b>${x.gap.toFixed(2)}</b></td>
       <td class="stat" data-l="Ballot"><span class="hint">${x.order.map(id=>esc(shortName(T[id]?.name||"?"))).join(" › ")}</span></td></tr>`).join("")}
     </tbody></table></div></section>`;
}

function renderVoters(){
  if(S.profile) return renderProfile(S.profile);
  const gaps=voterGaps(S.week);
  if(!gaps.length){main.innerHTML=banner()+header("Voter report")+emptyState();return}
  const season={};
  weeksWithBallots().forEach(w=>voterGaps(w).forEach(g=>(season[g.v]=season[g.v]||[]).push(g.avg)));
  const fmt=at=>at?esc(new Date(at).toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})):"–";
  main.innerHTML = banner()+header("Voter report","How each ballot lines up with the consensus. Gap is the average number of spots a voter differs from the final poll.")+
  `<section class="panel"><h2>Week ${S.week} ballots · ${gaps.length} in</h2><div class="scroll"><table class="cards norank">
   <thead><tr><th>Voter</th><th>Their #1</th><th>Own team</th><th>Biggest outlier</th><th class="num">Gap</th><th class="num">Season</th><th>Submitted</th></tr></thead>
   <tbody>${gaps.map(g=>{
     const sa=season[g.v], sm=sa&&sa.length?sa.reduce((a,b)=>a+b,0)/sa.length:null;
     return `<tr class="clickrow" data-profile="${g.v}" tabindex="0" role="button" aria-label="Open ${esc(T[g.v]?.owner||"")}'s voter report">
      <td><div class="teamcell">${img(g.v)}<div class="nm"><b>${esc(T[g.v]?.owner||"")}</b><i>${esc(T[g.v]?.name||"")}</i></div></div></td>
      <td class="stat" data-l="Their #1">${esc(T[g.top]?.name||"")}</td>
      <td class="stat" data-l="Own team">#${g.own} <span class="pill ${g.homer>0?"dn":g.homer<0?"up":""}">${g.homer>0?`${g.homer} above`:g.homer<0?`${-g.homer} below`:"matches"}</span></td>
      <td class="stat" data-l="Outlier">${esc(T[g.worst.id]?.name||"")} <span class="hint">#${g.worst.mine} vs #${g.worst.cons}</span></td>
      <td class="num stat" data-l="Gap"><b>${g.avg.toFixed(2)}</b></td>
      <td class="num stat" data-l="Season">${sm!==null?sm.toFixed(2):"–"}</td>
      <td class="stat hide-m" data-l="Submitted">${fmt(g.at)}</td></tr>`}).join("")}
   </tbody></table></div></section>${waitingOn(gaps.map(g=>({voter:g.v})))}
   <p class="hint">Tap any voter for their full report — who they're high on, who they're low on, and every ballot they've cast. Sorted closest-to-consensus first. <b>Own team</b> compares where a voter put themselves against where the league put them — <b style="color:var(--bad)">above</b> means they rate themselves higher than the league does, <b style="color:var(--good)">below</b> means more modestly.</p>`;
}

function updateWeekChrome(){
  const f=document.getElementById("wkflag"); if(!f) return;
  const open=votingOpen(), flip=humanMins(minsToFlip());
  f.textContent = open ? `Voting closes in ${flip}` : "Results only";
  f.className = "wkflag"+(open?" open":"");
  f.title = open
    ? `Week ${S.week} ballots are open until Thursday 8:00 PM ET.`
    : windowOpen()
      ? `Ballots are open for Week ${CURRENT_WEEK}, not Week ${S.week}.`
      : `Ballots for Week ${CURRENT_WEEK} open Tuesday 12:00 AM ET — in ${flip}.`;
}

function buildWeekOptions(){
  const sel=document.getElementById("week"); if(!sel) return;
  const keep=sel.value;
  sel.innerHTML="";
  for(let i=1;i<=18;i++){
    const o=document.createElement("option"); o.value=i;
    o.textContent = i===CURRENT_WEEK ? `Week ${i} · current` : `Week ${i}`;
    sel.appendChild(o);
  }
  sel.value = keep || S.week;
}

// The window opens and closes on a clock, so the page has to notice on its own
// rather than waiting for a reload.
let lastOpen=null, lastWeek=null;
function tick(){
  const w=pollWeekFor(), open=windowOpen();
  const rolled = w!==lastWeek, flipped = open!==lastOpen;
  if(rolled){
    const wasOnCurrent = S.week===lastWeek;
    CURRENT_WEEK=w; lastWeek=w;
    if(wasOnCurrent || lastOpen===null){ S.week=w; const sel=document.getElementById("week"); if(sel) sel.value=w; S.ranked=[]; preloadOwn(); }
    buildWeekOptions();
  }
  lastOpen=open;
  if(rolled||flipped) render(); else updateWeekChrome();
}

const pct = p => p>=.995 ? ">99%" : p<=.005 && p>0 ? "<1%" : p===0 ? "—" : (p*100).toFixed(0)+"%";
const oddsBar = p => `<span class="obar"><i style="width:${Math.max(0,Math.min(100,p*100)).toFixed(1)}%"></i></span>`;

function renderOdds(){
  if(!SCHED){
    main.innerHTML = banner()+header("Playoff odds","Simulating the rest of the season from the real remaining schedule.")+
      `<section class="panel"><div class="closed"><p class="big">Loading the schedule…</p>
      <p class="hint" style="margin:0">Pulling every remaining matchup from Sleeper.</p></div></section>`;
    if(!oddsRunning){
      oddsRunning=true;
      loadSchedule().then(()=>{ ODDS=simulate(); oddsRunning=false; if(S.tab==="odds") renderOdds(); })
        .catch(()=>{ oddsRunning=false; SCHED={games:[],scores:{}}; ODDS=null; if(S.tab==="odds") renderOdds(); });
    }
    return;
  }
  if(!ODDS){
    main.innerHTML = banner()+header("Playoff odds")+
      `<section class="panel"><div class="closed"><p class="big">Couldn't load the schedule</p>
      <p class="hint" style="margin:0">Sleeper didn't answer. Refresh to try again.</p></div></section>`;
    return;
  }
  const {rows,sims,remaining,sd}=ODDS;
  const divNames = Object.keys(DIVISIONS).length ? DIVISIONS : null;
  const byDiv = {};
  TEAMS.forEach(t=>{ (byDiv[t.div]=byDiv[t.div]||[]).push(t) });

  main.innerHTML = banner()+header("Playoff odds",
    `${sims.toLocaleString()} simulations of the ${remaining} remaining regular-season games, using each team's scoring so far.`)+
  `<section class="panel"><h2>Odds through Week ${LAST_REG_WEEK}</h2><div class="scroll"><table class="cards norank">
    <thead><tr><th>Team</th><th>Div</th><th class="num">Proj record</th><th class="num">Make playoffs</th><th class="num">Win div</th><th class="num">Bye</th><th class="num">Final</th><th class="num">Title</th></tr></thead>
    <tbody>${rows.map(r=>`<tr>
      <td><div class="teamcell">${img(r.t.id)}<div class="nm"><b>${esc(r.t.name)}</b><i>${esc(r.t.owner)} · ${rec(r.t)}</i></div></div></td>
      <td class="stat" data-l="Division">${esc(divNames?divNames[r.t.div]||("Div "+r.t.div):("Div "+r.t.div))}</td>
      <td class="num stat" data-l="Proj record">${r.projW.toFixed(1)}–${(LAST_REG_WEEK-r.projW).toFixed(1)}</td>
      <td class="num stat" data-l="Playoffs"><b>${pct(r.po)}</b> ${oddsBar(r.po)}</td>
      <td class="num stat" data-l="Win div">${pct(r.div)}</td>
      <td class="num stat" data-l="Bye">${pct(r.bye)}</td>
      <td class="num stat" data-l="Final">${pct(r.final)}</td>
      <td class="num stat" data-l="Title"><b>${pct(r.title)}</b></td></tr>`).join("")}
    </tbody></table></div></section>

   <section class="panel" style="margin-top:16px"><h2>Divisions</h2><div class="pad" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px">
     ${Object.keys(byDiv).sort().map(d=>`<div><p class="kicker" style="margin-bottom:6px">${esc(divNames?divNames[d]||("Division "+d):("Division "+d))}</p>
       ${byDiv[d].slice().sort((a,b)=>b.w-a.w||b.pf-a.pf).map(t=>`<div class="roballot" style="padding:6px 0;border:0">${img(t.id)}<span class="nm"><b>${esc(t.name)}</b><i>${rec(t)} · ${t.pf.toFixed(1)}</i></span></div>`).join("")}
     </div>`).join("")}
   </div></section>

   <section class="panel" style="margin-top:16px"><h2>How this works</h2><div class="pad">
     <p style="margin:0 0 9px">Every remaining game on the real Sleeper schedule is simulated ${sims.toLocaleString()} times. A team's weekly score is drawn from a normal distribution around its scoring average, shrunk toward the league average so a two-week sample doesn't crown anyone, with a shared spread of <b>±${sd.toFixed(1)}</b> points.</p>
     <p style="margin:0 0 9px"><b>Format.</b> All ${Object.keys(byDiv).length} division winners qualify, plus the next ${Math.max(0,PLAYOFF_TEAMS-Object.keys(byDiv).length)} best teams by record, then points for. The top 2 division winners get first-round byes; the other ${PLAYOFF_TEAMS-2} are seeded 3–${PLAYOFF_TEAMS} on record then points for. The bracket reseeds each round, so the top remaining seed always draws the weakest survivor.</p>
     <p class="hint" style="margin:0">Odds shift as results come in — this is a projection, not a promise. Ties are broken by points for throughout.</p>
   </div></section>`;
}

function render(){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  updateWeekChrome();
  ({vote:renderVote,poll:renderPoll,grid:renderGrid,dist:renderDist,season:renderSeason,voters:renderVoters,odds:renderOdds})[S.tab]();
}

/* ---------- events ---------- */
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
  S.tab=b.dataset.tab; store.set("wcxc.tab",S.tab); S.hover=null; S.msg=null; S.profile=null;
  if(S.tab==="vote" && !S.ranked.length) preloadOwn();
  render();
}));
const wk=document.getElementById("week");
wk.addEventListener("change",()=>{S.week=+wk.value; S.lock=null; S.msg=null; preloadOwn(); render()});

async function submit(){
  if(!votingOpen()){renderVote();return}   // week changed under them
  const pwEl=document.getElementById("pw"), pw=(pwEl?.value||"").trim();
  if(pw.length<4){S.msg={err:true,text:"Enter your team's password (at least 4 characters)."};renderVote();document.getElementById("pw")?.focus();return}
  S.saving=true; S.msg=null; renderVote();
  const {data,error} = await sb.rpc("submit_ballot",{p_season:SEASON,p_week:S.week,p_voter:S.voter,p_ranking:S.ranked,p_password:pw});
  S.saving=false;
  if(error){ S.msg={err:true,text:(error.message||"Couldn't submit. Try again.").replace(/^.*?:\s*(?=[A-Z])/,"")} }
  else{
    store.set("wcxc.pw."+S.voter,pw);
    S.pwDraft=null;
    S.msg={err:false,text:data==="created"?"Ballot submitted. Your team's password is set, so use it again next week.":"Ballot submitted."};
    await loadBallots(); return;
  }
  renderVote();
}

main.addEventListener("click",e=>{
  const prow=e.target.closest("[data-profile]");
  if(prow && !e.target.closest("button")){
    S.profile=+prow.dataset.profile; S.tab="voters"; store.set("wcxc.tab","voters");
    render(); window.scrollTo({top:0,behavior:"smooth"}); return;
  }
  const el=e.target.closest("button,[data-team]"); if(!el) return;
  const d=el.dataset;
  if(el.id==="backvoters"){S.profile=null; render(); return}
  if(d.go){S.tab=d.go; store.set("wcxc.tab",S.tab); S.profile=null; if(S.tab==="vote"&&!S.ranked.length) preloadOwn(); render(); return}
  if(d.voter){S.voter=+d.voter; store.set("wcxc.voter",S.voter); S.msg=null; S.pwDraft=null; preloadOwn(); renderVote(); return}
  if(d.add){S.ranked.push(+d.add); S.msg=null; renderVote(); return}
  if(d.rm!==undefined){S.ranked.splice(+d.rm,1); renderVote(); return}
  if(d.up!==undefined){const i=+d.up; [S.ranked[i-1],S.ranked[i]]=[S.ranked[i],S.ranked[i-1]]; renderVote(); return}
  if(d.dn!==undefined){const i=+d.dn; [S.ranked[i+1],S.ranked[i]]=[S.ranked[i],S.ranked[i+1]]; renderVote(); return}
  if(d.fill==="last"){const b=S.ballots.find(x=>x.week===S.week-1&&x.voter===S.voter); if(b){S.ranked=[...b.order]; S.msg=null} renderVote(); return}
  if(d.fill==="record"){TEAMS.filter(t=>!S.ranked.includes(t.id)).sort((a,b)=>b.w-a.w||b.pf-a.pf).forEach(t=>S.ranked.push(t.id)); S.msg=null; renderVote(); return}
  if(el.id==="gonow"){S.week=CURRENT_WEEK; wk.value=S.week; S.lock=null; S.msg=null; preloadOwn(); render(); return}
  if(el.id==="reset"){S.ranked=[]; S.msg=null; renderVote(); return}
  if(el.id==="submit"){submit(); return}
  if(el.id==="forgetpw"){if(S.voter) store.del("wcxc.pw."+S.voter); S.pwDraft=""; renderVote(); return}
  if(el.id==="copypoll"){copyPoll(el); return}
  if(d.team){const id=+d.team; S.lock=S.lock===id?null:id; applyHighlight(); return}
});

function copyPoll(btn){
  const {bs,rows}=tally(S.week);
  const txt=`WCXC Power Poll — Week ${S.week} (${bs.length} ballot${bs.length>1?"s":""})\n`+
    rows.map((r,i)=>`${i+1}. ${r.t.name}${r.fp?` (${r.fp})`:""} — ${r.pts} pts`).join("\n");
  const done=()=>{btn.textContent="Copied"; setTimeout(()=>{btn.textContent="Copy results"},1500)};
  const legacy=()=>{
    const ta=document.createElement("textarea");
    ta.value=txt; ta.style.cssText="position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta); ta.select();
    try{document.execCommand("copy"); done()}catch(_){ btn.textContent="Copy failed" }
    ta.remove();
  };
  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(txt).then(done,legacy); else legacy();
}

/* drag to reorder the ballot (desktop); arrows do the same job on touch */
let dragFrom=null;
const clearDrag=()=>document.querySelectorAll(".slot.over,.slot.dragging").forEach(x=>x.classList.remove("over","dragging"));
main.addEventListener("dragstart",e=>{
  const s=e.target.closest(".slot[draggable]"); if(!s) return;
  dragFrom=+s.dataset.i; s.classList.add("dragging");
  e.dataTransfer.effectAllowed="move";
  try{e.dataTransfer.setData("text/plain",String(dragFrom))}catch(_){}
});
main.addEventListener("dragover",e=>{
  if(dragFrom===null) return;
  const s=e.target.closest(".slot[draggable]"); if(!s) return;
  e.preventDefault(); e.dataTransfer.dropEffect="move";
  document.querySelectorAll(".slot.over").forEach(x=>x.classList.remove("over"));
  if(+s.dataset.i!==dragFrom) s.classList.add("over");
});
main.addEventListener("drop",e=>{
  if(dragFrom===null) return;
  const s=e.target.closest(".slot[draggable]"); if(!s) return;
  e.preventDefault();
  const to=+s.dataset.i;
  if(to!==dragFrom){const [m]=S.ranked.splice(dragFrom,1); S.ranked.splice(to,0,m); S.msg=null}
  dragFrom=null; clearDrag(); renderVote();
});
main.addEventListener("dragend",()=>{dragFrom=null; clearDrag()});
main.addEventListener("input",e=>{ if(e.target.id==="pw") S.pwDraft=e.target.value; });
main.addEventListener("keydown",e=>{
  if(e.target.id==="pw"&&e.key==="Enter"){e.preventDefault(); document.getElementById("submit")?.click(); return}
  const p=e.target.closest("[data-profile]");
  if(p&&(e.key==="Enter"||e.key===" ")){e.preventDefault(); p.click(); return}
  const c=e.target.closest("[data-team]"); if(c&&(e.key==="Enter"||e.key===" ")){e.preventDefault(); c.click()}
});
main.addEventListener("mouseover",e=>{const c=e.target.closest("[data-team]"); const id=c?+c.dataset.team:null; if(id!==S.hover){S.hover=id; if(!S.lock) applyHighlight()}});
main.addEventListener("mouseleave",()=>{S.hover=null; if(!S.lock) applyHighlight()});

/* ---------- start ---------- */
(async function init(){
  S.week = CURRENT_WEEK; render();
  await Promise.all([loadSleeper(), loadKtc()]);
  S.week = CURRENT_WEEK;
  buildWeekOptions();
  wk.value = S.week;
  lastWeek = CURRENT_WEEK; lastOpen = windowOpen();
  updateWeekChrome();
  setInterval(tick, 30000);   // notice the Tue open / Thu close without a reload
  if(configured && window.supabase){
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    await loadBallots(); subscribe();
  } else { setLive(false, configured ? "Offline" : "Not connected"); render(); }
})();
</script>
</body>
</html>
