<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WCXC Dynasty</title>
<meta name="description" content="Power rankings, playoff odds and news for the WCXC Dynasty league — voted on by the twelve managers, every week.">
<meta name="theme-color" content="#014587">

<!-- Link previews: what a pasted link looks like in a group chat. og:image is the
     league crest off Sleeper's CDN; drop an og.png in this folder and point at it
     instead if you ever want a designed 1200x630 card. -->
<meta property="og:site_name" content="WCXC Dynasty">
<meta property="og:title" content="WCXC Dynasty">
<meta property="og:description" content="Power rankings, playoff odds and news — voted on by the twelve managers, every week.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://wcxcdynasty.site/">
<meta property="og:image" content="https://sleepercdn.com/avatars/aaaec022297bb5d7332893d529d8dc18">
<meta property="og:image:alt" content="WCXC Dynasty league crest">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="WCXC Dynasty">
<meta name="twitter:description" content="Power rankings, playoff odds and news — voted on by the twelve managers, every week.">
<meta name="twitter:image" content="https://sleepercdn.com/avatars/aaaec022297bb5d7332893d529d8dc18">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --blue:#014587; --blue-2:#0a5bab; --blue-soft:#e6eef7;
  --bg:#eef1f4; --panel:#ffffff; --row:#f6f8fa; --line:#d7dde4;
  --ink:#1c2530; --muted:#5f6b78; --gold:#f2b705; --good:#1f8a4c; --bad:#c0392b;
  --hl:#ffe36b;
  /* chart: emphasis form — one hue + recessive gray (validated, see README) */
  --em:#0a5bab; --ctx:#aab4bf;
  --sh:0 1px 2px rgba(16,24,32,.05),0 3px 10px rgba(16,24,32,.05);
  --sh-up:0 -4px 14px rgba(16,24,32,.08);
  --r:10px;
  --topgap:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --blue:#12233a; --blue-2:#5b9ae0; --blue-soft:#17283c;
    --bg:#0d1218; --panel:#161d26; --row:#1b232d; --line:#2b3643;
    --ink:#e6ebf0; --muted:#95a2b0; --hl:#8a7412;
    --em:#5b9ae0; --ctx:#48545f;
    --sh:0 1px 2px rgba(0,0,0,.4),0 3px 12px rgba(0,0,0,.3);
    --sh-up:0 -4px 14px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --blue:#12233a; --blue-2:#5b9ae0; --blue-soft:#17283c;
  --bg:#0d1218; --panel:#161d26; --row:#1b232d; --line:#2b3643;
  --ink:#e6ebf0; --muted:#95a2b0; --hl:#8a7412;
  --em:#5b9ae0; --ctx:#48545f;
  --sh:0 1px 2px rgba(0,0,0,.4),0 3px 12px rgba(0,0,0,.3);
  --sh-up:0 -4px 14px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:120px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header + tabs travel together so one sticky container handles both */
.chrome{position:sticky;top:0;z-index:40}
.top{background:var(--blue);color:#fff;padding-top:var(--topgap)}
.top .in{max-width:1180px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font:700 20px/1.1 "Roboto Condensed",Roboto,sans-serif;letter-spacing:.2px;min-width:0}
.brand img{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.85);flex:none}
.brand small{display:block;font:400 12px/1.25 Roboto,sans-serif;opacity:.78;margin-top:3px}
.weekpick{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}

/* week picker: styled pill, not the raw OS dropdown */
.wk{position:relative;display:inline-flex;align-items:center}
.wk select{appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.14);color:#fff;
  border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:8px 32px 8px 14px;
  font:700 14px/1 Roboto,sans-serif;cursor:pointer;transition:background .12s}
.wk select:hover{background:rgba(255,255,255,.22)}
.wk select option{background:var(--panel);color:var(--ink);font-weight:400}
.wk::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;margin-top:-5px;
  border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg);pointer-events:none;opacity:.9}
.wkflag{font:700 11px/1 Roboto,sans-serif;letter-spacing:.3px;text-transform:uppercase;
  padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;opacity:.85;white-space:nowrap}
.wkflag.open{background:#1f8a4c;opacity:1}

.sub{background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--sh)}
.sub .in{max-width:1180px;margin:0 auto;padding:0 8px;display:flex;gap:2px;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sub .in::-webkit-scrollbar{display:none}
.tab{position:relative;background:none;border:0;padding:13px 13px;font-weight:600;font-size:14.5px;
  color:var(--muted);white-space:nowrap;border-radius:8px 8px 0 0;transition:color .12s,background .12s}
.tab:hover{color:var(--ink);background:var(--row)}
.tab[aria-selected="true"]{color:var(--blue-2)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;
  border-radius:3px 3px 0 0;background:var(--blue-2)}
.t-short{display:none}

main{max-width:1180px;margin:0 auto;padding:20px 16px 44px}
.kicker{color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin:0 0 4px}
h1{font:700 29px/1.15 "Roboto Condensed",Roboto,sans-serif;margin:0 0 7px;letter-spacing:.2px}
.lede{color:var(--muted);max-width:72ch;margin:0 0 18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.panel h2{font:700 15px/1.25 "Roboto Condensed",Roboto,sans-serif;margin:0;padding:11px 15px;
  background:var(--blue);color:#fff;letter-spacing:.3px}
.pad{padding:15px}
.btn{border:0;border-radius:8px;padding:10px 15px;font-weight:700;background:var(--blue-2);color:#fff;
  transition:filter .12s,opacity .12s}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--blue-2);border:1px solid var(--line)}
.btn.ghost:hover:not(:disabled){background:var(--row);filter:none}
.btn.big{padding:13px 22px;font-size:16px}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none;background:var(--row)}

/* vote */
.voters{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.vchip{display:flex;align-items:center;gap:9px;text-align:left;background:var(--row);border:2px solid transparent;
  border-radius:9px;padding:8px 10px;min-width:0;transition:border-color .12s,background .12s}
.vchip:hover{border-color:var(--line)}
.vchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.vchip[aria-pressed="true"]{border-color:var(--blue-2);background:var(--blue-soft)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.slot{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);min-height:46px}
.slot:last-child{border-bottom:0}
.rk{width:26px;text-align:right;font:700 17px "Roboto Condensed",sans-serif;color:var(--blue-2);flex:none}
.slot .nm{flex:1;min-width:0}
.nm b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm i{font-style:normal;color:var(--muted);font-size:12.5px}
.slot.empty .nm{color:var(--muted);font-size:13.5px}
.slot.next{background:var(--blue-soft)}
.slot[draggable="true"]{cursor:grab}
.slot.dragging{opacity:.4}
.slot.over{background:var(--blue-soft);box-shadow:inset 0 2px 0 var(--blue-2)}
.grab{flex:none;color:var(--muted);font-size:14px;line-height:1;letter-spacing:-2px;user-select:none}
@media (max-width:760px){.grab{display:none}}
.mini{background:none;border:1px solid var(--line);border-radius:4px;width:30px;height:30px;padding:0;color:var(--muted);font-size:13px}
.mini:hover{color:var(--ink)}
.pool{display:flex;flex-direction:column}
.pick{display:flex;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;width:100%}
.pick:hover{background:var(--row)}
.pick .plus{margin-left:auto;color:var(--blue-2);font-weight:700;font-size:20px;line-height:1}
.done{color:var(--muted);padding:16px;text-align:center;font-size:14px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.hint{color:var(--muted);font-size:13.5px}
.result{margin-top:16px;border-left:4px solid var(--good)}
.result textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:4px;background:var(--row);padding:10px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}

/* status */
.status{font-size:13.5px;color:var(--good);margin-left:4px}
.status.err{color:#c0392b}

/* tables */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font:700 12.5px "Roboto Condensed",sans-serif;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even){background:var(--row)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.teamcell{display:flex;align-items:center;gap:10px;min-width:210px}
.fp{color:var(--muted);font-size:12.5px;margin-left:4px}
.bigrk{font:700 20px "Roboto Condensed",sans-serif;color:var(--blue-2);width:40px;text-align:center}

/* grid */
.grid th.c,.grid td.c{text-align:center;padding:5px 3px;min-width:44px}
.grid td.who{min-width:180px;white-space:nowrap}
.who b{font-weight:500;display:block;font-size:14px}
.who i{font-style:normal;color:var(--muted);font-size:12px}
.cell{display:inline-flex;border-radius:50%;padding:3px;transition:opacity .12s, background .12s}
.cell img{width:34px;height:34px;border-radius:50%;display:block}
.grid.dim .cell{opacity:.18}
.grid.dim .cell.on{opacity:1;background:var(--hl)}
.cell:hover{cursor:pointer}
.lockbar{font-size:13.5px;color:var(--muted);margin:0 0 10px;min-height:20px}
.lockbar b{color:var(--ink)}

/* distribution */
.heat{display:block;min-width:30px;padding:5px 0;border-radius:3px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px}

/* season: bump chart (emphasis form — every team gray, the chosen one in blue) */
.chartwrap{padding:16px 14px 6px}
.bump{width:100%;height:auto;display:block}
.bump .gl{stroke:var(--line);stroke-width:1}
.bump .ctx{fill:none;stroke:var(--ctx);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bump.dim .ctx{stroke-opacity:.5}
.bump .hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.bump .em{fill:none;stroke:var(--em);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.bump .dot{fill:var(--em);stroke:var(--panel);stroke-width:2}
.bump .ax{fill:var(--muted);font:500 11px Roboto,sans-serif}
.bump .lbl{fill:var(--ink);font:700 12px "Roboto Condensed",sans-serif}
.bump .lbl.soft{fill:var(--muted);font-weight:500}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:4px;padding:12px 14px;border-top:1px solid var(--line)}
.lg{display:flex;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:6px;padding:5px 7px;text-align:left;min-width:0;font-size:13px}
.lg:hover{background:var(--row)}
.lg[aria-pressed="true"]{border-color:var(--em);background:var(--blue-soft)}
.lg .av{width:22px;height:22px}
.lg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.lg b{font:700 12px "Roboto Condensed",sans-serif;color:var(--muted);flex:none}
.rkcell{display:block;min-width:28px;padding:5px 0;border-radius:3px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px;font-weight:500}

/* voters */
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700;background:var(--row);color:var(--muted)}
.pill.up{background:rgba(31,138,76,.14);color:var(--good)}
.pill.dn{background:rgba(192,57,43,.14);color:#c0392b}

.empty-state{padding:30px 16px;text-align:center;color:var(--muted)}
.empty-state .btn{margin-top:12px}
.waiting{font-size:13.5px;color:var(--muted);margin:10px 0 0}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding:20px}

.authrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.authrow input{border:1px solid var(--line);border-radius:4px;background:var(--row);padding:9px 10px;width:210px;font:inherit;color:inherit}
.linkish{background:none;border:0;padding:0;color:var(--blue-2);font:inherit;text-decoration:underline}
.banner{background:var(--blue-soft);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:16px;font-size:14px}
.banner.err{border-color:#c0392b}
.mv{font-size:12px;font-weight:700;margin-left:6px}
.mv.up{color:var(--good)} .mv.dn{color:#c0392b} .mv.nw{color:var(--muted);font-weight:500}
.avtxt{display:inline-flex;align-items:center;justify-content:center;font:700 11px Roboto,sans-serif;color:var(--muted)}

/* voter profile */
.phead{display:flex;align-items:center;gap:14px;margin:0 0 16px;flex-wrap:wrap}
.pav{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;background:var(--row)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:13px 15px}
.tile b{display:block;font:700 22px/1.15 "Roboto Condensed",Roboto,sans-serif;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile b.good{color:var(--good)} .tile b.bad{color:var(--bad)}
.tile span{display:block;font-size:13px;font-weight:600;color:var(--ink)}
.tile i{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.clickrow{cursor:pointer}
.clickrow:hover{background:var(--blue-soft)!important}
.whoclick{cursor:pointer}
.whoclick:hover b{color:var(--blue-2);text-decoration:underline}

/* news */
.feed{display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:15px 17px;cursor:pointer;transition:border-color .12s,transform .12s}
.card:hover{border-color:var(--blue-2);transform:translateY(-1px)}
.card h3{font:700 19px/1.25 "Roboto Condensed",Roboto,sans-serif;margin:4px 0 5px}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .kicker{margin:0;display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-weight:400}
.kbadge{display:inline-block;padding:3px 9px;border-radius:999px;font:700 10.5px/1 Roboto,sans-serif;
  letter-spacing:.5px;text-transform:uppercase;background:var(--row);color:var(--muted)}
.kbadge.k-poll{background:var(--blue-soft);color:var(--blue-2)}
.kbadge.k-trade{background:rgba(31,138,76,.15);color:var(--good)}
.kbadge.k-match{background:rgba(242,183,5,.18);color:#8a6d00}
.kbadge.k-injury{background:rgba(192,57,43,.14);color:var(--over)}
.kbadge.k-recap{background:var(--row);color:var(--muted)}
.kbadge.k-satire{background:rgba(120,80,190,.16);color:#6b46b8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kbadge.k-satire{color:#b79bec}}
:root[data-theme="dark"] .kbadge.k-satire{color:#b79bec}
.fiction{margin:18px 0 0;padding:10px 13px;border-left:3px solid rgba(120,80,190,.5);
  background:rgba(120,80,190,.07);border-radius:0 6px 6px 0;font-size:13px;color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kbadge.k-match{color:#f2b705}}
:root[data-theme="dark"] .kbadge.k-match{color:#f2b705}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 13px;
  font:600 13px Roboto,sans-serif;color:var(--muted);transition:all .12s}
.chip:hover{border-color:var(--blue-2);color:var(--ink)}
.chip.on{background:var(--blue-2);border-color:var(--blue-2);color:#fff}
.chip i{font-style:normal;opacity:.65;font-size:11.5px;margin-left:2px}
.grouphd{font:700 12.5px "Roboto Condensed",Roboto,sans-serif;letter-spacing:.6px;text-transform:uppercase;
  color:var(--muted);margin:18px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.feed + .grouphd{margin-top:22px}
.fig{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.fig.big{gap:22px;margin:16px 0 18px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);justify-content:center}
.figteam{display:flex;align-items:center;gap:8px;min-width:0}
.figteam b{font:600 13px Roboto,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fig.big .figteam{flex-direction:column;gap:7px;text-align:center}
.fig.big .figteam b{font-size:14px;max-width:150px}
.figav{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:var(--row)}
.fig.big .figav{width:62px;height:62px;border:2px solid var(--line)}
.figvs{font:700 13px "Roboto Condensed",sans-serif;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
/* Desktop reading: a centred column with generous measure and larger type.
   The old full-width card left a short line length stranded on the left of a
   wide screen, which is what made it look unfinished on a PC. */
.story{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:34px 40px 30px;max-width:760px;margin:0 auto}
.story h1{margin:8px 0 10px;font-size:34px;line-height:1.14;letter-spacing:.1px}
.story .lede{font-size:18px;line-height:1.5;color:var(--muted);margin:0 0 4px;max-width:62ch}
.story .kicker{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-weight:400}
.newshd{max-width:760px;margin:0 auto 14px}
.prose{max-width:64ch}
.prose p{margin:0 0 15px;line-height:1.68;font-size:16.5px}
.prose p:first-child{font-size:17.5px;line-height:1.6}
.prose p:last-child{margin-bottom:0}

/* matchup scoreboard */
.box{margin:18px 0 22px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--row)}
.boxhd{margin:0;padding:8px 14px;font:700 11px Roboto,sans-serif;letter-spacing:.7px;text-transform:uppercase;
  color:var(--muted);background:var(--panel);border-bottom:1px solid var(--line)}
.boxgrid{display:grid;grid-template-columns:1fr 1fr}
.boxside{padding:14px 16px}
.boxside+.boxside{border-left:1px solid var(--line)}
.boxside.fav{background:var(--blue-soft)}
.boxteam{display:flex;align-items:center;gap:9px;margin-bottom:11px;min-width:0}
.boxteam b{font:700 14.5px/1.2 "Roboto Condensed",Roboto,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.boxav{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none;background:var(--panel)}
.boxnums{display:flex;gap:16px;flex-wrap:wrap}
.boxnums span{display:flex;flex-direction:column;gap:1px}
.boxnums i{font-style:normal;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600}

// minutes to the next open/close flip (display only; a DST week can be an hour out)
function minsToFlip(now=new Date()){
  const {dow,hour,min} = etNow(now), t = windowOpen(now) ? {d:4,h:20} : {d:2,h:0};
  let m = ((t.d-dow+7)%7)*1440 + t.h*60 - (hour*60+min);
  return m<=0 ? m+7*1440 : m;
}
const humanMins = m => { const d=Math.floor(m/1440), h=Math.floor((m%1440)/60), mm=m%60;
  return d ? `${d}d ${h}h` : h ? `${h}h ${mm}m` : `${mm}m`; };

/* The week a ballot is FOR. Ballots cast Tue-Thu are the rankings going into
   that week's games, so while the window is shut the next one to open belongs
   to the following week — on a Monday the ballots opening tonight are next
   week's, not the week whose games are finishing. */
function ballotWeek(now=new Date()){
  if(windowOpen(now)) return pollWeekFor(now);
  return pollWeekFor(new Date(now.getTime() + (minsToFlip(now)+1)*60000));
}
const votingOpen = () => windowOpen() && S.week === ballotWeek();
const indexTeams = () => { T = Object.fromEntries(TEAMS.map(t=>[t.id,t])) };
indexTeams();

const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const rec = t => `${t.w}-${t.l}${t.t?`-${t.t}`:""}`;

/* ---------- data ---------- */
async function loadSleeper(){
  try{
    const j = u => fetch(u).then(r=>{if(!r.ok) throw 0; return r.json()});
    const base = `https://api.sleeper.app/v1/league/${LEAGUE_ID}`;
    const [league, users, rosters, state] = await Promise.all([j(base), j(base+"/users"), j(base+"/rosters"), j("https://api.sleeper.app/v1/state/nfl")]);
    SEASON = +league.season || SEASON;
    const U = Object.fromEntries(users.map(u=>[u.user_id,u]));
    const meta = league.metadata || {};
    DIVISIONS = {};
    for(let i=1;i<=(league.settings?.divisions||0);i++) DIVISIONS[i] = meta["division_"+i] || `Division ${i}`;
    PLAYOFF_TEAMS = league.settings?.playoff_teams || 6;
    LAST_REG_WEEK = (league.settings?.playoff_week_start || 15) - 1;
    // league_average_match: every team also plays the league median each week,
    // so a "week" is two results, not one. Verified against week 1: head-to-head
    // plus median reproduces all 12 Sleeper records exactly.
    MEDIAN_MATCH = !!league.settings?.league_average_match;
    TEAMS = rosters.map(r=>{
      const u = U[r.owner_id] || {}, s = r.settings || {};
      const av = u.metadata?.avatar || (u.avatar ? `https://sleepercdn.com/avatars/thumbs/${u.avatar}` : null);
      return {id:r.roster_id, name:u.metadata?.team_name || u.display_name || `Team ${r.roster_id}`,
        owner: MANAGERS[r.roster_id] || u.display_name || "Open slot",
        w:s.wins||0, l:s.losses||0, t:s.ties||0, pf:(s.fpts||0)+(s.fpts_decimal||0)/100, av,
        pp:(s.ppts||0)+(s.ppts_decimal||0)/100,          // optimal-lineup points: roster ceiling
        pa:(s.fpts_against||0)+(s.fpts_against_decimal||0)/100,
        div:s.division||1, players:r.players||[]};
    }).sort((a,b)=>a.id-b.id);
    indexTeams();
    if(league.avatar) document.getElementById("lgav").src = `https://sleepercdn.com/avatars/thumbs/${league.avatar}`;
    if(state.season_start_date) SEASON_START = state.season_start_date;
    CURRENT_WEEK = state.season_type==="regular" ? pollWeekFor() : 1;
    await catchUpRecords();   // fill in any finished week Sleeper has not posted yet
    document.getElementById("foot").textContent = UNOFFICIAL.length
      ? `Records include Week ${UNOFFICIAL.join(" and ")}, counted here from the final scores — Sleeper posts its own totals later on Tuesday. Poll points: 12 for a first-place vote down to 1 for 12th.`
      : `Records and points live from Sleeper. Poll points: 12 for a first-place vote down to 1 for 12th.`;
  }catch(e){
    document.getElementById("foot").textContent = `Couldn't reach Sleeper, showing records from Sep 20. Poll points: 12 for a first-place vote down to 1 for 12th.`;
  }
}

/* ---------- catching up on results Sleeper hasn't posted yet ----------
   Sleeper's roster settings (wins, losses, points for/against) only move when it
   does its own weekly rollover, which lands around Tuesday midday. Ballots open
   Tuesday at midnight. For twelve hours every week the site would otherwise show
   records a full week out of date, to the people actively voting on them.

   So: if an NFL week is finished but isn't in Sleeper's totals yet, apply it here
   from the raw matchups — head-to-head and the league median both. Sleeper's own
   numbers take over again the moment it catches up, because the check is simply
   how many games its record already accounts for. */
let UNOFFICIAL = [], RECORDED_WEEKS = 0, OFFICIAL_WEEKS = 0;

async function weekComplete(w){
  try{
    const g = await fetch(`https://api.sleeper.app/scores/nfl/regular/${SEASON}/${w}`).then(r=>r.ok?r.json():null);
    const arr = Array.isArray(g) ? g : g ? Object.values(g) : [];
    if(!arr.length) return false;
    return arr.every(x => x && (x.status==="complete" || (x.metadata && x.metadata.is_over===true)));
  }catch(e){ return false }
}

async function catchUpRecords(){
  const perWeek = MEDIAN_MATCH ? 2 : 1;
  const played = (TEAMS[0]?.w||0)+(TEAMS[0]?.l||0)+(TEAMS[0]?.t||0);
  RECORDED_WEEKS = Math.floor(played/perWeek);
  // Keep Sleeper's own figures before we add to them. ppts (optimal-lineup
  // points) can't be recomputed from matchups, so efficiency has to be measured
  // on the weeks where points-for and points-possible still cover the same
  // ground — otherwise catching one up and not the other reads as >100%.
  OFFICIAL_WEEKS = RECORDED_WEEKS;
  TEAMS.forEach(t=>{ t.pfOff = t.pf; t.ppOff = t.pp; });
  UNOFFICIAL = [];
  for(let w = RECORDED_WEEKS+1; w <= LAST_REG_WEEK; w++){
    if(!(await weekComplete(w))) break;
    let d;
    try{ d = await fetch(`https://api.sleeper.app/v1/league/${LEAGUE_ID}/matchups/${w}`).then(r=>r.ok?r.json():null) }catch(e){ break }
    if(!d || !d.length) break;
    const pts = {}; d.forEach(m=>{ if(typeof m.points==="number") pts[m.roster_id]=m.points });
    if(Object.keys(pts).length < TEAMS.length) break;

    const byId = {};
    d.forEach(m=>{ if(m.matchup_id!=null) (byId[m.matchup_id]=byId[m.matchup_id]||[]).push(m) });
    const pairs = Object.values(byId).filter(p=>p.length===2);
    if(pairs.length !== TEAMS.length/2) break;

    pairs.forEach(([a,b])=>{
      const A=T[a.roster_id], B=T[b.roster_id]; if(!A||!B) return;
      A.pf+=a.points; A.pa+=b.points;
      B.pf+=b.points; B.pa+=a.points;
      if(a.points>b.points){ A.w++; B.l++ }
      else if(b.points>a.points){ B.w++; A.l++ }
      else { A.t=(A.t||0)+1; B.t=(B.t||0)+1 }
    });
    if(MEDIAN_MATCH){
      const vals=Object.values(pts).sort((x,y)=>x-y), n=vals.length;
      const med = n%2 ? vals[(n-1)/2] : (vals[n/2-1]+vals[n/2])/2;
      TEAMS.forEach(t=>{
        const p=pts[t.id]; if(p==null) return;
        if(p>med) t.w++; else if(p<med) t.l++; else t.t=(t.t||0)+1;
      });
    }
    UNOFFICIAL.push(w);
    RECORDED_WEEKS = w;
  }
  return UNOFFICIAL;
}

let sb = null;
const configured = !SUPABASE_URL.includes("YOUR-PROJECT") && !SUPABASE_KEY.startsWith("YOUR-");
/* Refreshing ballots without stealing work in progress.
   Realtime pushes updates, but a websocket that quietly dropped would leave the
   grid stale forever, so this also runs on a timer and on tab changes. It only
   re-renders when the data genuinely moved — otherwise someone mid-ballot or
   mid-comment would have it wiped from under them every thirty seconds. */
const ballotSig = () => S.ballots.map(b=>b.week+":"+b.voter+":"+(b.at||"")).sort().join("|");
function busyComposing(){
  if(S.tab==="vote" && S.ranked.length) return true;         // part-way through a ballot
  if(S.tab==="news" && S.article && CM.draft.trim()) return true;  // part-way through a comment
  return false;
}
async function refreshBallots(){
  if(!sb || !configured) return;
  const before = ballotSig();
  const {data,error} = await sb.from("ballots").select("season,week,voter,ranking,updated_at").eq("season",SEASON);
  if(error || !data) return;
  const next = data.map(b=>({week:b.week, voter:b.voter, order:b.ranking, at:b.updated_at}));
  const sig = next.map(b=>b.week+":"+b.voter+":"+(b.at||"")).sort().join("|");
  if(sig === before) return;                                  // nothing changed, leave the page alone
  S.ballots = next; S.loaded = true;
  if(busyComposing()) return;                                 // data is fresh; redraw when they're done
  if(S.tab==="vote" && !S.ranked.length) preloadOwn();
  render();
}

async function loadBallots(){
  if(!sb) return;
  const {data,error} = await sb.from("ballots").select("season,week,voter,ranking,updated_at").eq("season",SEASON);
  if(error){S.error="Couldn't load ballots. Refresh to try again."; render(); return}
  S.error=null; S.loaded=true;
  S.ballots = data.map(b=>({week:b.week, voter:b.voter, order:b.ranking, at:b.updated_at}));
  if(S.tab==="vote" && !S.ranked.length) preloadOwn();
  render();
}
function subscribe(){
  sb.channel("ballots-live")
    .on("postgres_changes",{event:"*",schema:"public",table:"ballots"},()=>loadBallots())
    .subscribe();
}

/* ---------- tally ---------- */
const weekBallots = w => S.ballots.filter(b=>b.week===w).sort((a,b)=>a.voter-b.voter);
function tally(w){
  const bs = weekBallots(w);
  const rows = TEAMS.map(t=>({t,pts:0,fp:0,ranks:[]}));
  const R = Object.fromEntries(rows.map(r=>[r.t.id,r]));
  bs.forEach(b=>b.order.forEach((id,i)=>{const r=R[id]; if(!r) return; r.pts+=12-i; r.ranks.push(i+1); if(i===0) r.fp++}));
  rows.forEach(r=>{r.avg=r.ranks.length?r.ranks.reduce((a,b)=>a+b,0)/r.ranks.length:null; r.hi=r.ranks.length?Math.min(...r.ranks):null; r.lo=r.ranks.length?Math.max(...r.ranks):null});
  rows.sort((a,b)=>b.pts-a.pts||b.fp-a.fp||b.t.pf-a.t.pf);
  return {bs,rows};
}

const main = document.getElementById("main");
const header = (title,lede) => `<p class="kicker">Week ${S.week} WCXC Power Poll</p><h1>${title}</h1>${lede?`<p class="lede">${lede}</p>`:""}`;
function banner(){
  if(!configured) return `<div class="banner err">Voting isn't connected yet. Add your Supabase URL and key at the top of index.html.</div>`;
  if(S.error) return `<div class="banner err">${esc(S.error)}</div>`;
  return "";
}
const emptyState = () => `<div class="panel empty-state">${S.loaded||!configured?`No ballots for Week ${S.week} yet. Be the first.`:"Loading ballots…"}<br><button class="btn" data-go="vote">Cast ballot</button></div>`;
function waitingOn(bs){
  const have = new Set(bs.map(b=>b.voter)), miss = TEAMS.filter(t=>!have.has(t.id));
  return miss.length ? `<p class="waiting">Still waiting on: ${miss.map(t=>esc(t.name)).join(", ")}</p>` : `<p class="waiting">All ${TEAMS.length} ballots are in.</p>`;
}
function preloadOwn(){
  const mine = S.ballots.find(b=>b.week===S.week && b.voter===S.voter);
  S.ranked = mine ? [...mine.order] : [];
}

function renderClosed(){
  const mine = S.voter ? S.ballots.find(b=>b.week===S.week && b.voter===S.voter) : null;
  const nextWeek = ballotWeek(), onPollWeek = S.week === nextWeek, flip = humanMins(minsToFlip());
  const bs = weekBallots(S.week);
  let title, lede, big, sub;
  if(onPollWeek){                                  // right week, outside the window
    title = "Voting is closed right now";
    lede  = `Ballots for Week ${S.week} open Tuesday at 12:00 AM and close Thursday at 8:00 PM, Eastern. Everything else on the site stays open.`;
    big   = `Week ${S.week} ballots open in ${flip}`;
    sub   = "Tuesday 12:00 AM – Thursday 8:00 PM ET, every week.";
  } else if(S.week < nextWeek){
    title = "Week " + S.week + " is in the books";
    lede  = `That week is settled, so ballots are closed — but all of its results are still here. The poll, every ballot, the spread, and the voter report all work for past weeks.`;
    big   = `Week ${S.week} is finished`;
    sub   = `${bs.length} ballot${bs.length===1?"":"s"} ${bs.length===1?"was":"were"} cast. ${windowOpen()?`Voting is open now for Week ${nextWeek}.`:`Week ${nextWeek} ballots open in ${flip}.`}`;
  } else {
    title = "Week " + S.week + " hasn't opened yet";
    lede  = `Ballots open Tuesday at 12:00 AM Eastern of that week's game week and close Thursday at 8:00 PM.`;
    big   = `Week ${S.week} isn't open yet`;
    sub   = `${windowOpen()?`Voting is open now for Week ${nextWeek}.`:`Week ${nextWeek} ballots open in ${flip}.`}`;
  }
  main.innerHTML = banner()+header(title,lede)+
  `<section class="panel"><div class="closed">
     <p class="big">${esc(big)}</p>
     <p class="hint" style="margin:0">${esc(sub)}</p>
     <div class="actions" style="justify-content:center;margin-top:15px">
       ${!onPollWeek?`<button class="btn" id="gonow">Go to Week ${nextWeek}</button>`:""}
       ${bs.length?`<button class="btn ghost" data-go="poll">Week ${S.week} poll</button>
       <button class="btn ghost" data-go="grid">Every ballot</button>`:""}
     </div>
   </div></section>`+
  (mine?`<section class="panel" style="margin-top:16px"><h2>Your Week ${S.week} ballot</h2>
     ${mine.order.map((id,i)=>`<div class="roballot"><span class="rk">${i+1}</span>${img(id)}<span class="nm"><b>${esc(T[id]?.name||"")}</b></span></div>`).join("")}
   </section>`:"")+
  (bs.length?`<p class="hint" style="margin-top:14px">All ${bs.length} Week ${S.week} ballot${bs.length===1?"":"s"} — everyone's, not just yours — stay readable on the <b>Poll</b>, <b>Grid</b>, <b>Spread</b>, <b>Season</b> and <b>Voters</b> tabs.</p>`:"");
}

function renderVote(){
  if(!votingOpen()) return renderClosed();
  const v=S.voter, next=S.ranked.length, n=TEAMS.length;
  const mine = S.ballots.find(b=>b.week===S.week && b.voter===v);
  let slots="";
  for(let i=0;i<n;i++){
    const id=S.ranked[i];
    if(id){const t=T[id];
      slots+=`<div class="slot" draggable="true" data-i="${i}"><span class="grab" aria-hidden="true">⠿</span><span class="rk">${i+1}</span>${img(id)}<span class="nm"><b>${esc(t.name)}</b><i>${rec(t)} · ${t.pf.toFixed(1)} pts</i></span>
      <button class="mini" data-up="${i}" aria-label="Move ${esc(t.name)} up" ${i===0?"disabled":""}>▲</button>
      <button class="mini" data-dn="${i}" aria-label="Move ${esc(t.name)} down" ${i===S.ranked.length-1?"disabled":""}>▼</button>
      <button class="mini" data-rm="${i}" aria-label="Remove ${esc(t.name)}">✕</button></div>`;
    } else slots+=`<div class="slot empty ${i===next?"next":""}"><span class="rk">${i+1}</span><span class="nm">${i===next?"Tap a team to put it here":""}</span></div>`;
  }
  const left=TEAMS.filter(t=>!S.ranked.includes(t.id)).sort((a,b)=>b.w-a.w||b.pf-a.pf);
  const pool=left.length?left.map(t=>`<button class="pick" data-add="${t.id}">${img(t.id)}<span class="nm"><b>${esc(t.name)}</b><i>${rec(t)} · ${t.pf.toFixed(1)} pts · ${esc(t.owner)}</i></span><span class="plus" aria-hidden="true">+</span></button>`).join("")
    :`<div class="done">Every team is ranked. Drag a row or use the arrows to fine-tune, then submit.</div>`;
  const lastWeek = v ? S.ballots.find(b=>b.week===S.week-1 && b.voter===v) : null;
  const quick = v && (lastWeek || left.length) ? `<div style="display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)">
    ${lastWeek?`<button class="btn ghost" data-fill="last">Start from Week ${S.week-1}</button>`:""}
    ${left.length?`<button class="btn ghost" data-fill="record">Fill rest by record</button>`:""}
   </div>` : "";
  const ready = v && S.ranked.length===n && configured && !S.saving;
  const savedPw = v ? store.get("wcxc.pw."+v,"") : "";
  const pwVal = S.pwDraft!==null ? S.pwDraft : savedPw;
  const hint = !v ? "Pick your team first." : S.ranked.length<n ? `${n-S.ranked.length} teams left to rank.` : mine ? "Submitting replaces your earlier ballot." : "Ready to submit.";
  main.innerHTML = banner()+header(mine?"Update your ballot":"Cast your ballot","Pick your team, then tap teams in the order you'd rank them, best first. Drag a row or use the arrows to fine-tune.")+
  `<section class="panel"><h2>1. Who's voting?</h2><div class="pad"><div class="voters">${TEAMS.map(t=>`<button class="vchip" data-voter="${t.id}" aria-pressed="${v===t.id}">${img(t.id)}<span>${esc(t.name)}</span></button>`).join("")}</div>
   ${v?`<div class="authrow">
     <label for="pw"><b>Team password</b></label>
     <input id="pw" type="password" autocomplete="current-password" minlength="4" value="${esc(pwVal)}" placeholder="Your team's password">
     <span class="hint">Your first ballot sets your team's password. Use the same one every week so nobody else can vote as you.</span>
     ${savedPw?`<button type="button" class="linkish" id="forgetpw">Not you? Clear saved password</button>`:""}
   </div>`:""}
  </div></section>
  <div class="cols">
    <section class="panel ballot-panel"><h2>2. Your Week ${S.week} ballot (${S.ranked.length}/${n})</h2>${slots}</section>
    <section class="panel pool-panel"><h2>Teams left to rank (${left.length})</h2>${quick}<div class="pool">${pool}</div></section>
  </div>
  <div class="actions stick">
    <button class="btn big" id="submit" ${ready?"":"disabled"}>${S.saving?"Submitting…":mine?"Update ballot":"Submit ballot"}</button>
    ${S.ranked.length?`<button class="btn ghost" id="reset">Start over</button>`:""}
    <span class="hint">${hint}</span>
  </div>
  <p class="status ${S.msg?.err?"err":""}" id="submitStatus" role="status" style="margin:10px 0 0">${S.msg?esc(S.msg.text):""}</p>`;
}

function renderPoll(){
  const {bs,rows}=tally(S.week);
  if(!bs.length){main.innerHTML=banner()+header("Poll")+emptyState();return}
  const prev = tally(S.week-1), prevRank = {};
  if(prev.bs.length) prev.rows.forEach((r,i)=>prevRank[r.t.id]=i+1);
  const mv = (id,i) => { if(!prev.bs.length) return ""; const p=prevRank[id]; const d=p-(i+1);
    return d>0?`<span class="mv up">▲${d}</span>`:d<0?`<span class="mv dn">▼${-d}</span>`:`<span class="mv nw">–</span>` };
  main.innerHTML = banner()+header("Poll")+
  `<section class="panel"><h2>Week ${S.week} WCXC Power Poll · ${bs.length} ballot${bs.length>1?"s":""}</h2><div class="scroll"><table class="cards">
   <thead><tr><th class="num">Rank</th><th>Team</th><th>Record</th><th class="num">PF</th><th class="num">Points</th><th class="num">Avg</th><th class="num">High</th><th class="num">Low</th></tr></thead><tbody>
   ${rows.map((r,i)=>`<tr><td class="bigrk">${i+1}</td><td><div class="teamcell">${img(r.t.id)}<div class="nm"><b>${esc(r.t.name)}${r.fp?`<span class="fp">(${r.fp})</span>`:""}${mv(r.t.id,i)}</b><i>${esc(r.t.owner)}</i></div></div></td>
   <td class="stat" data-l="Record">${rec(r.t)}</td><td class="num stat" data-l="PF">${r.t.pf.toFixed(1)}</td><td class="num stat" data-l="Points"><b>${r.pts}</b></td><td class="num stat" data-l="Avg">${r.avg?r.avg.toFixed(2):"–"}</td><td class="num stat" data-l="High">${r.hi??"–"}</td><td class="num stat" data-l="Low">${r.lo??"–"}</td></tr>`).join("")}
   </tbody></table></div></section>${waitingOn(bs)}
   <div class="actions"><button class="btn ghost" id="copypoll">Copy results</button><span class="hint">Number in parentheses is first-place votes.${prev.bs.length?" Arrows show movement from last week's poll.":""}</span></div>`;
}

function renderGrid(){
  const {bs}=tally(S.week);
  if(!bs.length){main.innerHTML=banner()+header("Ballot grid view")+emptyState();return}
  const on=S.lock||S.hover;
  main.innerHTML = banner()+header("Ballot grid view","Every ballot, pick by pick. Hover a team logo to highlight it across every ballot, or click to lock the highlight. Tap a voter's name on the left for their full report.")+
  `<p class="lockbar" id="lockbar"></p><section class="panel"><div class="scroll"><table class="grid matrix ${on?"dim":""}" id="grid">

// Emphasis chart: all 12 teams in a recessive gray, the chosen one in blue.

/* ---------- playoff odds ----------
   League rules, from Sleeper: 3 divisions, 6 playoff teams, regular season
   through week 14. Each division winner qualifies, plus the next 3 best by
   record then points for. The top 2 division winners get byes; the remaining
   4 are seeded 3-6 on record then PF, and the bracket reseeds every round.  */
let SCHED = null, ODDS = null, oddsRunning = false, PROJ = null;

// Built by scripts/projections.mjs. Optional: if it is missing or stale the
// odds fall back to the results-based model rather than failing to render.
async function loadProjections(){
  if(!PROJ) PROJ = await fetch("projections.json",{cache:"no-cache"})
    .then(r=>r.ok?r.json():null).catch(()=>null);
  return PROJ;
}

async function loadSchedule(){
  const base = `https://api.sleeper.app/v1/league/${LEAGUE_ID}/matchups/`;
  // The records include official totals plus any finished weeks caught up here.
  // Start after those results even if Sleeper's state lags, advances before its
  // totals, or is unreachable. The snapshot fallback also carries banked results.
  const perWeek = MEDIAN_MATCH ? 2 : 1;
  const played = (TEAMS[0]?.w||0)+(TEAMS[0]?.l||0)+(TEAMS[0]?.t||0);
  const firstOpen = Math.floor(played/perWeek)+1;
  const weeks = [];
  for(let w=1; w<=LAST_REG_WEEK; w++) weeks.push(w);
  const all = await Promise.all(weeks.map(w =>
    fetch(base+w).then(r=>r.ok?r.json():[]).then(d=>({w, d:d||[]})).catch(()=>({w, d:[]}))));
  const upcoming = [], scores = {}, byWeek = {};
  TEAMS.forEach(t=>scores[t.id]=[]);
  all.sort((a,b)=>a.w-b.w).forEach(({w,d})=>{
    const byId = {};
    d.forEach(m=>{ if(m.matchup_id==null) return; (byId[m.matchup_id]=byId[m.matchup_id]||[]).push(m) });
    const pairs = Object.values(byId).filter(p=>p.length===2).map(p=>[p[0].roster_id,p[1].roster_id]);
    if(w < firstOpen){
      d.forEach(m=>{ if(scores[m.roster_id] && typeof m.points==="number") scores[m.roster_id].push(m.points) });
      // per-week detail for the Analysis tab: what each team scored, who they
      // played, and both results that week (head-to-head and the median)
      const pts = {}; d.forEach(m=>{ if(typeof m.points==="number") pts[m.roster_id]=m.points });
      const vals = Object.values(pts).sort((a,b)=>a-b), n=vals.length;
      const med = n ? (n%2 ? vals[(n-1)/2] : (vals[n/2-1]+vals[n/2])/2) : 0;
      const wk = {};
      Object.keys(pts).forEach(id=>{ wk[id]={pf:pts[id], pa:0, h2h:null, medWin:pts[id]>med?1:0, med}; });
      Object.values(byId).forEach(p=>{ if(p.length!==2) return;
        const [a,b]=p;
        if(wk[a.roster_id]){ wk[a.roster_id].pa=b.points; wk[a.roster_id].h2h=a.points>b.points?1:0; wk[a.roster_id].opp=b.roster_id; }
        if(wk[b.roster_id]){ wk[b.roster_id].pa=a.points; wk[b.roster_id].h2h=b.points>a.points?1:0; wk[b.roster_id].opp=a.roster_id; }
      });
      byWeek[w]=wk;
    } else if(pairs.length){
      upcoming.push({w, pairs});
    }
  });
  SCHED = {weeks:upcoming, scores, byWeek, firstOpen};
  return SCHED;
}

/* Score model, two levels.
     talent_i ~ how good a team actually is        (unknown, estimated)
     score    ~ Normal(talent_i, noise)            (week-to-week bounce)

   Separating these matters. Early in a season the observed spread between teams
   is mostly noise, not talent, so treating a one-game average as a team's true
   level is what makes odds look far more decided than they are. Here the
   shrinkage weight is *derived* from the variance ratio rather than picked, and
   the leftover uncertainty in each team's talent is carried into the simulation
   instead of being thrown away. */
/* Preferred model: what each roster is PROJECTED to score, week by week.
   Odds are a forecast, so they belong on forward-looking inputs. Results already
   banked stay as wins; they just stop being evidence about how good a team is.
   projections.json is built by scripts/projections.mjs — best legal lineup from
   Sleeper's per-week player projections under league scoring, rescaled to the
   level this league actually scores at. Per-week, so byes and injuries land in
   the right week instead of being smeared across the season. */
function projStrength(){
  const weeks = SCHED.weeks.map(x=>x.w);
  if(!PROJ || !PROJ.weeks || Number(PROJ.season)!==Number(SEASON)) return null;
  const have = w => PROJ.weeks[w] && TEAMS.every(t=>typeof PROJ.weeks[w][t.id]==="number");
  if(!weeks.length || !weeks.every(have)) return null;   // stale file: fall back

  const mean = a => a.reduce((x,y)=>x+y,0)/a.length;
  const teamMean = {}; TEAMS.forEach(t=>teamMean[t.id]=mean(weeks.map(w=>PROJ.weeks[w][t.id])));
  // Playoff rounds sit past the last projected week; there, a team's average.
  const muAt = (id,w) => PROJ.weeks[w] ? PROJ.weeks[w][id] : teamMean[id];
  const lgMean = mean(TEAMS.map(t=>teamMean[t.id]));

  /* Two things separate a projection from a result: weekly bounce, and the
     projection simply being wrong about a team. Completed weeks measure both
     together as residuals; only the part that repeats per team is real. */
  const hist = PROJ.history||{}, resid={};
  TEAMS.forEach(t=>resid[t.id]=[]);
  Object.keys(hist).forEach(w=>TEAMS.forEach(t=>{
    const r=hist[w][t.id];
    if(r && typeof r.actual==="number" && typeof r.proj==="number") resid[t.id].push(r.actual-r.proj);
  }));
  const rows = TEAMS.map(t=>resid[t.id]).filter(a=>a.length);
  const games = rows.length ? Math.min(...rows.map(a=>a.length)) : 0;

  // pooled weekly noise, with a weak prior so two weeks can't set the spread
  const PRIOR_SD = 28, PRIOR_DF = 8;
  let ss=0, n=0;
  rows.forEach(xs=>{ if(xs.length<2) return; const m=mean(xs);
    xs.forEach(x=>{ ss+=(x-m)**2 }); n+=xs.length-1; });
  const noiseVar = (ss + PRIOR_DF*PRIOR_SD**2)/(n + PRIOR_DF);
  const sd = Math.sqrt(noiseVar);

  /* How wrong the projections are about a given team. Take the spread of each
     team's average residual and remove the part explained by weekly noise; what
     survives is repeatable projection error.
     This needs a real prior, not a token one. A projection is a snapshot of
     today's roster played optimally: it cannot know about the trades still to
     come, the injuries still to happen, or which managers actually start their
     best lineup. Two weeks of residuals can't measure that, and with it set near
     zero the sim hands out 0% and 100% in September. ±10 a week is the standing
     assumption, and the observed residuals pull it around as they accumulate. */
  const avgResid = TEAMS.map(t=>resid[t.id].length?mean(resid[t.id]):0);
  const varOf = a => a.length>1 ? a.reduce((s,x)=>s+(x-mean(a))**2,0)/(a.length-1) : 0;
  const PRIOR_BIAS_SD = 10, PRIOR_W = 6;
  const seen = Math.max(varOf(avgResid) - noiseVar/Math.max(1,games), 0);
  const biasSd = Math.sqrt((PRIOR_W*PRIOR_BIAS_SD**2 + games*seen)/(PRIOR_W + games));

  const se={}; TEAMS.forEach(t=>se[t.id]=biasSd);
  return {muAt, mu:teamMean, se, sd, lgMean, games, projected:true,
          biasSd, weeksLeft:weeks.length, generated:PROJ.generated, scale:PROJ.scale};
}

function strength(){
  const p = projStrength();
  if(p) return p;
  const {scores}=SCHED;
  const all = Object.values(scores).flat();
  const lgMean = all.length ? all.reduce((a,b)=>a+b,0)/all.length : 110;
  const varOf = a => a.length>1 ? a.reduce((s,x)=>s+(x-a.reduce((p,q)=>p+q,0)/a.length)**2,0)/(a.length-1) : 0;

  const perTeam = TEAMS.map(t=>scores[t.id]||[]);
  const games = Math.min(...perTeam.map(a=>a.length));

  /* What a team scored is one reading of how good they are; what their roster
     COULD have scored is another, and a cleaner one, because it strips out
     start/sit calls. Sleeper gives both (fpts and ppts). A roster that keeps
     leaving 40 points on the bench is better than its results look, and a
     roster squeezing 100% out of a thin bench is worse. Weight them equally:
     lineup management is a real, repeatable skill, and so is roster talent. */
  // both sides of this ratio must cover the same weeks - see catchUpRecords
  const totF = TEAMS.reduce((a,t)=>a+(t.pfOff!=null?t.pfOff:t.pf||0),0);
  const totP = TEAMS.reduce((a,t)=>a+(t.ppOff!=null?t.ppOff:t.pp||0),0);
  const lgEff = totP>0 ? Math.min(1, totF/totP) : 1;  // how much of its ceiling the league realises
  const ppWeeks = OFFICIAL_WEEKS || games || 1;
  const useCeiling = totP>0 && games>0;
  const teamAvg = perTeam.map((a,i)=>{
    const actual = a.length ? a.reduce((x,y)=>x+y,0)/a.length : lgMean;
    if(!useCeiling || !(TEAMS[i].ppOff!=null?TEAMS[i].ppOff:TEAMS[i].pp)) return actual;
    const pp = TEAMS[i].ppOff!=null ? TEAMS[i].ppOff : TEAMS[i].pp;
    const ceiling = (pp/Math.max(1,ppWeeks))*lgEff;
    return 0.5*actual + 0.5*ceiling;
  });
  const crossVar = Math.max(varOf(teamAvg), 1);

  // pooled within-team variance — only measurable once a team has 2+ games
  let ss=0, n=0;
  perTeam.forEach(xs=>{
    if(xs.length<2) return;
    const m=xs.reduce((a,b)=>a+b,0)/xs.length;
    xs.forEach(x=>{ ss+=(x-m)**2 }); n+=xs.length-1;
  });

  let noiseVar, talentVar;
  if(n>0){
    noiseVar  = ss/n;
    talentVar = Math.max(crossVar - noiseVar/Math.max(1,games), 0.05*crossVar);
  }else{
    // One game each: talent and noise are not separable. Assume most of the
    // observed spread is weekly bounce, which is what fantasy scoring looks like.
    noiseVar  = 0.80*crossVar;
    talentVar = 0.20*crossVar;
  }
  const noise = Math.max(12, Math.sqrt(noiseVar));
  // shrinkage weight IS the variance ratio — how many games it takes to outweigh the prior
  const PRIOR = Math.min(12, Math.max(1, noiseVar/Math.max(talentVar,1)));

  const mu={}, se={};
  TEAMS.forEach((t,i)=>{
    const n = perTeam[i].length;
    // teamAvg already blends actual output with roster ceiling; shrink it toward
    // the league mean by the derived weight
    mu[t.id] = (teamAvg[i]*n + PRIOR*lgMean) / (n + PRIOR);
    // posterior sd of that estimate: still-unknown talent, carried into the sim
    se[t.id] = Math.sqrt(talentVar * PRIOR/(PRIOR + n));
  });
  return {mu, muAt:id=>mu[id], se, sd:noise, lgMean, prior:PRIOR, talentSd:Math.sqrt(talentVar),
          games, lgEff, usedCeiling:useCeiling, projected:false};
}

let spare=null;
function gauss(){                                    // Box-Muller with a cached second draw
  if(spare!==null){const s=spare; spare=null; return s}
  let u=0,v=0,s=0;
  do{ u=Math.random()*2-1; v=Math.random()*2-1; s=u*u+v*v }while(s===0||s>=1);
  const f=Math.sqrt(-2*Math.log(s)/s);
  spare=v*f; return u*f;
}

function seedField(st){
  // st: {id:{w,l,pf}} for the full season
  const arr = TEAMS.map(t=>({id:t.id, div:t.div, w:st[t.id].w, pf:st[t.id].pf}));
  const better = (a,b)=> b.w-a.w || b.pf-a.pf;
  const winners = [];
  Object.keys(DIVISIONS).length
    ? Object.keys(DIVISIONS).forEach(d=>{
        const inDiv = arr.filter(x=>String(x.div)===String(d)).sort(better);
        if(inDiv.length) winners.push(inDiv[0]);
      })
    : null;
  if(!winners.length){                               // no divisions configured: top seeds by record
    const s=arr.slice().sort(better); return s.slice(0,PLAYOFF_TEAMS);
  }
  const wIds = new Set(winners.map(x=>x.id));
  const rest = arr.filter(x=>!wIds.has(x.id)).sort(better);
  const wildcards = rest.slice(0, Math.max(0, PLAYOFF_TEAMS - winners.length));
  const byes = winners.slice().sort(better).slice(0,2);                    // seeds 1-2
  const byeIds = new Set(byes.map(x=>x.id));
  const remaining = winners.filter(x=>!byeIds.has(x.id)).concat(wildcards).sort(better);  // seeds 3-6
  return {seeds: byes.concat(remaining), winners, byes};
}

function simulate(sims=10000){
  const S0=strength(), {mu,muAt,se,sd,prior,talentSd}=S0;
  const base={};
  TEAMS.forEach(t=>base[t.id]={w:t.w, l:t.l, pf:t.pf});
  const acc={};
  TEAMS.forEach(t=>acc[t.id]={po:0,div:0,bye:0,final:0,title:0,w:0,seed:0,seedN:0});
  const ids = TEAMS.map(t=>t.id);
  let draw, beat;

  for(let s=0;s<sims;s++){
    // One draw of "how good each team really is" per simulated season. Because
    // it's fixed for the whole run, being better than one game suggested helps
    // in every remaining week — which is what actually moves season-long odds.
    // An offset, not a level: a team that beats its projection does so in every
    // remaining week, which is what moves season-long odds.
    const off={};
    ids.forEach(id=>{ off[id]=gauss()*se[id] });
    draw = (id,w) => muAt(id,w) + off[id] + gauss()*sd;
    // Playoff rounds fall after the last projected week; use the team's average.
    beat = (a,b) => draw(a) >= draw(b) ? a : b;
    const st={};
    TEAMS.forEach(t=>st[t.id]={w:base[t.id].w, l:base[t.id].l, pf:base[t.id].pf});
    SCHED.weeks.forEach(wk=>{
      const sc={};
      ids.forEach(id=>{ const v=draw(id,wk.w); sc[id]=v; st[id].pf+=v });
      // head-to-head
      wk.pairs.forEach(([a,b])=>{
        if(sc[a]>=sc[b]){ st[a].w++; st[b].l++ } else { st[b].w++; st[a].l++ }
      });
      // second game each week: everyone also plays the league median
      if(MEDIAN_MATCH){
        const sorted=ids.map(id=>sc[id]).sort((x,y)=>x-y);
        const n=sorted.length;
        const med = n%2 ? sorted[(n-1)/2] : (sorted[n/2-1]+sorted[n/2])/2;
        ids.forEach(id=>{ if(sc[id]>med) st[id].w++; else st[id].l++ });
      }
    });
    const f=seedField(st);
    const seeds=f.seeds||f, winners=f.winners||[], byes=f.byes||[];
    seeds.forEach((x,i)=>{ acc[x.id].po++; acc[x.id].seed+=i+1; acc[x.id].seedN++ });
    winners.forEach(x=>acc[x.id].div++);
    byes.forEach(x=>acc[x.id].bye++);
    TEAMS.forEach(t=>acc[t.id].w+=st[t.id].w);

    if(seeds.length>=6){
      const id=i=>seeds[i].id;
      const r1a=beat(id(2),id(5)), r1b=beat(id(3),id(4));          // 3v6, 4v5
      const seedOf=x=>seeds.findIndex(s2=>s2.id===x);
      const alive=[r1a,r1b].sort((x,y)=>seedOf(y)-seedOf(x));      // worst seed first
      const semiA=beat(id(0), alive[0]);                            // 1 v worst remaining
      const semiB=beat(id(1), alive[1]);
      acc[semiA].final++; acc[semiB].final++;
      acc[beat(semiA,semiB)].title++;
    }
  }
  const out=TEAMS.map(t=>({
    t,
    po:acc[t.id].po/sims, div:acc[t.id].div/sims, bye:acc[t.id].bye/sims,
    final:acc[t.id].final/sims, title:acc[t.id].title/sims,
    projW:acc[t.id].w/sims,
    seed:acc[t.id].seedN?acc[t.id].seed/acc[t.id].seedN:null
  })).sort((a,b)=>b.po-a.po||b.title-a.title||b.projW-a.projW);
  const perWeek = MEDIAN_MATCH ? 2 : 1;
  return {rows:out, sims, sd, perWeek, prior, talentSd,
          projected:S0.projected, biasSd:S0.biasSd, projMu:S0.mu, lgMean:S0.lgMean, scale:S0.scale,
          weeksLeft: SCHED.weeks.length,
          gamesLeft: SCHED.weeks.length*perWeek,
          totalGames: LAST_REG_WEEK*perWeek};
}

/* ---------- news ----------
   Articles are written ahead of time by a scheduled job and committed as
   news.json; the page only reads them. Bodies are plain-text paragraphs and are
   escaped on the way in — nothing generated ever becomes markup.            */
let NEWS = null;
async function loadNews(){
  try{
    const r = await fetch("news.json", {cache:"no-cache"});
    if(!r.ok) throw 0;
    const j = await r.json();
    NEWS = Array.isArray(j.articles) ? j.articles : [];
  }catch(e){ NEWS = []; }
  if(S.tab==="news") render();
}

const KINDS = {
  poll:    {label:"Poll",    cls:"k-poll"},
  trade:   {label:"Trade",   cls:"k-trade"},
  matchup: {label:"Matchup", cls:"k-match"},
  injury:  {label:"Injury",  cls:"k-injury"},
  recap:   {label:"Recap",   cls:"k-recap"},
  // Invented filler for quiet days. Badged loudly and footnoted so it can never
  // be mistaken for a real report — these put words in real players' mouths.
  satire:  {label:"Satire",  cls:"k-satire", fiction:true}
};
const artDate = d => { try{ return new Date(d).toLocaleDateString([], {month:"short", day:"numeric"}) }catch(e){ return "" } };
const paras = b => (Array.isArray(b)?b:String(b||"").split(/\n{2,}/))
  .filter(p=>String(p).trim()).map(p=>`<p>${esc(String(p).trim())}</p>`).join("");

/* Artwork comes from the league itself — team avatars off Sleeper's CDN, which
   the CSP already allows. Two teams renders as a head-to-head; more renders as
   a strip. No external image hosting, and every picture is relevant by
   construction. */
function artFigure(a, big){
  const ids = (a.teams||[]).map(Number).filter(id=>T[id]);
  if(!ids.length) return "";
  const cls = big ? "fig big" : "fig";
  if(ids.length===2){
    return `<div class="${cls} vs">
      <span class="figteam">${img(ids[0],"figav")}<b>${esc(shortName(T[ids[0]].name))}</b></span>
      <span class="figvs">vs</span>
      <span class="figteam">${img(ids[1],"figav")}<b>${esc(shortName(T[ids[1]].name))}</b></span>
    </div>`;
  }
  return `<div class="${cls}">${ids.slice(0,6).map(id=>
    `<span class="figteam">${img(id,"figav")}<b>${esc(shortName(T[id].name))}</b></span>`).join("")}</div>`;
}

/* Scoreboard for a matchup piece: where each side stands, where the projection
   says they finish, and who the maths favours. Everything is supplied by the
   generator — the page only lays it out. */
function artBox(a){
  const b = a.box; if(!b || !Array.isArray(b.sides) || b.sides.length!==2) return "";
  const sides = b.sides.filter(s=>T[s.team]);
  if(sides.length!==2) return "";
  // Once the games are over a win probability is noise — show the result instead.
  const done = !!b.final;
  const lead = done
    ? (Number(sides[0].score) >= Number(sides[1].score) ? 0 : 1)
    : (sides[0].win!=null && sides[1].win!=null ? (sides[0].win >= sides[1].win ? 0 : 1) : -1);
  return `<div class="box">
    ${b.label||done?`<p class="boxhd">${done?`<span class="finaltag">Final</span> `:""}${esc(b.label||"")}</p>`:""}
    <div class="boxgrid">
      ${sides.map((s,i)=>`<div class="boxside${lead===i?" fav":""}">
        <div class="boxteam">${img(s.team,"boxav")}<b>${esc(T[s.team].name)}</b>${done&&lead===i?`<span class="wontag">W</span>`:""}</div>
        <div class="boxnums">
          <span><i>${done?"Final":"Now"}</i><b>${s.score!=null?Number(s.score).toFixed(2):"–"}</b></span>
          ${s.proj!=null?`<span><i>Projected</i><b>${Number(s.proj).toFixed(1)}</b></span>`:""}
          ${!done&&s.win!=null?`<span class="boxwin"><i>Win</i><b>${Math.round(s.win*100)}%</b></span>`:""}
        </div>
        ${!done&&s.win!=null?`<span class="winbar"><i style="width:${Math.max(0,Math.min(100,s.win*100)).toFixed(1)}%"></i></span>`:""}
      </div>`).join("")}
    </div>
    ${b.note?`<p class="boxnote">${esc(b.note)}</p>`:""}
  </div>`;
}

/* A trade piece ends with the deals themselves — who gave up what. */
function artDeals(a){
  const d = a.deals; if(!Array.isArray(d) || !d.length) return "";
  return `<section class="watch">
    <p class="watchhd">${d.length===1?"The deal":"The deals"}</p>
    <div class="deals">${d.map(deal=>`<div class="deal">
      ${deal.lines.map(side=>`<div class="dside">
        <b>${esc(side.team)}</b>
        <ul>${side.gets.map(g=>{
          // "2027 3rd via Chinese Sweatshop · proj 3.03" — the asset reads first,
          // where it came from and where it lands read as supporting detail.
          const m = String(g).match(/^(.*?)(?:\s+via\s+(.*?))?(?:\s+·\s+proj\s+(\S+))?$/);
          const [, main, via, proj] = m || [null, g];
          return `<li>${esc(main||g)}${via?`<span class="dvia">via ${esc(via)}</span>`:""}`
            + `${proj?`<span class="dproj" title="Projected slot from season max points">proj ${esc(proj)}</span>`:""}</li>`;
        }).join("")}</ul>
      </div>`).join(`<span class="dswap" aria-hidden="true">⇄</span>`)}
    </div>`).join("")}</div>
  </section>`;
}

/* Players to watch, at the foot of the piece with the names in bold. */
function artWatch(a){
  const w = a.watch; if(!Array.isArray(w) || !w.length) return "";
  return `<section class="watch">
    <p class="watchhd">${esc(a.watchLabel || "Players to watch")}</p>
    <ul>${w.map(p=>`<li>
      <b>${esc(p.name||"")}${p.rank?` <span class="wrank">(${esc(p.rank)})</span>`:""}</b>${p.pos||p.nfl?` <span class="wmeta">${esc([p.pos,p.nfl].filter(Boolean).join(" · "))}</span>`:""}
      ${p.team&&T[p.team]?`<span class="wteam">${esc(shortName(T[p.team].name))}</span>`:""}
      ${p.proj!=null||p.score!=null?`<span class="wproj">${[p.proj!=null?`proj ${Number(p.proj).toFixed(1)}`:"",p.score!=null?`actual ${Number(p.score).toFixed(1)}`:""].filter(Boolean).join(" · ")}</span>`:""}
      ${p.note?`<span class="wnote">${esc(p.note)}</span>`:""}
    </li>`).join("")}</ul>
  </section>`;
}

/* ---------- comments ----------
   Identity is the team password already used for ballots, so nobody needs a
   second account. Everything is written through RPCs that re-check it. */
const CM = { art:null, list:[], loaded:false, busy:false, msg:null, draft:"" };
const savedPw = v => v ? store.get("wcxc.pw."+v, "") : "";

async function loadComments(art){
  if(!sb || !art){ CM.loaded=true; return }
  CM.art=art;
  const {data:cs, error} = await sb.from("comments")
    .select("id,voter,body,created_at").eq("article",art).order("created_at",{ascending:true});
  if(error){ CM.loaded=true; CM.list=[]; return }
  const ids=(cs||[]).map(c=>c.id);
  let votes=[];
  if(ids.length){
    const {data:vs} = await sb.from("comment_votes").select("comment_id,voter,val").in("comment_id",ids);
    votes=vs||[];
  }
  CM.list=(cs||[]).map(c=>{
    const mine=votes.find(v=>v.comment_id===c.id && v.voter===S.voter);
    return {...c,
      up:votes.filter(v=>v.comment_id===c.id && v.val===1).length,
      down:votes.filter(v=>v.comment_id===c.id && v.val===-1).length,
      my: mine?mine.val:0};
  });
  CM.loaded=true;
  if(S.tab==="news" && S.article===art) renderNews();
}

const ago = ts => {
  const s=(Date.now()-new Date(ts).getTime())/1000;
  if(s<60) return "just now";
  if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago";
  return new Date(ts).toLocaleDateString([],{month:"short",day:"numeric"});
};

function commentsBlock(art){
  const v=S.voter, pw=savedPw(v);
  const canPost = configured && v && pw;
  let compose;
  if(!configured) compose = `<p class="hint">Comments need the site connected to Supabase.</p>`;
  else if(!v) compose = `<p class="hint">Pick your team on the <button class="linkish" data-go="vote">Cast ballot</button> tab to join in.</p>`;
  else if(!pw) compose = `<p class="hint">Cast a ballot once to set your team password, then you can comment as <b>${esc(T[v]?.name||"")}</b>.</p>`;
  else compose = `<div class="compose">
      <div class="cwho">${img(v)}<b>${esc(T[v]?.name||"")}</b></div>
      <textarea id="cbody" rows="3" maxlength="1500" placeholder="Say something…">${esc(CM.draft)}</textarea>
      <div class="crow">
        <button class="btn" id="cpost" ${CM.busy?"disabled":""}>${CM.busy?"Posting…":"Post"}</button>
        <span class="hint">${1500-CM.draft.length} left</span>
      </div>
    </div>`;

  const list = !CM.loaded ? `<p class="hint">Loading comments…</p>`
    : !CM.list.length ? `<p class="hint">No comments yet. Be the first.</p>`
    : CM.list.map(c=>{
        const t=T[c.voter]||{};
        return `<article class="cmt">
          <div class="cmthd">${img(c.voter)}
            <b>${esc(t.name||"")}</b><i>${esc(t.owner||"")}</i>
            <span class="cmtwhen">${esc(ago(c.created_at))}</span></div>
          <p class="cmtbody">${esc(c.body)}</p>
          <div class="cmtfoot">
            <button class="vbtn${c.my===1?" on":""}" data-cv="${c.id}" data-val="1"
              ${canPost?"":"disabled"} aria-label="Thumbs up" title="Thumbs up">▲ <span>${c.up}</span></button>
            <button class="vbtn dn${c.my===-1?" on":""}" data-cv="${c.id}" data-val="-1"
              ${canPost?"":"disabled"} aria-label="Thumbs down" title="Thumbs down">▼ <span>${c.down}</span></button>
            ${v===c.voter&&canPost?`<button class="linkish cdel" data-cdel="${c.id}">Delete</button>`:""}
          </div>
        </article>`;
      }).join("");

  return `<section class="comments">
    <p class="cmthdr">Comments${CM.list.length?` <span>${CM.list.length}</span>`:""}</p>
    ${compose}
    ${CM.msg?`<p class="status ${CM.msg.err?"err":""}" role="status">${esc(CM.msg.text)}</p>`:""}
    <div class="cmtlist">${list}</div>
  </section>`;
}

async function postComment(){
  const el=document.getElementById("cbody");
  const body=(el?.value||"").trim();
  if(!body){ CM.msg={err:true,text:"Write something first."}; renderNews(); return }
  CM.busy=true; CM.msg=null; CM.draft=body; renderNews();
  const {error}=await sb.rpc("post_comment",
    {p_article:S.article, p_voter:S.voter, p_password:savedPw(S.voter), p_body:body});
  CM.busy=false;
  if(error){ CM.msg={err:true,text:(error.message||"Couldn't post.").replace(/^.*?:\s*(?=[A-Z])/,"")}; renderNews(); return }
  CM.draft=""; CM.msg=null;
  await loadComments(S.article);
}

async function voteComment(id, val){
  const cur=CM.list.find(c=>c.id===id);
  const next = cur && cur.my===val ? 0 : val;          // clicking the same arrow clears it
  const {error}=await sb.rpc("vote_comment",
    {p_comment:id, p_voter:S.voter, p_password:savedPw(S.voter), p_val:next});
  if(error){ CM.msg={err:true,text:(error.message||"Couldn't vote.").replace(/^.*?:\s*(?=[A-Z])/,"")}; renderNews(); return }
  await loadComments(S.article);
}

async function deleteComment(id){
  const {error}=await sb.rpc("delete_comment",
    {p_comment:id, p_voter:S.voter, p_password:savedPw(S.voter)});
  if(error){ CM.msg={err:true,text:(error.message||"Couldn't delete.").replace(/^.*?:\s*(?=[A-Z])/,"")}; renderNews(); return }
  await loadComments(S.article);
}

  if(NEWS===null){
    main.innerHTML = banner()+header("News")+`<section class="panel"><div class="closed"><p class="big">Loading…</p></div></section>`;
    return;
  }
  const open = S.article ? NEWS.find(a=>a.id===S.article) : null;
  if(open){
    const k = KINDS[open.kind] || {label:open.kind||"Note", cls:""};
    main.innerHTML = banner()+
      `<div class="actions newshd" style="margin:0 auto 14px"><button class="btn ghost" id="backnews">← All stories</button></div>
       <article class="story">
         <p class="kicker"><span class="kbadge ${k.cls}">${esc(k.label)}</span> ${esc(artDate(open.date))}${open.week?` · Week ${open.week}`:""}</p>
         <h1>${esc(open.headline||"")}</h1>
         ${open.dek?`<p class="lede">${esc(open.dek)}</p>`:""}
         ${artFigure(open,true)}
         ${artBox(open)}
         <div class="prose">${paras(open.body)}</div>
         ${open.deals?.length ? artDeals(open) : artWatch(open)}
         ${k.fiction
           ? `<p class="fiction">Made up for a slow news day. Nobody said any of this and none of it happened.</p>`
           : `<p class="hint" style="margin-top:18px">Written automatically from the league's own data.</p>`}
         ${commentsBlock(open.id)}
       </article>`;
    return;
  }

  if(!NEWS.length){
    main.innerHTML = banner()+header("News","Written automatically when something actually happens — a trade, an injury, a poll landing, a matchup worth watching.")+
      `<section class="panel"><div class="closed">
         <p class="big">Nothing to report yet</p>
         <p class="hint" style="margin:0 auto;max-width:46ch">Stories publish on their own when the league gives them a reason to — a trade going through, a poll closing, an upset brewing. Quiet weeks stay quiet.</p>
       </div></section>`;
    return;
  }

  // archive: filter by kind, then group by week so older stories stay findable
  const kinds = [...new Set(NEWS.map(a=>a.kind).filter(Boolean))];
  const shown = NEWS.filter(a=>S.newsKind==="all" || a.kind===S.newsKind)
    .slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const groups = [];
  shown.forEach(a=>{
    const key = a.week ? `Week ${a.week}` : "Around the league";
    const g = groups.find(x=>x.key===key);
    (g||groups[groups.push({key, items:[]})-1]).items.push(a);
  });
  const chip = (v,l,n) => `<button type="button" class="chip${S.newsKind===v?" on":""}" data-kind="${esc(v)}">${esc(l)}${n!=null?` <i>${n}</i>`:""}</button>`;

  main.innerHTML = banner()+header("News","Written automatically when something actually happens — a trade, an injury, a poll landing, a matchup worth watching.")+
  `<div class="chips">${chip("all","All",NEWS.length)}${kinds.map(k=>
      chip(k,(KINDS[k]||{label:k}).label, NEWS.filter(a=>a.kind===k).length)).join("")}</div>`+
  (shown.length ? groups.map(g=>`
     <p class="grouphd">${esc(g.key)}</p>
     <div class="feed">${g.items.map(a=>{
       const k = KINDS[a.kind] || {label:a.kind||"Note", cls:""};
       return `<article class="card" data-article="${esc(a.id)}" tabindex="0" role="button" aria-label="Read: ${esc(a.headline||"")}">
         <p class="kicker"><span class="kbadge ${k.cls}">${esc(k.label)}</span> ${esc(artDate(a.date))}</p>
         <h3>${esc(a.headline||"")}</h3>
         ${a.dek?`<p>${esc(a.dek)}</p>`:""}
         ${artFigure(a,false)}
       </article>`;
     }).join("")}</div>`).join("")
   : `<section class="panel"><div class="closed"><p class="big">Nothing filed under that yet</p>
      <p class="hint" style="margin:0">Try another category.</p></div></section>`);
}

/* ---------- analysis: the poll against everything else ----------
   One question, asked several ways: does the league's opinion match what the
   teams are actually doing? Everything here is a comparison of the poll with
   one real statistic, so the controls are metric x scope x view rather than a
   wall of separate charts.                                                   */
const METRICS = {
  record: {label:"Win %",            short:"record",     fmt:v=>(100*v).toFixed(0)+"%"},
  pf:     {label:"Points for",       short:"points for", fmt:v=>v.toFixed(1)},
  // Points against ranks by magnitude, like every other metric: most points
  // conceded is #1. It isn't a "good" stat — you don't choose your opponent —
  // so ranking it low-is-better would imply a virtue that isn't there.
  pa:     {label:"Points against",   short:"points against", fmt:v=>v.toFixed(1)},
  eff:    {label:"Lineup efficiency",short:"efficiency", fmt:v=>(100*v).toFixed(1)+"%"},
  margin: {label:"Points margin",    short:"margin",     fmt:v=>(v>0?"+":"")+v.toFixed(1)}
};

// Per-team value of one metric, either for a single played week or the season.
function metricValues(key, week){
  const out = {};
  const perWeek = week != null;
  TEAMS.forEach(t=>{
    if(perWeek){
      const wk = SCHED && SCHED.byWeek && SCHED.byWeek[week] && SCHED.byWeek[week][t.id];
      if(!wk){ out[t.id]=null; return }
      const wins = (wk.h2h||0) + (MEDIAN_MATCH ? wk.medWin : 0);
      const games = MEDIAN_MATCH ? 2 : 1;
      out[t.id] = key==="record" ? wins/games
                : key==="pf"     ? wk.pf
                : key==="pa"     ? wk.pa
                : key==="margin" ? wk.pf-wk.pa
                : null;                                  // efficiency isn't per-week in Sleeper
    }else{
      const g = (t.w||0)+(t.l||0)+(t.t||0);
      const pfOff = t.pfOff ?? t.pf, ppOff = t.ppOff ?? t.pp;
      out[t.id] = key==="record" ? (g? (t.w + 0.5*(t.t||0))/g : 0)
                : key==="pf"     ? t.pf
                : key==="pa"     ? t.pa
                : key==="eff"    ? (ppOff ? pfOff/ppOff : null)
                : key==="margin" ? t.pf-t.pa
                : null;
    }
  });
  return out;
}

const rankMap = (vals, lowBetter) => {
  const live = Object.keys(vals).filter(k=>vals[k]!=null)
    .sort((a,b)=> lowBetter ? vals[a]-vals[b] : vals[b]-vals[a]);
  const r={}; live.forEach((k,i)=>r[k]=i+1); return r;
};

// Spearman rank correlation: one number for "does the poll agree with this?"
function spearman(a, b, ids){
  const n = ids.length; if(n<3) return null;
  let d2=0; for(const id of ids){ const x=a[id], y=b[id]; if(x==null||y==null) return null; d2 += (x-y)*(x-y) }
  return 1 - 6*d2/(n*(n*n-1));
}

// Poll rank per team: a single week, or averaged over every week polled.
function pollRanks(week){
  if(week != null){
    const {bs,rows} = tally(week);
    if(!bs.length) return null;
    const r={}; rows.forEach((x,i)=>r[x.t.id]=i+1); return r;
  }
  const weeks = weeksWithBallots(); if(!weeks.length) return null;
  const sum={}, n={};
  weeks.forEach(w=>tally(w).rows.forEach((x,i)=>{ sum[x.t.id]=(sum[x.t.id]||0)+i+1; n[x.t.id]=(n[x.t.id]||0)+1 }));
  const avg={}; TEAMS.forEach(t=>{ if(n[t.id]) avg[t.id]=sum[t.id]/n[t.id] });
  // turn the average into a rank so it compares like-for-like with the stat rank
  const order=Object.keys(avg).sort((a,b)=>avg[a]-avg[b]);
  const r={}; order.forEach((k,i)=>r[k]=i+1);
  return Object.assign(r, {__avg:avg});
}

function analysisData(){
  const perWeek = S.aScope !== "season";
  const week = perWeek ? S.week : null;
  const m = METRICS[S.aMetric] || METRICS.record;
  const vals = metricValues(S.aMetric, week);
  const pr = pollRanks(week);
  if(!pr) return {error:"no-poll", m, week, perWeek};
  const have = TEAMS.filter(t=>vals[t.id]!=null && pr[t.id]!=null).map(t=>t.id);
  if(!have.length) return {error:"no-stat", m, week, perWeek};
  const sr = rankMap(Object.fromEntries(have.map(id=>[id,vals[id]])), m.lowBetter);
  const rows = have.map(id=>({
    t:T[id], val:vals[id], pollRank:pr[id], statRank:sr[id],
    gap: sr[id]-pr[id]                       // >0 poll rates them above the stat
  })).sort((a,b)=>a.pollRank-b.pollRank);
  return {rows, m, week, perWeek, rho:spearman(pr, sr, have), avg:pr.__avg};
}

/* --- view 1: diverging gap bars (above/below a baseline -> diverging hues) --- */
function gapChart(rows){
  const max = Math.max(2, ...rows.map(r=>Math.abs(r.gap)));
  return `<div class="gapwrap">${rows.slice().sort((a,b)=>b.gap-a.gap).map(r=>{
    const pctW = Math.abs(r.gap)/max*50;
    const side = r.gap>0 ? "over" : r.gap<0 ? "under" : "even";
    return `<div class="gaprow" title="${esc(r.t.name)}: poll #${r.pollRank}, ${esc(METRICS[S.aMetric].short)} #${r.statRank}">
      <span class="gapname">${img(r.t.id)}<b>${esc(shortName(r.t.name))}</b></span>
      <span class="gapbar">
        <i class="${side}" style="${r.gap>0?`left:50%;width:${pctW}%`:`right:50%;width:${pctW}%`}"></i>
        <em class="axis"></em>
      </span>
      <span class="gapnum ${side}">${r.gap>0?"+":""}${r.gap||"0"}</span>
    </div>`;
  }).join("")}</div>`;
}

/* --- view 2: scatter, poll rank against the statistic --- */
function scatterChart(rows, m){
  const W=880,H=420,ml=54,mr=120,mt=18,mb=44, pw=W-ml-mr, ph=H-mt-mb;
  const vs=rows.map(r=>r.val), lo=Math.min(...vs), hi=Math.max(...vs);
  const pad=(hi-lo)*0.08||1, x0=lo-pad, x1=hi+pad;
  const X=v=>ml+((v-x0)/(x1-x0))*pw;
  const Y=r=>mt+((r-1)/(TEAMS.length-1))*ph;
  let grid="";
  for(let r=1;r<=TEAMS.length;r+=Math.ceil(TEAMS.length/6)){
    const y=Y(r).toFixed(1);
    grid+=`<line class="gl" x1="${ml}" y1="${y}" x2="${ml+pw}" y2="${y}"></line>
      <text class="ax" x="${ml-10}" y="${y}" text-anchor="end" dominant-baseline="middle">#${r}</text>`;
  }
  const ticks=[x0,(x0+x1)/2,x1].map(v=>
    `<text class="ax" x="${X(v).toFixed(1)}" y="${H-14}" text-anchor="middle">${esc(m.fmt(v))}</text>`).join("");
  const dots=rows.map(r=>{
    const cx=X(r.val).toFixed(1), cy=Y(r.pollRank).toFixed(1);
    const side = r.gap>0?"over":r.gap<0?"under":"even";
    return `<g><circle class="sdot ${side}" cx="${cx}" cy="${cy}" r="6"><title>${esc(r.t.name)} — poll #${r.pollRank}, ${esc(m.short)} #${r.statRank}</title></circle>
      <text class="slbl" x="${(+cx+10).toFixed(1)}" y="${cy}" dominant-baseline="middle">${esc(shortName(r.t.name).slice(0,16))}</text></g>`;
  }).join("");
  return `<svg class="scat" viewBox="0 0 ${W} ${H}" role="img" aria-label="Poll rank against ${esc(m.label)}. Exact values are in the table below.">
    <g>${grid}</g><g>${ticks}</g>
    <text class="axt" x="${ml+pw/2}" y="${H-1}" text-anchor="middle">${esc(m.label)} →</text>
    <text class="axt" x="14" y="${mt+ph/2}" text-anchor="middle" transform="rotate(-90 14 ${mt+ph/2})">← better poll rank</text>
    <g>${dots}</g></svg>`;
}

/* --- view 3: the gap over time, emphasis form --- */
function trendChart(){
  const weeks=weeksWithBallots().filter(w=>SCHED&&SCHED.byWeek&&SCHED.byWeek[w]);
  if(weeks.length<2) return null;
  const m=METRICS[S.aMetric];
  const series={}; TEAMS.forEach(t=>series[t.id]={});
  weeks.forEach(w=>{
    const vals=metricValues(S.aMetric,w);
    const {bs,rows}=tally(w); if(!bs.length) return;
    const pr={}; rows.forEach((x,i)=>pr[x.t.id]=i+1);
    const have=TEAMS.filter(t=>vals[t.id]!=null).map(t=>t.id);
    const sr=rankMap(Object.fromEntries(have.map(id=>[id,vals[id]])), m.lowBetter);
    have.forEach(id=>{ if(pr[id]) series[id][w]=sr[id]-pr[id] });
  });
  const live=weeks.filter(w=>TEAMS.some(t=>series[t.id][w]!=null));
  if(live.length<2) return null;
  const W=880,H=330,ml=34,mr=150,mt=16,mb=28, pw=W-ml-mr, ph=H-mt-mb;
  const all=[]; TEAMS.forEach(t=>live.forEach(w=>{ if(series[t.id][w]!=null) all.push(series[t.id][w]) }));
  const lim=Math.max(2,...all.map(Math.abs));
  const X=i=>live.length===1?ml+pw/2:ml+(i/(live.length-1))*pw;
  const Y=v=>mt+ph/2-(v/lim)*(ph/2);
  const on=S.lock||S.hover;
  const path=id=>live.filter(w=>series[id][w]!=null)
    .map((w,i)=>`${i?"L":"M"}${X(live.indexOf(w)).toFixed(1)},${Y(series[id][w]).toFixed(1)}`).join("");
  return `<svg class="bump ${on?"dim":""}" id="gaptrend" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gap between poll rank and ${esc(m.label)} rank, week by week.">
    <line class="zero" x1="${ml}" y1="${Y(0)}" x2="${ml+pw}" y2="${Y(0)}"></line>
    <text class="ax" x="${ml-8}" y="${Y(lim)}" text-anchor="end" dominant-baseline="middle">+${lim}</text>
    <text class="ax" x="${ml-8}" y="${Y(0)}" text-anchor="end" dominant-baseline="middle">0</text>
    <text class="ax" x="${ml-8}" y="${Y(-lim)}" text-anchor="end" dominant-baseline="middle">-${lim}</text>
    <g>${live.map((w,i)=>`<text class="ax" x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle">Wk ${w}</text>`).join("")}</g>
    <g>${TEAMS.filter(t=>path(t.id)).map(t=>`<path class="ctx" d="${path(t.id)}"></path>`).join("")}</g>
    <g>${on&&path(on)?`<path class="em" d="${path(on)}"></path>
      <text class="lbl" x="${(X(live.length-1)+10).toFixed(1)}" y="${Y(series[on][live[live.length-1]]??0).toFixed(1)}" dominant-baseline="middle">${esc(shortName(T[on].name))}</text>`:""}</g>
    <g>${TEAMS.filter(t=>path(t.id)).map(t=>`<path class="hit" d="${path(t.id)}" data-team="${t.id}"><title>${esc(t.name)}</title></path>`).join("")}</g>
  </svg>`;
}
