function updateLockbar(){
  const el=document.getElementById("lockbar"); if(!el) return;
  const id=S.lock||S.hover, tail=S.lock?" · locked, click again to unlock":"";
  if(S.tab==="outlook"){
    if(!id){el.innerHTML="Hover a line to follow one team's gap through the season.";return}
    el.innerHTML=`<b>${esc(T[id].name)}</b> — gap between poll rank and ${esc((METRICS[S.aMetric]||{}).short||"stat")} rank${tail}`;
    return;
  }
  if(S.tab==="poll" && S.pv==="season"){
    if(!id||!BUMP){el.innerHTML="Hover a line or a team below to trace it across the season.";return}
    const {weeks,rank}=BUMP, rs=weeks.map(w=>rank[id][w]), d=rs[0]-rs[rs.length-1];
    const move=weeks.length<2?"":` · ${d>0?`up ${d}`:d<0?`down ${-d}`:"even"} since Week ${weeks[0]}`;
    el.innerHTML=`<b>${esc(T[id].name)}</b>: ${weeks.map((w,i)=>`Wk ${w} #${rs[i]}`).join(" → ")}${move}${tail}`;
    return;
  }
  if(!id){el.innerHTML="Hover or tap a team logo to trace it across ballots.";return}
  const ranks=weekBallots(S.week).map(b=>b.order.indexOf(id)+1);
  el.innerHTML=`<b>${esc(T[id].name)}</b>: ranked ${ranks.join(", ")}${tail}`;
}

/* ---------- season ---------- */
const weeksWithBallots = () => [...new Set(S.ballots.map(b=>b.week))].sort((a,b)=>a-b);
const shortName = s => s.length>20 ? s.slice(0,19)+"…" : s;
let BUMP = null;

function seasonRanks(){
  const weeks = weeksWithBallots(), rank={}, pts={};
  TEAMS.forEach(t=>{rank[t.id]={}; pts[t.id]={}});
  weeks.forEach(w=>tally(w).rows.forEach((r,i)=>{rank[r.t.id][w]=i+1; pts[r.t.id][w]=r.pts}));
  return {weeks,rank,pts};
}

// Emphasis chart: all 12 teams in a recessive gray, the chosen one in blue.
// Twelve categorical hues would be indistinguishable — identity comes from
// selection and a direct label, with the table below as the exact read.
function bumpSvg(){
  const {weeks,rank}=BUMP, n=weeks.length, N=TEAMS.length;
  const W=880,H=390,ml=28,mr=170,mt=16,mb=28, pw=W-ml-mr, ph=H-mt-mb;
  BUMP.X = i => n===1 ? ml+pw/2 : ml+(i/(n-1))*pw;
  BUMP.Y = r => mt+((r-1)/(N-1))*ph;
  BUMP.d = id => weeks.map((w,i)=>`${i?"L":"M"}${BUMP.X(i).toFixed(1)},${BUMP.Y(rank[id][w]).toFixed(1)}`).join("");
  const {X,Y,d}=BUMP;
  let g="";
  for(let r=1;r<=N;r++){const y=Y(r).toFixed(1);
    g+=`<line class="gl" x1="${ml}" y1="${y}" x2="${ml+pw}" y2="${y}"></line><text class="ax" x="${ml-8}" y="${y}" dominant-baseline="middle" text-anchor="end">${r}</text>`}
  return `<svg class="bump ${(S.lock||S.hover)?"dim":""}" id="bump" viewBox="0 0 ${W} ${H}" role="img" aria-label="Poll rank by week for all ${N} teams. Exact ranks are in the table below.">
    <g>${g}</g>
    <g>${weeks.map((w,i)=>`<text class="ax" x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle">Wk ${w}</text>`).join("")}</g>
    <g>${TEAMS.map(t=>`<path class="ctx" d="${d(t.id)}"></path>`).join("")}</g>
    <g id="emlayer">${emMarkup()}</g>
    <g>${TEAMS.map(t=>`<path class="hit" d="${d(t.id)}" data-team="${t.id}"><title>${esc(t.name)}</title></path>`).join("")}</g></svg>`;
}
function emMarkup(){
  if(!BUMP||!BUMP.d) return "";
  const {weeks,rank,pts,last,X,Y,d}=BUMP, on=S.lock||S.hover, lx=(X(weeks.length-1)+10).toFixed(1);
  if(!on) return TEAMS.filter(t=>rank[t.id][last]<=3).sort((a,b)=>rank[a.id][last]-rank[b.id][last])
    .map(t=>`<text class="lbl soft" x="${lx}" y="${Y(rank[t.id][last]).toFixed(1)}" dominant-baseline="middle">${esc(shortName(t.name))}</text>`).join("");
  return `<path class="em" d="${d(on)}"></path>`+
    weeks.map((w,i)=>`<circle class="dot" cx="${X(i).toFixed(1)}" cy="${Y(rank[on][w]).toFixed(1)}" r="4.5"><title>Week ${w}: #${rank[on][w]} · ${pts[on][w]} pts</title></circle>`).join("")+
    `<text class="lbl" x="${lx}" y="${Y(rank[on][last]).toFixed(1)}" dominant-baseline="middle">${esc(shortName(T[on].name))} · #${rank[on][last]}</text>`;
}
function updateBump(){
  const svg=document.getElementById("bump"); if(!svg) return;
  const on=S.lock||S.hover;
  svg.classList.toggle("dim",!!on);
  const el=document.getElementById("emlayer"); if(el) el.innerHTML=emMarkup();
  document.querySelectorAll(".lg").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.team===on)));
}

function renderSeason(){
  const {weeks,rank,pts}=seasonRanks();
  if(!weeks.length){main.innerHTML=banner()+header("Power Poll")+emptyState();return}
  const last=weeks[weeks.length-1], N=TEAMS.length;
  BUMP={weeks,rank,pts,last};
  const order=TEAMS.slice().sort((a,b)=>rank[a.id][last]-rank[b.id][last]);
  const chart = weeks.length<2
    ? `<div class="empty-state">Only Week ${last} has a poll so far. The trend lines start once a second week is in.</div>`
    : `<div class="chartwrap">${bumpSvg()}</div>`;
  main.innerHTML = banner()+header("Power Poll","Where every team has sat in the poll, week by week. Hover a line or a team to trace it; click to keep it highlighted.")+
  `<p class="lockbar" id="lockbar"></p>
   <section class="panel"><h2>Poll rank by week</h2>${chart}
     <div class="legend">${order.map(t=>`<button class="lg" data-team="${t.id}" aria-pressed="${(S.lock||S.hover)===t.id}"><b>${rank[t.id][last]}</b>${img(t.id)}<span>${esc(t.name)}</span></button>`).join("")}</div>
   </section>
   <section class="panel" style="margin-top:16px"><h2>Every poll this season</h2><div class="scroll"><table class="matrix">
    <thead><tr><th>Team</th>${weeks.map(w=>`<th class="num" style="text-align:center">Wk ${w}</th>`).join("")}<th class="num">Best</th><th class="num">Worst</th><th class="num">Avg</th></tr></thead>
    <tbody>${order.map(t=>{
      const rs=weeks.map(w=>rank[t.id][w]), avg=rs.reduce((a,b)=>a+b,0)/rs.length;
      return `<tr><td><div class="teamcell">${img(t.id)}<div class="nm"><b>${esc(t.name)}</b><i>${esc(t.owner)}</i></div></div></td>
       ${rs.map((r,i)=>{const a=(N-r)/(N-1);
         return `<td style="padding:4px 3px"><span class="rkcell" title="Week ${weeks[i]}: #${r}, ${pts[t.id][weeks[i]]} pts" style="background:rgba(10,91,171,${(.12+.76*a).toFixed(3)});color:${a>.55?"#fff":"inherit"}">${r}</span></td>`}).join("")}
       <td class="num">${Math.min(...rs)}</td><td class="num">${Math.max(...rs)}</td><td class="num">${avg.toFixed(2)}</td></tr>`}).join("")}
    </tbody></table></div></section>
   <p class="hint" style="margin-top:12px">Darker cells are better poll finishes. Rank is by poll points that week.</p>`;
  updateLockbar();
}

/* ---------- playoff odds ----------
   League rules, from Sleeper: 3 divisions, 6 playoff teams, regular season
   through week 14. Each division winner qualifies, plus the next 3 best by
   record then points for. The top 2 division winners get byes; the remaining
   4 are seeded 3-6 on record then PF, and the bracket reseeds every round.  */
let SCHED = null, ODDS = null, oddsRunning = false, oddsLoaded = false;
async function loadOdds(){
  try{
    const r = await fetch("odds.json",{cache:"no-cache"});
    if(!r.ok) throw new Error("Forecast unavailable");
    const j = await r.json();
    if(![2,3].includes(j.modelVersion) || String(j.leagueId)!==String(LEAGUE_ID) || Number(j.season)!==Number(SEASON) ||
       j.sims!==10000 || !Number.isFinite(Date.parse(j.generated)) || !Array.isArray(j.rows) || j.rows.length!==TEAMS.length ||
       new Set(j.rows.map(x=>x.id)).size!==TEAMS.length || !TEAMS.every(t=>j.rows.some(x=>x.id===t.id)) ||
       j.rows.some(x=>["po","div","bye","final","title"].some(k=>!Number.isFinite(x[k]) || x[k]<0 || x[k]>1)))
      throw new Error("Forecast does not match this league");
    ODDS=j;
  }catch(e){ODDS=null;}
  oddsLoaded=true; oddsRunning=false;
  if(S.tab==="outlook" || (S.tab==="poll" && S.pv==="poll")) render();
}

async function loadSchedule(){
  const base = `https://api.sleeper.app/v1/league/${LEAGUE_ID}/matchups/`;
  // The records include official totals plus any finished weeks caught up here.
  // Start after those results even if Sleeper's state lags, advances before its
  // totals, or is unreachable. The snapshot fallback also carries banked results.
  const perWeek = MEDIAN_MATCH ? 2 : 1;
  const played = (TEAMS[0]?.w||0)+(TEAMS[0]?.l||0)+(TEAMS[0]?.t||0);
  const firstOpen = Math.floor(played/perWeek)+1;
  const weeks = [];
  for(let w=1; w<=LAST_REG_WEEK; w++) weeks.push(w);
  const all = await Promise.all(weeks.map(w =>
    fetch(base+w).then(r=>r.ok?r.json():[]).then(d=>({w, d:d||[]})).catch(()=>({w, d:[]}))));
  const upcoming = [], scores = {}, byWeek = {};
  TEAMS.forEach(t=>scores[t.id]=[]);
  all.sort((a,b)=>a.w-b.w).forEach(({w,d})=>{
    const byId = {};
    d.forEach(m=>{ if(m.matchup_id==null) return; (byId[m.matchup_id]=byId[m.matchup_id]||[]).push(m) });
    const pairs = Object.values(byId).filter(p=>p.length===2).map(p=>[p[0].roster_id,p[1].roster_id]);
    if(w < firstOpen){
      d.forEach(m=>{ if(scores[m.roster_id] && typeof m.points==="number") scores[m.roster_id].push(m.points) });
      // per-week detail for the Analysis tab: what each team scored, who they
      // played, and both results that week (head-to-head and the median)
      const pts = {}; d.forEach(m=>{ if(typeof m.points==="number") pts[m.roster_id]=m.points });
      const vals = Object.values(pts).sort((a,b)=>a-b), n=vals.length;
      const med = n ? (n%2 ? vals[(n-1)/2] : (vals[n/2-1]+vals[n/2])/2) : 0;
      const wk = {};
      Object.keys(pts).forEach(id=>{ wk[id]={pf:pts[id], pa:0, h2h:null, medWin:pts[id]>med?1:0, med}; });
      Object.values(byId).forEach(p=>{ if(p.length!==2) return;
        const [a,b]=p;
        if(wk[a.roster_id]){ wk[a.roster_id].pa=b.points; wk[a.roster_id].h2h=a.points>b.points?1:0; wk[a.roster_id].opp=b.roster_id; }
        if(wk[b.roster_id]){ wk[b.roster_id].pa=a.points; wk[b.roster_id].h2h=b.points>a.points?1:0; wk[b.roster_id].opp=a.roster_id; }
      });
      byWeek[w]=wk;
    } else if(pairs.length){
      upcoming.push({w, pairs});
    }
  });
  SCHED = {weeks:upcoming, scores, byWeek, firstOpen};
  return SCHED;
}

/* ---------- news ----------
   Articles are written ahead of time by a scheduled job and committed as
   news.json; the page only reads them. Bodies are plain-text paragraphs and are
   escaped on the way in — nothing generated ever becomes markup.            */
let NEWS = null;
async function loadNews(){
  try{
    const r = await fetch("news.json", {cache:"no-cache"});
    if(!r.ok) throw 0;
    const j = await r.json();
    NEWS = Array.isArray(j.articles) ? j.articles : [];
  }catch(e){ NEWS = []; }
  if(S.tab==="news") render();
}

const KINDS = {
  poll:    {label:"Poll",    cls:"k-poll"},
  trade:   {label:"Trade",   cls:"k-trade"},
  matchup: {label:"Matchup", cls:"k-match"},
  injury:  {label:"Injury",  cls:"k-injury"},
  recap:   {label:"Recap",   cls:"k-recap"},
  // Invented filler for quiet days. Badged loudly and footnoted so it can never
  // be mistaken for a real report — these put words in real players' mouths.
  satire:  {label:"Satire",  cls:"k-satire", fiction:true}
};
const artDate = d => { try{ return new Date(d).toLocaleDateString([], {month:"short", day:"numeric"}) }catch(e){ return "" } };
const paras = b => (Array.isArray(b)?b:String(b||"").split(/\n{2,}/))
  .filter(p=>String(p).trim()).map(p=>`<p>${esc(String(p).trim())}</p>`).join("");

/* Artwork comes from the league itself — team avatars off Sleeper's CDN, which
   the CSP already allows. No external image hosting, and every picture is
   relevant by construction.
   "vs" is a claim, not decoration: it says these two teams played each other.
   Two teams in a story is not that — a trade has two teams and they are
   partners, not opponents. Only a real Sleeper pairing earns it, and that is
   exactly what the box records, so the box is the test. */
const opposedPair = a => {
  const s = a && a.box && Array.isArray(a.box.sides) ? a.box.sides : null;
  if(!s || s.length!==2) return null;
  const ids = s.map(x=>Number(x.team));
  return ids.every(id=>T[id]) && ids[0]!==ids[1] ? ids : null;
};
function artFigure(a, big){
  const ids = (a.teams||[]).map(Number).filter(id=>T[id]);
  if(!ids.length) return "";
  const cls = big ? "fig big" : "fig";
  const face = id => `<span class="figteam">${img(id,"figav")}<b>${esc(shortName(T[id].name))}</b></span>`;
  const pair = opposedPair(a);
  if(pair){
    return `<div class="${cls} vs">${face(pair[0])}<span class="figvs">vs</span>${face(pair[1])}</div>`;
  }
  return `<div class="${cls}">${ids.slice(0,6).map(face).join("")}</div>`;
}

/* Scoreboard for a matchup piece: where each side stands, where the projection
   says they finish, and who the maths favours. Everything is supplied by the
   generator — the page only lays it out. */
function artBox(a){
  const b = a.box; if(!b || !Array.isArray(b.sides) || b.sides.length!==2) return "";
  const sides = b.sides.filter(s=>T[s.team]);
  if(sides.length!==2) return "";
  // Once the games are over a win probability is noise — show the result instead.
  const done = !!b.final;
  const lead = done
    ? (Number(sides[0].score) >= Number(sides[1].score) ? 0 : 1)
    : (sides[0].win!=null && sides[1].win!=null ? (sides[0].win >= sides[1].win ? 0 : 1) : -1);
  return `<div class="box">
    ${b.label||done?`<p class="boxhd">${done?`<span class="finaltag">Final</span> `:""}${esc(b.label||"")}</p>`:""}
    <div class="boxgrid">
      ${sides.map((s,i)=>`<div class="boxside${lead===i?" fav":""}">
        <div class="boxteam">${img(s.team,"boxav")}<b>${esc(T[s.team].name)}</b>${done&&lead===i?`<span class="wontag">W</span>`:""}</div>
        <div class="boxnums">
          <span><i>${done?"Final":"Now"}</i><b>${s.score!=null?Number(s.score).toFixed(2):"–"}</b></span>
          ${s.proj!=null?`<span><i>Projected</i><b>${Number(s.proj).toFixed(1)}</b></span>`:""}
          ${!done&&s.win!=null?`<span class="boxwin"><i>Win</i><b>${Math.round(s.win*100)}%</b></span>`:""}
        </div>
        ${!done&&s.win!=null?`<span class="winbar"><i style="width:${Math.max(0,Math.min(100,s.win*100)).toFixed(1)}%"></i></span>`:""}
      </div>`).join("")}
    </div>
    ${b.note?`<p class="boxnote">${esc(b.note)}</p>`:""}
  </div>`;
}

/* A trade piece ends with the deals themselves — who gave up what. */
function artDeals(a){
  const d = a.deals; if(!Array.isArray(d) || !d.length) return "";
  return `<section class="watch">
    <p class="watchhd">${d.length===1?"The deal":"The deals"}</p>
    <div class="deals">${d.map(deal=>`<div class="deal">
      ${deal.lines.map(side=>`<div class="dside">
        <b>${esc(side.team)}</b>
        <ul>${side.gets.map(g=>{
          // "2027 3rd via Chinese Sweatshop · proj 3.03" — the asset reads first,
          // where it came from and where it lands read as supporting detail.
          const m = String(g).match(/^(.*?)(?:\s+via\s+(.*?))?(?:\s+·\s+proj\s+(\S+))?$/);
          const [, main, via, proj] = m || [null, g];
          return `<li>${esc(main||g)}${via?`<span class="dvia">via ${esc(via)}</span>`:""}`
            + `${proj?`<span class="dproj" title="Projected slot from season max points">proj ${esc(proj)}</span>`:""}</li>`;
        }).join("")}</ul>
      </div>`).join(`<span class="dswap" aria-hidden="true">⇄</span>`)}
    </div>`).join("")}</div>
  </section>`;
}

/* Players to watch, at the foot of the piece with the names in bold. */
function artWatch(a){
  const w = a.watch; if(!Array.isArray(w) || !w.length) return "";
  return `<section class="watch">
    <p class="watchhd">${esc(a.watchLabel || "Players to watch")}</p>
    <ul>${w.map(p=>`<li>
      <b>${esc(p.name||"")}${p.rank?` <span class="wrank">(${esc(p.rank)})</span>`:""}</b>${p.pos||p.nfl?` <span class="wmeta">${esc([p.pos,p.nfl].filter(Boolean).join(" · "))}</span>`:""}
      ${p.team&&T[p.team]?`<span class="wteam">${esc(shortName(T[p.team].name))}</span>`:""}
      ${p.proj!=null||p.score!=null?`<span class="wproj">${[p.proj!=null?`proj ${Number(p.proj).toFixed(1)}`:"",p.score!=null?`actual ${Number(p.score).toFixed(1)}`:""].filter(Boolean).join(" · ")}</span>`:""}
      ${p.note?`<span class="wnote">${esc(p.note)}</span>`:""}
    </li>`).join("")}</ul>
  </section>`;
}

/* ---------- comments ----------
   Identity is the team password already used for ballots, so nobody needs a
   second account. Everything is written through RPCs that re-check it. */
const CM = { art:null, list:[], loaded:false, busy:false, msg:null, draft:"" };
const savedPw = v => v ? store.get("wcxc.pw."+v, "") : "";

async function loadComments(art){
  if(!sb || !art){ CM.loaded=true; return }
  CM.art=art;
  const {data:cs, error} = await sb.from("comments")
    .select("id,voter,body,created_at").eq("article",art).order("created_at",{ascending:true});
  if(error){ CM.loaded=true; CM.list=[]; return }
  const ids=(cs||[]).map(c=>c.id);
  let votes=[];
  if(ids.length){
    const {data:vs} = await sb.from("comment_votes").select("comment_id,voter,val").in("comment_id",ids);
    votes=vs||[];
  }
  CM.list=(cs||[]).map(c=>{
    const mine=votes.find(v=>v.comment_id===c.id && v.voter===S.voter);
    return {...c,
      up:votes.filter(v=>v.comment_id===c.id && v.val===1).length,
      down:votes.filter(v=>v.comment_id===c.id && v.val===-1).length,
      my: mine?mine.val:0};
  });
  CM.loaded=true;
  if(S.tab==="news" && S.article===art) renderNews();
}

const ago = ts => {
  const s=(Date.now()-new Date(ts).getTime())/1000;
  if(s<60) return "just now";
  if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago";
  return new Date(ts).toLocaleDateString([],{month:"short",day:"numeric"});
};

function commentsBlock(art){
  const v=S.voter, pw=savedPw(v);
  const canPost = configured && v && pw;
  let compose;
  if(!configured) compose = `<p class="hint">Comments need the site connected to Supabase.</p>`;
  else if(!v) compose = `<p class="hint">Pick your team on the <button class="linkish" data-go="vote">Cast ballot</button> tab to join in.</p>`;
  else if(!pw) compose = `<p class="hint">Cast a ballot once to set your team password, then you can comment as <b>${esc(T[v]?.name||"")}</b>.</p>`;
  else compose = `<div class="compose">
      <div class="cwho">${img(v)}<b>${esc(T[v]?.name||"")}</b></div>
      <textarea id="cbody" rows="3" maxlength="1500" placeholder="Say something…">${esc(CM.draft)}</textarea>
      <div class="crow">
        <button class="btn" id="cpost" ${CM.busy?"disabled":""}>${CM.busy?"Posting…":"Post"}</button>
        <span class="hint">${1500-CM.draft.length} left</span>
      </div>
    </div>`;

  const list = !CM.loaded ? `<p class="hint">Loading comments…</p>`
    : !CM.list.length ? `<p class="hint">No comments yet. Be the first.</p>`
    : CM.list.map(c=>{
        const t=T[c.voter]||{};
        return `<article class="cmt">
          <div class="cmthd">${img(c.voter)}
            <b>${esc(t.name||"")}</b><i>${esc(t.owner||"")}</i>
            <span class="cmtwhen">${esc(ago(c.created_at))}</span></div>
          <p class="cmtbody">${esc(c.body)}</p>
          <div class="cmtfoot">
            <button class="vbtn${c.my===1?" on":""}" data-cv="${c.id}" data-val="1"
              ${canPost?"":"disabled"} aria-label="Thumbs up" title="Thumbs up">▲ <span>${c.up}</span></button>
            <button class="vbtn dn${c.my===-1?" on":""}" data-cv="${c.id}" data-val="-1"
              ${canPost?"":"disabled"} aria-label="Thumbs down" title="Thumbs down">▼ <span>${c.down}</span></button>
            ${v===c.voter&&canPost?`<button class="linkish cdel" data-cdel="${c.id}">Delete</button>`:""}
          </div>
        </article>`;
      }).join("");

  return `<section class="comments">
    <p class="cmthdr">Comments${CM.list.length?` <span>${CM.list.length}</span>`:""}</p>
    ${compose}
    ${CM.msg?`<p class="status ${CM.msg.err?"err":""}" role="status">${esc(CM.msg.text)}</p>`:""}
    <div class="cmtlist">${list}</div>
  </section>`;
}

async function postComment(){
  const el=document.getElementById("cbody");
  const body=(el?.value||"").trim();
  if(!body){ CM.msg={err:true,text:"Write something first."}; renderNews(); return }
  CM.busy=true; CM.msg=null; CM.draft=body; renderNews();
  const {error}=await sb.rpc("post_comment",
    {p_article:S.article, p_voter:S.voter, p_password:savedPw(S.voter), p_body:body});
  CM.busy=false;
  if(error){ CM.msg={err:true,text:(error.message||"Couldn't post.").replace(/^.*?:\s*(?=[A-Z])/,"")}; renderNews(); return }
  CM.draft=""; CM.msg=null;
  await loadComments(S.article);
}

async function voteComment(id, val){
  const cur=CM.list.find(c=>c.id===id);
  const next = cur && cur.my===val ? 0 : val;          // clicking the same arrow clears it
  const {error}=await sb.rpc("vote_comment",
    {p_comment:id, p_voter:S.voter, p_password:savedPw(S.voter), p_val:next});
  if(error){ CM.msg={err:true,text:(error.message||"Couldn't vote.").replace(/^.*?:\s*(?=[A-Z])/,"")}; renderNews(); return }
  await loadComments(S.article);
}

async function deleteComment(id){
  const {error}=await sb.rpc("delete_comment",
    {p_comment:id, p_voter:S.voter, p_password:savedPw(S.voter)});
  if(error){ CM.msg={err:true,text:(error.message||"Couldn't delete.").replace(/^.*?:\s*(?=[A-Z])/,"")}; renderNews(); return }
  await loadComments(S.article);
}

function renderNews(){
  if(NEWS===null){
    main.innerHTML = banner()+header("News","","League wire")+`<section class="panel"><div class="closed"><p class="big">Loading…</p></div></section>`;
    return;
  }
  const open = S.article ? NEWS.find(a=>a.id===S.article) : null;
  if(open){
    const k = KINDS[open.kind] || {label:open.kind||"Note", cls:""};
    main.innerHTML = banner()+
      `<div class="actions newshd" style="margin:0 auto 14px"><button class="btn ghost" id="backnews">← All stories</button></div>
       <article class="story">
         <p class="kicker"><span class="kbadge ${k.cls}">${esc(k.label)}</span> ${esc(artDate(open.date))}${open.week?` · Week ${open.week}`:""}</p>
         <h1>${esc(open.headline||"")}</h1>
         ${open.dek?`<p class="lede">${esc(open.dek)}</p>`:""}
         ${artFigure(open,true)}
         ${artBox(open)}
         <div class="prose">${paras(open.body)}</div>
         ${open.deals?.length ? artDeals(open) : artWatch(open)}
         ${k.fiction
           ? ""   // the Satire badge already says it; a second disclaimer is nagging
           : `<p class="hint" style="margin-top:18px">Written automatically from the league's own data.</p>`}
         ${commentsBlock(open.id)}
       </article>`;
    return;
  }

  if(!NEWS.length){
    main.innerHTML = banner()+header("News","Written automatically when something actually happens — a trade, an injury, a poll landing, a matchup worth watching.","League wire")+
      `<section class="panel"><div class="closed">
         <p class="big">Nothing to report yet</p>
         <p class="hint" style="margin:0 auto;max-width:46ch">Stories publish on their own when the league gives them a reason to — a trade going through, a poll closing, an upset brewing. Quiet weeks stay quiet.</p>
       </div></section>`;
    return;
  }

  /* archive: filter by week and by kind, then group by week so older stories
     stay findable. Each filter's counts are taken with the OTHER one applied, so
     a number on a chip or in the picker is how many stories picking it gives. */
  const kinds = [...new Set(NEWS.map(a=>a.kind).filter(Boolean))];
  const weeks = [...new Set(NEWS.map(a=>a.week).filter(w=>w!=null))].sort((a,b)=>b-a);
  const undated = NEWS.some(a=>a.week==null);
  if(S.newsWeek!=="all" && !(S.newsWeek==="none" ? undated : weeks.includes(S.newsWeek))) S.newsWeek = "all";   // that week is gone
  const inWeek = a => S.newsWeek==="all" || (S.newsWeek==="none" ? a.week==null : a.week===S.newsWeek);
  const inKind = a => S.newsKind==="all" || a.kind===S.newsKind;
  const shown = NEWS.filter(a=>inWeek(a) && inKind(a))
    .slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const groups = [];
  shown.forEach(a=>{
    const key = a.week ? `Week ${a.week}` : "Around the league";
    const g = groups.find(x=>x.key===key);
    (g||groups[groups.push({key, items:[]})-1]).items.push(a);
  });
  const chip = (v,l,n) => `<button type="button" class="chip${S.newsKind===v?" on":""}" data-kind="${esc(v)}">${esc(l)}${n!=null?` <i>${n}</i>`:""}</button>`;
  const inWeekOnly = NEWS.filter(inWeek), inKindOnly = NEWS.filter(inKind);
  const wkOpt = (v,l,n) => `<option value="${v}"${String(S.newsWeek)===String(v)?" selected":""}>${esc(l)} (${n})</option>`;
  // a picker with one choice is noise; it appears once there is a week to choose between
  const weekPick = weeks.length + (undated?1:0) > 1
    ? `<label class="wk newswk"><span class="sr">Week</span><select id="newsweek">${wkOpt("all","All weeks",inKindOnly.length)}${
        weeks.map(w=>wkOpt(w,`Week ${w}`,inKindOnly.filter(a=>a.week===w).length)).join("")}${
        undated?wkOpt("none","Around the league",inKindOnly.filter(a=>a.week==null).length):""}</select></label>` : "";

  main.innerHTML = banner()+header("News","Written automatically when something actually happens — a trade, an injury, a poll landing, a matchup worth watching.","League wire")+
  `<div class="newsbar">${weekPick}<div class="chips">${chip("all","All",inWeekOnly.length)}${kinds.map(k=>
      chip(k,(KINDS[k]||{label:k}).label, inWeekOnly.filter(a=>a.kind===k).length)).join("")}</div></div>`+
  (shown.length ? groups.map(g=>`
     <p class="grouphd">${esc(g.key)}</p>
     <div class="feed">${g.items.map(a=>{
       const k = KINDS[a.kind] || {label:a.kind||"Note", cls:""};
       return `<article class="card" data-article="${esc(a.id)}" tabindex="0" role="button" aria-label="Read: ${esc(a.headline||"")}">
         <p class="kicker"><span class="kbadge ${k.cls}">${esc(k.label)}</span> ${esc(artDate(a.date))}</p>
         <h3>${esc(a.headline||"")}</h3>
         ${a.dek?`<p>${esc(a.dek)}</p>`:""}
         ${artFigure(a,false)}
       </article>`;
     }).join("")}</div>`).join("")
   : `<section class="panel"><div class="closed"><p class="big">Nothing filed under that yet</p>
      <p class="hint" style="margin:0">Try another week or category.</p></div></section>`);
}

/* ---------- analysis: the poll against everything else ----------
   One question, asked several ways: does the league's opinion match what the
   teams are actually doing? Everything here is a comparison of the poll with
   one real statistic, so the controls are metric x scope x view rather than a
   wall of separate charts.                                                   */
const METRICS = {
  record: {label:"Win %",            short:"record",     fmt:v=>(100*v).toFixed(0)+"%"},
  pf:     {label:"Points for",       short:"points for", fmt:v=>v.toFixed(1)},
  // Points against ranks by magnitude, like every other metric: most points
  // conceded is #1. It isn't a "good" stat — you don't choose your opponent —
  // so ranking it low-is-better would imply a virtue that isn't there.
  pa:     {label:"Points against",   short:"points against", fmt:v=>v.toFixed(1)},
  eff:    {label:"Lineup efficiency",short:"efficiency", fmt:v=>(100*v).toFixed(1)+"%"},
  margin: {label:"Points margin",    short:"margin",     fmt:v=>(v>0?"+":"")+v.toFixed(1)}
};

// Per-team value of one metric, either for a single played week or the season.
function metricValues(key, week){
  const out = {};
  const perWeek = week != null;
  TEAMS.forEach(t=>{
    if(perWeek){
      const wk = SCHED && SCHED.byWeek && SCHED.byWeek[week] && SCHED.byWeek[week][t.id];
      if(!wk){ out[t.id]=null; return }
      const wins = (wk.h2h||0) + (MEDIAN_MATCH ? wk.medWin : 0);
      const games = MEDIAN_MATCH ? 2 : 1;
      out[t.id] = key==="record" ? wins/games
                : key==="pf"     ? wk.pf
                : key==="pa"     ? wk.pa
                : key==="margin" ? wk.pf-wk.pa
                : null;                                  // efficiency isn't per-week in Sleeper
    }else{
      const g = (t.w||0)+(t.l||0)+(t.t||0);
      const pfOff = t.pfOff ?? t.pf, ppOff = t.ppOff ?? t.pp;
      out[t.id] = key==="record" ? (g? (t.w + 0.5*(t.t||0))/g : 0)
                : key==="pf"     ? t.pf
                : key==="pa"     ? t.pa
                : key==="eff"    ? (ppOff ? pfOff/ppOff : null)
                : key==="margin" ? t.pf-t.pa
                : null;
    }
  });
  return out;
}

const rankMap = (vals, lowBetter) => {
  const live = Object.keys(vals).filter(k=>vals[k]!=null)
    .sort((a,b)=> lowBetter ? vals[a]-vals[b] : vals[b]-vals[a]);
  const r={}; live.forEach((k,i)=>r[k]=i+1); return r;
};

// Spearman rank correlation: one number for "does the poll agree with this?"
function spearman(a, b, ids){
  const n = ids.length; if(n<3) return null;
  let d2=0; for(const id of ids){ const x=a[id], y=b[id]; if(x==null||y==null) return null; d2 += (x-y)*(x-y) }
  return 1 - 6*d2/(n*(n*n-1));
}

// Poll rank per team: a single week, or averaged over every week polled.
function pollRanks(week){
  if(week != null){
    const {bs,rows} = tally(week);
    if(!bs.length) return null;
    const r={}; rows.forEach((x,i)=>r[x.t.id]=i+1); return r;
  }
  const weeks = weeksWithBallots(); if(!weeks.length) return null;
  const sum={}, n={};
  weeks.forEach(w=>tally(w).rows.forEach((x,i)=>{ sum[x.t.id]=(sum[x.t.id]||0)+i+1; n[x.t.id]=(n[x.t.id]||0)+1 }));
  const avg={}; TEAMS.forEach(t=>{ if(n[t.id]) avg[t.id]=sum[t.id]/n[t.id] });
  // turn the average into a rank so it compares like-for-like with the stat rank
  const order=Object.keys(avg).sort((a,b)=>avg[a]-avg[b]);
  const r={}; order.forEach((k,i)=>r[k]=i+1);
  return Object.assign(r, {__avg:avg});
}

function analysisData(){
  const perWeek = S.aScope !== "season";
  const week = perWeek ? S.week : null;
  const m = METRICS[S.aMetric] || METRICS.record;
  const vals = metricValues(S.aMetric, week);
  const pr = pollRanks(week);
  if(!pr) return {error:"no-poll", m, week, perWeek};
  const have = TEAMS.filter(t=>vals[t.id]!=null && pr[t.id]!=null).map(t=>t.id);
  if(!have.length) return {error:"no-stat", m, week, perWeek};
  const sr = rankMap(Object.fromEntries(have.map(id=>[id,vals[id]])), m.lowBetter);
  const rows = have.map(id=>({
    t:T[id], val:vals[id], pollRank:pr[id], statRank:sr[id],
    gap: sr[id]-pr[id]                       // >0 poll rates them above the stat
  })).sort((a,b)=>a.pollRank-b.pollRank);
  return {rows, m, week, perWeek, rho:spearman(pr, sr, have), avg:pr.__avg};
}

/* --- view 1: diverging gap bars (above/below a baseline -> diverging hues) --- */
function gapChart(rows){
  const max = Math.max(2, ...rows.map(r=>Math.abs(r.gap)));
  return `<div class="gapwrap">${rows.slice().sort((a,b)=>b.gap-a.gap).map(r=>{
    const pctW = Math.abs(r.gap)/max*50;
    const side = r.gap>0 ? "over" : r.gap<0 ? "under" : "even";
    return `<div class="gaprow" title="${esc(r.t.name)}: poll #${r.pollRank}, ${esc(METRICS[S.aMetric].short)} #${r.statRank}">
      <span class="gapname">${img(r.t.id)}<b>${esc(shortName(r.t.name))}</b></span>
      <span class="gapbar">
        <i class="${side}" style="${r.gap>0?`left:50%;width:${pctW}%`:`right:50%;width:${pctW}%`}"></i>
        <em class="axis"></em>
      </span>
      <span class="gapnum ${side}">${r.gap>0?"+":""}${r.gap||"0"}</span>
    </div>`;
  }).join("")}</div>`;
}

/* --- view 2: scatter, poll rank against the statistic --- */
function scatterChart(rows, m){
  const W=880,H=420,ml=54,mr=120,mt=18,mb=44, pw=W-ml-mr, ph=H-mt-mb;
  const vs=rows.map(r=>r.val), lo=Math.min(...vs), hi=Math.max(...vs);
  const pad=(hi-lo)*0.08||1, x0=lo-pad, x1=hi+pad;
  const X=v=>ml+((v-x0)/(x1-x0))*pw;
  const Y=r=>mt+((r-1)/(TEAMS.length-1))*ph;
  let grid="";
  for(let r=1;r<=TEAMS.length;r+=Math.ceil(TEAMS.length/6)){
    const y=Y(r).toFixed(1);
    grid+=`<line class="gl" x1="${ml}" y1="${y}" x2="${ml+pw}" y2="${y}"></line>
      <text class="ax" x="${ml-10}" y="${y}" text-anchor="end" dominant-baseline="middle">#${r}</text>`;
  }
  const ticks=[x0,(x0+x1)/2,x1].map(v=>
    `<text class="ax" x="${X(v).toFixed(1)}" y="${H-14}" text-anchor="middle">${esc(m.fmt(v))}</text>`).join("");
  const dots=rows.map(r=>{
    const cx=X(r.val).toFixed(1), cy=Y(r.pollRank).toFixed(1);
    const side = r.gap>0?"over":r.gap<0?"under":"even";
    return `<g><circle class="sdot ${side}" cx="${cx}" cy="${cy}" r="6"><title>${esc(r.t.name)} — poll #${r.pollRank}, ${esc(m.short)} #${r.statRank}</title></circle>
      <text class="slbl" x="${(+cx+10).toFixed(1)}" y="${cy}" dominant-baseline="middle">${esc(shortName(r.t.name).slice(0,16))}</text></g>`;
  }).join("");
  return `<svg class="scat" viewBox="0 0 ${W} ${H}" role="img" aria-label="Poll rank against ${esc(m.label)}. Exact values are in the table below.">
    <g>${grid}</g><g>${ticks}</g>
    <text class="axt" x="${ml+pw/2}" y="${H-1}" text-anchor="middle">${esc(m.label)} →</text>
    <text class="axt" x="14" y="${mt+ph/2}" text-anchor="middle" transform="rotate(-90 14 ${mt+ph/2})">← better poll rank</text>
    <g>${dots}</g></svg>`;
}

/* --- view 3: the gap over time, emphasis form --- */
function trendChart(){
  const weeks=weeksWithBallots().filter(w=>SCHED&&SCHED.byWeek&&SCHED.byWeek[w]);
  if(weeks.length<2) return null;
  const m=METRICS[S.aMetric];
  const series={}; TEAMS.forEach(t=>series[t.id]={});
  weeks.forEach(w=>{
    const vals=metricValues(S.aMetric,w);
    const {bs,rows}=tally(w); if(!bs.length) return;
    const pr={}; rows.forEach((x,i)=>pr[x.t.id]=i+1);
    const have=TEAMS.filter(t=>vals[t.id]!=null).map(t=>t.id);
    const sr=rankMap(Object.fromEntries(have.map(id=>[id,vals[id]])), m.lowBetter);
    have.forEach(id=>{ if(pr[id]) series[id][w]=sr[id]-pr[id] });
  });
  const live=weeks.filter(w=>TEAMS.some(t=>series[t.id][w]!=null));
  if(live.length<2) return null;
  const W=880,H=330,ml=34,mr=150,mt=16,mb=28, pw=W-ml-mr, ph=H-mt-mb;
  const all=[]; TEAMS.forEach(t=>live.forEach(w=>{ if(series[t.id][w]!=null) all.push(series[t.id][w]) }));
  const lim=Math.max(2,...all.map(Math.abs));
  const X=i=>live.length===1?ml+pw/2:ml+(i/(live.length-1))*pw;
  const Y=v=>mt+ph/2-(v/lim)*(ph/2);
  const on=S.lock||S.hover;
  const path=id=>live.filter(w=>series[id][w]!=null)
    .map((w,i)=>`${i?"L":"M"}${X(live.indexOf(w)).toFixed(1)},${Y(series[id][w]).toFixed(1)}`).join("");
  return `<svg class="bump ${on?"dim":""}" id="gaptrend" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gap between poll rank and ${esc(m.label)} rank, week by week.">
    <line class="zero" x1="${ml}" y1="${Y(0)}" x2="${ml+pw}" y2="${Y(0)}"></line>
    <text class="ax" x="${ml-8}" y="${Y(lim)}" text-anchor="end" dominant-baseline="middle">+${lim}</text>
    <text class="ax" x="${ml-8}" y="${Y(0)}" text-anchor="end" dominant-baseline="middle">0</text>
    <text class="ax" x="${ml-8}" y="${Y(-lim)}" text-anchor="end" dominant-baseline="middle">-${lim}</text>
    <g>${live.map((w,i)=>`<text class="ax" x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle">Wk ${w}</text>`).join("")}</g>
    <g>${TEAMS.filter(t=>path(t.id)).map(t=>`<path class="ctx" d="${path(t.id)}"></path>`).join("")}</g>
    <g>${on&&path(on)?`<path class="em" d="${path(on)}"></path>
      <text class="lbl" x="${(X(live.length-1)+10).toFixed(1)}" y="${Y(series[on][live[live.length-1]]??0).toFixed(1)}" dominant-baseline="middle">${esc(shortName(T[on].name))}</text>`:""}</g>
    <g>${TEAMS.filter(t=>path(t.id)).map(t=>`<path class="hit" d="${path(t.id)}" data-team="${t.id}"><title>${esc(t.name)}</title></path>`).join("")}</g>
  </svg>`;
}

  const strength = d.rho==null ? "" :

  else { chart = `<div class="pad">${gapChart(d.rows)}</div>`;
    note = `Bars to the right: the poll rates them <b>above</b> their ${esc(m.short)}. To the left: <b>below</b>.`; }

  main.innerHTML = head("Does the league's opinion match what the teams are actually doing?")+controls+
  `<div class="tiles" style="margin-bottom:16px">
     <div class="tile"><b>${d.rho==null?"–":d.rho.toFixed(2)}</b><span>Poll vs ${esc(m.short)}</span><i>rank agreement, −1 to 1</i></div>
     <div class="tile"><b class="bad">${esc(shortName(over.t.name))}</b><span>Poll's biggest favourite</span><i>${over.gap>0?`${over.gap} spots above`:"nobody is overrated"} their ${esc(m.short)}</i></div>
     <div class="tile"><b class="good">${esc(shortName(under.t.name))}</b><span>Most underrated</span><i>${under.gap<0?`${-under.gap} spots below`:"nobody is underrated"} their ${esc(m.short)}</i></div>
     <div class="tile"><b>${esc(scopeTxt)}</b><span>Comparing</span><i>${d.rows.length} teams with data</i></div>
   </div>
   <section class="panel"><h2>Poll vs ${esc(m.label)} · ${esc(scopeTxt)}</h2>${chart}</section>
   ${note?`<p class="hint" style="margin-top:10px">${note} ${esc(strength)}</p>`:""}
   <section class="panel" style="margin-top:16px"><h2>The numbers</h2><div class="scroll"><table class="cards">
     <thead><tr><th class="num">Poll</th><th>Team</th><th class="num">${esc(m.label)}</th><th class="num">${esc(m.short)} rank</th><th class="num">Gap</th></tr></thead>
     <tbody>${d.rows.map(r=>`<tr>
       <td class="bigrk">${r.pollRank}</td>
       <td><div class="teamcell">${img(r.t.id)}<div class="nm"><b>${esc(r.t.name)}</b><i>${esc(r.t.owner)}</i></div></div></td>
       <td class="num stat" data-l="${esc(m.label)}">${esc(m.fmt(r.val))}</td>
       <td class="num stat" data-l="Stat rank">#${r.statRank}</td>
       <td class="num stat" data-l="Gap"><b class="${r.gap>0?"bad":r.gap<0?"good":""}">${r.gap>0?"+":""}${r.gap}</b></td></tr>`).join("")}
     </tbody></table></div></section>
   <p class="hint" style="margin-top:10px"><b>Gap</b> is the stat's rank minus the poll's rank. Positive means the league ranks them <b class="bad">higher</b> than the numbers do; negative means <b class="good">lower</b>.${d.perWeek?"":" Season poll rank is each team's average finish across every poll."}</p>`+tail;
  if(S.aView==="trend") updateLockbar();
}

/* ---------- voters ---------- */
function voterGaps(w){
  const {bs,rows}=tally(w);
  if(!bs.length) return [];
  const cons={}; rows.forEach((r,i)=>cons[r.t.id]=i+1);
  return bs.map(b=>{
    let dev=0, worst=null;
    b.order.forEach((id,i)=>{const diff=Math.abs((i+1)-cons[id]); dev+=diff;
      if(!worst||diff>worst.diff) worst={id,diff,mine:i+1,cons:cons[id]}});
    const own=b.order.indexOf(b.voter)+1;
    return {v:b.voter, top:b.order[0], avg:dev/b.order.length, own, homer:cons[b.voter]-own, worst, at:b.at};
  }).sort((a,b)=>a.avg-b.avg);
}
/* How one voter treats every team, across whichever weeks they voted in.
   Positive bias = they rank that team HIGHER (better) than the league does. */
function voterProfile(v){
  const weeks = weeksWithBallots().filter(w => S.ballots.some(b=>b.week===w && b.voter===v));
  const bias = {};   // teamId -> {diffs:[], weeks:[]}
  TEAMS.forEach(t=>bias[t.id]={diffs:[],byWeek:{}});
  const perWeek = [];
  weeks.forEach(w=>{
    const {rows} = tally(w);
    const cons = {}; rows.forEach((r,i)=>cons[r.t.id]=i+1);
    const b = S.ballots.find(x=>x.week===w && x.voter===v);
    if(!b) return;
    let dev=0;
    b.order.forEach((id,i)=>{
      const mine=i+1, d=cons[id]-mine;     // + = voter ranks them higher than consensus
      if(bias[id]){ bias[id].diffs.push(d); bias[id].byWeek[w]=d }
      dev += Math.abs(d);
    });
    const own = b.order.indexOf(v)+1;
    perWeek.push({w, order:b.order, gap:dev/b.order.length, own, ownCons:cons[v], homer:cons[v]-own, at:b.at});
  });
  const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
  const teams = TEAMS.map(t=>({
    t, n:bias[t.id].diffs.length, avg:avg(bias[t.id].diffs), byWeek:bias[t.id].byWeek
  })).filter(x=>x.n>0).sort((a,b)=>b.avg-a.avg);
  return {
    weeks, perWeek, teams,
    high: teams.filter(x=>x.avg>0).slice(0,5),
    low: teams.filter(x=>x.avg<0).slice(-5).reverse(),
    gap: avg(perWeek.map(p=>p.gap)),
    homer: avg(perWeek.map(p=>p.homer)),
    ballots: perWeek.length
  };
}

       <td class="num stat" data-l="Gap"><b>${x.gap.toFixed(2)}</b></td>
       <td class="stat" data-l="Ballot"><span class="hint">${x.order.map(id=>esc(shortName(T[id]?.name||"?"))).join(" › ")}</span></td></tr>`).join("")}
     </tbody></table></div></section>`;
}

function renderVoters(){

function updateWeekChrome(){
  const open=votingOpen(), flip=humanMins(minsToFlip()), nw=ballotWeek();
  const title = open
    ? `Week ${S.week} ballots are open until Thursday 8:00 PM ET.`
    : windowOpen()
      ? `Ballots are open for Week ${nw}, not Week ${S.week}.`
      : `Week ${nw} ballots open Tuesday 12:00 AM ET — in ${flip}.`;
  for(const id of ["wkflag","wkflag-m"]){
    const f=document.getElementById(id); if(!f) continue;
    f.textContent = open ? `Voting closes in ${flip}` : "Results only";
    f.className = "wkflag"+(open?" open":"");
    f.title = title;
  }
  // the nav carries the same dot, so an open window is visible from any section
  const dot=document.getElementById("votedot"); if(dot) dot.hidden = !open;
}

// Only weeks that have actually happened, plus whichever week is being voted on.
// Nothing further ahead: an empty Week 12 in September is just noise.
function latestWeek(){
  const voted = S.ballots.length ? Math.max(...S.ballots.map(b=>b.week)) : 0;
  return Math.min(18, Math.max(1, CURRENT_WEEK, ballotWeek(), voted));
}
/* Two pickers — one in the rail, one in the phone's top bar — showing one week. */
const weekSels = () => [document.getElementById("week"), document.getElementById("week-m")].filter(Boolean);
const wk = document.getElementById("week");
function buildWeekOptions(){
  const max=latestWeek(), nw=ballotWeek();
  for(const sel of weekSels()){
    const keep=+sel.value||S.week;
    sel.innerHTML="";
    for(let i=max;i>=1;i--){
      const o=document.createElement("option"); o.value=i;
      o.textContent = i===nw ? `Week ${i} · voting` : `Week ${i}`;
      sel.appendChild(o);
    }
    sel.value = Math.min(keep, max);
  }
}

// The window opens and closes on a clock, so the page has to notice on its own
// rather than waiting for a reload.
let lastOpen=null, lastWeek=null;
function tick(){
  const w=pollWeekFor(), open=windowOpen();
  const rolled = w!==lastWeek, flipped = open!==lastOpen;
  if(rolled){
    const wasOnCurrent = S.week===lastWeek;
    CURRENT_WEEK=w; lastWeek=w;
    if(wasOnCurrent || lastOpen===null){ S.week=w; for(const sel of weekSels()) sel.value=w; S.ranked=[]; preloadOwn(); }
    buildWeekOptions();
  }
  lastOpen=open;
  if(rolled||flipped) render(); else updateWeekChrome();
  refreshBallots();
  if(S.tab==="casino") loadCasino();   // lines move every minute
}

const pct = p => p>=.995 ? ">99%" : p<=.005 && p>0 ? "<1%" : p===0 ? "—" : (p*100).toFixed(0)+"%";
const oddsPct = p => p<.001?"&lt;0.1%":p>.999?"&gt;99.9%":(p*100).toFixed(1)+"%";
const oddsBar = p => `<span class="obar"><i style="width:${Math.max(0,Math.min(100,p*100)).toFixed(1)}%"></i></span>`;

  const interval=(r,k)=>{const c=r.interval?.[k];return c?`95% simulation sampling interval: ${(c[0]*100).toFixed(1)}–${(c[1]*100).toFixed(1)}%. This does not include model uncertainty.`:"";};
  const byDiv={};TEAMS.forEach(t=>(byDiv[t.div]||=[]).push(t));

      embed ? `${o.sims.toLocaleString()} simulated seasons · updated ${esc(updated)} ET · refreshed daily` : undefined)+
    (age>36||behind?`<div class="banner" role="status">${behind?"New results have arrived since this forecast.":"The daily update is delayed."} Showing the last successful simulation from ${esc(updated)} ET.</div>`:"")+
    `<section class="panel"><h2>Playoffs and championship</h2><div class="scroll"><table class="cards norank">
    <thead><tr><th>Team</th><th>Div</th><th class="num">Sim pts/wk</th><th class="num">Proj record</th><th class="num">Make playoffs</th><th class="num">Win div</th><th class="num">Bye</th><th class="num">Final</th><th class="num">Title</th></tr></thead>
    <tbody>${rows.map(r=>`<tr>
      <td><div class="teamcell">${img(r.t.id)}<div class="nm"><b>${esc(r.t.name)}</b><i>${esc(r.t.owner)} · ${rec(r.t)}</i></div></div></td>
      <td class="stat" data-l="Division">${esc(DIVISIONS[r.t.div]||("Div "+r.t.div))}</td>
      <td class="num stat" data-l="Sim pts/wk" title="Average simulated remaining regular-season lineup score, including byes and absences.">${r.meanPoints==null?"—":r.meanPoints.toFixed(1)}</td>
      <td class="num stat" data-l="Proj record">${r.projW.toFixed(1)}–${r.projL.toFixed(1)}${r.projT>=.05?"–"+r.projT.toFixed(1):""}</td>
      ${["po","div","bye","final","title"].map((k,i)=>`<td class="num stat" data-l="${["Playoffs","Win div","Bye","Final","Title"][i]}" title="${interval(r,k)}"><b>${chance(r[k])}</b>${k==="po"?" "+oddsBar(r[k]):""}</td>`).join("")}</tr>`).join("")}
    </tbody></table></div></section>
    <section class="panel" style="margin-top:16px"><h2>Divisions</h2><div class="pad" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px">
    ${Object.keys(byDiv).sort().map(d=>`<div><p class="kicker">${esc(DIVISIONS[d]||("Division "+d))}</p>
      ${byDiv[d].slice().sort((a,b)=>(b.w+(b.t||0)/2)-(a.w+(a.t||0)/2)||b.pf-a.pf).map(t=>`<div class="roballot" style="padding:6px 0;border:0">${img(t.id)}<span class="nm"><b>${esc(t.name)}</b><i>${rec(t)} · ${t.pf.toFixed(1)} PF</i></span></div>`).join("")}</div>`).join("")}
    </div></section>
    <section class="panel" style="margin-top:16px"><h2>How this works</h2><div class="pad">
      <p><b>${o.sims.toLocaleString()} possible seasons.</b> Player performances from ${o.historicalSeasons.join(", ")} are scored using this league’s scoring settings, including tight-end premiums and first downs. A weighted lottery gives every projected player a points-per-game profile for each simulated season. Higher-ranked players have better chances at the strongest profiles, while both breakouts and busts remain possible. That player’s baseline average stays fixed throughout that simulated season.</p>
      <p><b>Players, lineups, and weekly variance.</b> Each remaining week uses the best legal lineup by expected points, including superflex. A player’s forecast for that week relative to their remaining-season average adjusts their assigned scoring profile, so projected matchup and role differences matter in every round. NFL byes and zero weekly projections make a player unavailable; injured reserve players can return when their forecasts do. Additional missed games are randomized using historical absence rates. Weekly scores follow normal distributions around the adjusted player averages, with spread estimated from historical game scores. Lineups are chosen before the week’s random scores are drawn.</p>
      <p><b>The complete remaining schedule.</b> ${weeksLeft} regular-season weeks remain in this snapshot. Completed results and locked player scores are preserved. ${o.medianMatch?"Each regular-season week counts both head-to-head and against the league median; tied scores remain ties.":"Regular-season weeks count head-to-head results."} The playoff rounds use Weeks ${o.lastRegular+1}–${o.lastWeek}, including those weeks’ byes and availability.</p>
      <p><b>Three divisions, six playoff teams.</b> All three division winners qualify, plus three wildcards. The two best division winners get byes. The remaining four seeds are ordered by overall record, then points for, then higher points against. ${o.reseed?"The semifinals reseed so the best seed faces the lowest remaining seed.":"The bracket keeps its original matchups."} Playoff ties go to the higher seed, and there is no median game in the playoffs.</p>
      <p><b>Reading the probabilities.</b> With ${o.sims.toLocaleString()} simulations, a 50% estimate has about ±${(98/Math.sqrt(o.sims)).toFixed(1)} percentage points of sampling uncertainty. Hover a probability for its 95% sampling interval. &lt;0.1% and &gt;99.9% can mean no successes or no failures in this sample; they do not prove a team is eliminated or clinched. Bye means a first-round bye, Final means reaching the championship, and Title means winning it; all are chances from today, not chances conditional on qualifying. The model also has uncertainty beyond sampling: future trades, managerial decisions, injury timelines, and correlated player performances are not fully predictable. Historical missed games include benchings as well as injuries.</p>
      <p class="hint">Updates each morning around 6:17 AM ET, with retries if source data is unavailable. Historical ranking uncertainty is fitted to player data; team results bank standings without changing player talent. The poll is never an input. <a href="https://github.com/foxsamuel-pro/wcxcDynasty/blob/main/docs/playoff-odds.md" target="_blank" rel="noopener">Methodology and validation</a></p>
    </div></section>`;
}

/* ---------- trades ----------
   Built by scripts/trades/build.mjs. Every deal since the league started, with
   what each side has scored SINCE the trade — players received, plus the players
   actually drafted with the picks received. A pick traded on again counts toward
   that later trade, never twice; it carries a trail instead.                  */
/* tradesLoaded is what stops a failed load retrying forever: on failure the
   fetch clears BOTH halves of its own guard (TRADES stays null, tradesLoading
   goes false), renderTrades sees no archive and calls the loader straight back,
   and the tab refetches as fast as the network answers. Measured at ~200
   requests in three seconds. loadOdds has always latched oddsLoaded for exactly
   this reason; this is the same latch. */
let TRADES = null, tradesLoading = false, tradesLoaded = false;
const ord = n => ({1:"1st",2:"2nd",3:"3rd"})[n] || `${n}th`;

async function loadTrades(){
  if(TRADES || tradesLoading || tradesLoaded) return;
  tradesLoading = true;
  TRADES = await fetch("trades.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).catch(()=>null);
  tradesLoading = false; tradesLoaded = true;      // tried, whatever came back
  if(S.tab==="trades") renderTrades();
}

const trName = id => TRADES?.franchises?.[id]?.name || T[id]?.name || `Team ${id}`;
const trShort = id => SHORT_NAMES[id] || trName(id);

// One side's haul. Picks read as what they became, or what they are still waiting on.
function trSide(side, trade){
  const won = trade.valueWinner === side.team;
  const val = v => v ? `<i class="trval" title="Dynasty market value today">${v.toLocaleString()}</i>` : "";
  const items = [
    /* The price shows whether or not the team still has him. It was handed to
       them by this trade; selling him on later is a different trade, and that one
       debits them for it. "No longer here" is a note, not a reason to show nothing. */
    ...side.players.map(p=>`<li><span>${esc(p.name)}${p.pos?` <i class="dvia">${esc(p.pos)}</i>`:""}
      ${val(p.value)}${p.kept?"":`<i class="dvia">no longer here</i>`}</span>
      <b class="trpts" title="Points scored for this team since the trade, from a starting spot">${p.started.toFixed(1)}<i>in lineup</i></b></li>`),
    ...side.picks.map(p=>{
      const via = p.from!==side.team ? `<i class="dvia">via ${esc(trShort(p.from))}</i>` : "";
      const became = p.became
        ? `<i class="trbecame">→ ${esc(p.became.name)}${p.became.pos?` ${esc(p.became.pos)}`:""} <span class="hint">#${p.became.pickNo}</span></i>`
        : `<i class="trpending">→ not drafted yet</i>`;
      const moved = p.movedOn ? `<i class="trchain" title="This team traded the pick on again later. Its points count toward that later deal; its value still counts here, because the pick was handed over by this one.">traded on</i>` : "";
      const worth = p.became
        ? `${val(p.became.value)}${p.became.kept?"":`<i class="dvia">no longer here</i>`}`
        : val(p.value);
      const scored = p.became
        ? `${p.became.started.toFixed(1)}<i>in lineup</i>`
        : `–`;
      return `<li><span>${p.season} ${ord(p.round)} ${via} ${became} ${moved} ${worth}</span>
        <b class="trpts">${scored}</b></li>`;
    }),
    ...(side.budget ? [`<li><span>$${side.budget} FAAB</span><b class="trpts">–</b></li>`] : [])
  ];
  return `<div class="dside${won?" trwon":""}">
    <b>${img(side.team,"figav trav")}${esc(trName(side.team))}${won?`<span class="trbadge">won the value</span>`:""}</b>
    ${items.length?`<ul>${items.join("")}</ul>`:`<p class="hint" style="margin:4px 0 0">Nothing recorded coming back.</p>`}
    <p class="trtotal">${side.value ? side.value.toLocaleString() : "0"} <span>value received</span>
      <i class="trsub">${side.started.toFixed(1)} in lineup</i>${
      /* Only the percentage goes on the card. The raw then and now come from the
         historical feed, which prices on a different scale from the value shown
         against each asset — printing 274 beside the same pick's 1,641 would read
         as an error rather than as two different rulers. */
      side.swing?`<i class="trsub trswing ${side.swing.pct>=0?"up":"down"}" title="On the historical market this haul was worth ${side.swing.then.toLocaleString()} the day of the trade and ${side.swing.now.toLocaleString()} today — a different scale from the prices above, which is why only the change is shown. ${side.swing.tracked} of ${side.players.length+side.picks.length} assets had a price at both ends.">${side.swing.pct>=0?"+":"−"}${Math.abs(side.swing.pct)}% since the trade</i>`:""}${
      side.sameManager===false?`<i class="trsub">different manager then</i>`:""}</p>
  </div>`;
}

function renderTrades(){
  if(!TRADES){
    loadTrades();
    main.innerHTML = banner()+header("Trade archive","Every deal in league history, and what each side has scored since.")+
      `<section class="panel"><div class="pad"><p class="hint">${tradesLoaded
        ? "The trade archive couldn't be loaded. Refresh to try again."
        : "Loading the archive…"}</p></div></section>`;
    return;
  }
  const all = TRADES.trades;
  const team = S.trTeam ?? "all", season = S.trSeason ?? "all";
  const rows = all.filter(t =>
    (team==="all" || t.sides.some(s=>String(s.team)===String(team))) &&
    (season==="all" || String(t.season)===String(season)));

  /* The board follows the filter. Looking at one season and being shown an
     all-time scoreboard invites exactly the wrong conclusion. */
  const net = {};
  for(const t of rows) for(const s of t.sides){
    const n = net[s.team] = net[s.team] || {started:0, conceded:0, value:0, lost:0,
      paid:0, worth:0, sold:0, since:0, deals:0, wins:0};
    n.started += s.started || 0; n.value += s.value || 0; n.deals++;
    if(t.valueWinner===s.team) n.wins++;
    /* What this team's hauls cost on the day against what they are worth now,
       and the same for what it gave up. Both sides drift with the market, so
       taking one from the other cancels the drift and leaves the judgement. */
    if(s.swing){ n.paid += s.swing.then; n.worth += s.swing.now; }
    /* What a side gave is attributed at build time to the roster the asset
       actually left, not taken as "whatever the other sides received" — in the
       two three-way deals those are different, and only the first one balances. */
    n.conceded += s.gaveStarted || 0; n.lost += s.gaveValue || 0;
    if(s.gave){ n.sold += s.gave.then; n.since += s.gave.now; }
  }
  /* Sorted on market value, which is the verdict: it prices everything a side
     holds, including picks nobody has used, where points can only ever describe
     what has already happened. */
  /* Bought well is a percentage gap, not a raw total, for two reasons. The
     historical feed prices on a different scale from the FantasyCalc column
     beside it, so two raw numbers next to each other would read as a
     contradiction; and summing the percentages from totals rather than averaging
     per-trade keeps a team's big deals weighted above its small ones. */
  const pctGain = (from,to) => from>0 ? (to/from-1)*100 : null;
  const board = Object.entries(net).map(([id,n])=>{
    const mine=pctGain(n.paid,n.worth), theirs=pctGain(n.sold,n.since);
    return {id:+id, ...n, mine, theirs,
      startedDiff:n.started-n.conceded, valueDiff:n.value-n.lost,
      swingPct: mine==null?null:mine-(theirs??0)};
  }).sort((a,b)=>b.valueDiff-a.valueDiff);

  const seasons = [...new Set(all.map(t=>t.season))].sort((a,b)=>b-a);
  main.innerHTML = banner()+header("Trade archive",
    `${all.length} trades since ${Math.min(...TRADES.seasons)}. Each side is graded on what it holds <b>now</b>, what it has gained <b>since</b> the swap, and what it put in a lineup — players received, plus whoever their picks became.`)+
  `<section class="panel"><div class="pad trfilter">
     <label>Team <select id="trteam">
       <option value="all"${team==="all"?" selected":""}>Every team</option>
       ${TEAMS.map(t=>`<option value="${t.id}"${String(team)===String(t.id)?" selected":""}>${esc(trName(t.id))}</option>`).join("")}
     </select></label>
     <label>Season <select id="trseason">
       <option value="all"${season==="all"?" selected":""}>All seasons</option>
       ${seasons.map(y=>`<option value="${y}"${String(season)===String(y)?" selected":""}>${y}</option>`).join("")}
     </select></label>
     <span class="hint">${rows.length} shown</span>
   </div></section>

   <section class="panel" style="margin-top:16px"><h2>Who has come out ahead</h2>
     <p class="hint" style="margin:0 12px 10px">Net of what a team received against what it sent away${
       season==="all"?" across every season":` in ${esc(String(season))}`}. Ranked on <b>market value</b> — what the assets are worth today, which is the only measure that can price a pick nobody has used yet. <b>Bought well</b> asks the other question: has what you took gained on what you gave since the day you swapped them.</p>
     <div class="scroll"><table class="cards norank">
     <thead><tr><th>#</th><th>Team</th>
       <th class="num" title="Market value of everything this team received, minus the value of everything it sent away, priced today. Whether the team still holds an asset does not matter — it was handed over by the trade, and a later trade is where selling it on gets counted.">Market value<i class="subh">net worth of assets, priced today</i></th>
       <th class="num" title="How much what this team bought has gained on the market since the day it bought it, less the same for what it sold. Both hauls are priced on the trade date and again today, so a market that moved for everyone cancels out and what is left is the judgement.">Bought well<i class="subh">% gain, bought vs sold</i></th>
       <th class="num">Trades</th>
       <th class="num" title="Points the players this team acquired scored while actually in its starting lineup, minus the same for the players it sent away. Bench points are excluded.">In lineup<i class="subh">net points, starters only</i></th></tr></thead>
     <tbody>${board.map((r,i)=>`<tr>
       <td class="rank">${i+1}</td>
       <td><div class="teamcell">${img(r.id)}<div class="nm"><b>${esc(trName(r.id))}</b><i>${r.wins} of ${r.deals} best return</i></div></div></td>
       <td class="num stat" data-l="Market value"><b class="trbig projv ${r.valueDiff>=0?"hi":"lo"}">${r.valueDiff>=0?"+":"−"}${Math.abs(r.valueDiff).toLocaleString()}</b></td>
       <td class="num stat" data-l="Bought well">${r.swingPct==null?`<span class="hint">—</span>`
         :`<span class="projv ${r.swingPct>=0?"hi":"lo"}" title="What this team bought is ${r.mine>=0?"up":"down"} ${Math.abs(r.mine).toFixed(1)}% since it bought it. What it gave away is ${(r.theirs??0)>=0?"up":"down"} ${Math.abs(r.theirs??0).toFixed(1)}%. The gap between those is what is shown.">${r.swingPct>=0?"+":"−"}${Math.abs(r.swingPct).toFixed(1)}%</span>`}</td>
       <td class="num stat" data-l="Trades">${r.deals}</td>
       <td class="num stat" data-l="In lineup"><span class="projv ${r.startedDiff>=0?"hi":"lo"}">${r.startedDiff>=0?"+":"−"}${Math.abs(r.startedDiff).toFixed(0)}</span></td>
     </tr>`).join("")}</tbody></table></div>
   </section>

   ${rows.length?rows.map(t=>`
     <section class="panel trcard" style="margin-top:16px">
       <div class="trhead">
         <span class="kicker">${t.season} · ${t.week?`Week ${t.week}`:"Offseason"} · ${esc(t.date)}</span>
         ${t.oneSided?`<span class="trflag">only one side recorded</span>`
           :t.valueMargin?`<span class="trmargin">${t.valueMargin.toLocaleString()} apart in value</span>`
           :t.startedMargin?`<span class="trmargin">${t.startedMargin.toFixed(1)} apart in lineup</span>`:""}
         ${!t.oneSided && t.startedWinner!=null && t.valueWinner!=null && t.startedWinner!==t.valueWinner
           ? `<span class="trsplit" title="The market and the points disagree about this one">points favoured ${esc(trShort(t.startedWinner))}</span>`:""}
         ${t.pendingPicks?`<span class="trflag">${t.pendingPicks} pick${t.pendingPicks>1?"s":""} still to be made</span>`:""}
       </div>
       <div class="pad"><div class="deal trdeal">${t.sides.map(s=>trSide(s,t)).join("")}</div></div>
     </section>`).join("")
   :`<section class="panel" style="margin-top:16px"><div class="pad"><p class="hint">No trades match that filter.</p></div></section>`}

   <section class="panel" style="margin-top:16px"><h2>How this is counted</h2><div class="pad">
     <p style="margin:0 0 9px"><b>Market value decides it.</b> A trade is a swap of assets, so the verdict is what those assets are worth — and that is the only measure that can price a pick nobody has used yet. On points alone a rebuild scores zero forever, no matter how well it went. Values are priced for this league's exact settings and refresh with the rest of the archive every morning, so a verdict moves as the market does.</p>
     <p style="margin:0 0 9px"><b>Bought well</b> is the second number, and it grades the decision rather than the outcome. Each side's haul is priced on the day of the trade and again today; so is what it gave up. Gaining more than you gave means you read the market better, and because every asset is caught by the same market swings, taking one from the other cancels them — a year when everything drifted down drifts down on both sides of the ledger. Unlike market value it does <i>not</i> care whether the team still owns the player: flipping him on later is a separate decision and gets judged in its own row.</p>
     <p style="margin:0 0 9px"><b>In lineup</b> is what the deal has actually delivered — what the acquired players scored <i>while in that team's starting lineup</i>. A player who puts up 20 on your bench won you nothing, and a raw points total cannot tell the difference, which is why the raw total is no longer shown. The three measures disagree on the winner often, and that is usually where the interesting part is.</p>
     <p style="margin:0 0 9px">Sleeper records a traded pick only as a round and its original owner, so each one is matched to the draft slot that owner held and then to the selection made with it — that is how a 2025 3rd becomes a named rookie here. <b>A pick traded on again counts toward the later deal</b>, marked <i class="trchain">traded on</i>, so a chain stays visible without being double-counted.</p>
     <p style="margin:0 0 9px"><b>That rule is about points, not value.</b> Market value counts every asset a trade handed over, whether or not the team still has it — what you were given is what you were given, and selling it on afterwards is a different trade, which debits you for it there. Pricing only what is still on the roster made a team that flipped a pick look as though it had received nothing. Nothing is counted twice: one side's haul is the other side's loss at the identical price, so every column here sums to zero across the twelve teams.</p>
     <p style="margin:0 0 9px"><b>Where the values come from.</b> <a href="https://fantasycalc.com" target="_blank" rel="noopener">FantasyCalc</a>, which derives them from real trades across thousands of leagues. Players are matched on their Sleeper id rather than by name, so there is no guessing between two players who share one.</p>
     <p style="margin:0 0 9px"><b>And where they need help.</b> The feed can be told this is a 12-team superflex half-PPR dynasty league, and is. It cannot be told the league is <b>tight end premium with points per first down</b> — there is no parameter for either. Left alone it would therefore price tight ends as though a catch were worth half what it actually is here. So each position is corrected by how far this league's real scoring lifts it relative to the rest, measured across four seasons of actual stat lines: tight ends up about 21%, receivers down about 6%, running backs down 3%, quarterbacks unchanged. The correction is measured rather than chosen, and it recomputes itself if the scoring ever changes.</p>
     <p style="margin:0 0 9px"><b>And where the old prices come from.</b> FantasyCalc publishes today's market but keeps no history, so "what was this worth then" has to be asked of <a href="https://github.com/dynastyprocess/data" target="_blank" rel="noopener">DynastyProcess</a>, which has committed its superflex values to a public archive every week since 2019 — far enough back to cover every trade here. The two price on completely different scales, so they are never mixed: <i>Bought well</i> reads both ends from the historical archive alone, which is also why it is shown as a change rather than a total.</p>
     <p class="hint" style="margin:0">Everything is measured from the trade forward. Values refresh each morning when the archive rebuilds, so the board moves with the market. Picks beyond the fourth round, or for drafts more than three years out, are not priced — there is no market to read, and an asset without a price at <i>both</i> ends is left out of <i>Bought well</i> rather than guessed at.</p>
   </div></section>`;

  document.getElementById("trteam")?.addEventListener("change",e=>{S.trTeam=e.target.value; renderTrades()});
  document.getElementById("trseason")?.addEventListener("change",e=>{S.trSeason=e.target.value; renderTrades()});
}

const csLum = hex => { const c = [1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055,2.4));

/* ---- college: teams, logos and jerseys ----

   (abbreviation, school, colours, conference, this week's AP ranking) is in
   cfb.json, rebuilt daily by scripts/cfb/build.mjs and loaded when College is
   first opened; until it arrives the board reads the names on the lines.
   There are too many schools to hand-pick home jerseys for, so a college jersey
   is ESPN's own team colours: primary body, alternate trim. The number is the
   one ESPN's roster lists for that player, read by the sync, never guessed. */
async function csLoadCfb(){
  if(CS.cfb || CS.cfbBusy || Date.now()-CS.cfbTried < 300000) return;
  CS.cfbBusy = true; CS.cfbTried = Date.now();
  try{

}
const csHex = h => /^[0-9a-f]{6}$/i.test(String(h||"")) ? "#"+h : null;

// ESPN's dark-background marks, by team id (digits only: this is database text going into a URL)

/* What a line says, in words. `point` is passed separately because a ticket
   shows the spread or total it was PLACED at, which the line may have moved off. */
function csSel(l, point = l.point){
  const ou = l.side==="over" ? "Over" : "Under";
  if(l.sport==="future"){
    const who = l.event.startsWith("fut:wcxc:") ? pkName(l.team) : (CS_NFL_NAME[csTeamKey(l.label)] || l.label);
    if(l.market==="title") return `${who} to win the title`;
    if(l.market==="div") return `${who} to win ${l.event_label}`;
    if(l.market==="sb") return `${who} to win ${l.event_label}`;
    return `${who} to ${l.side==="yes" ? "make" : "miss"} the playoffs`;
  }
  if(l.sport==="prop" || l.sport==="cprop"){
    if(CS_TD[l.market]) return `${l.label} ${CS_TD[l.market]}`;
    const ms = String(l.id).match(/:ms(\d+)$/);                // a milestone: "50+ receiving yards"
    if(ms) return `${l.label} ${ms[1]}+ ${(CS_PROP[l.market]||l.market).toLowerCase()}`;
    return `${l.label} ${ou.toLowerCase()} ${Number(point)} ${(CS_PROP[l.market]||l.market).toLowerCase()}`;
  }
  if(l.market==="total") return `${ou} ${Number(point)}`;

/* ---- the rules, mirrored from place_bet. Keep in step with supabase-setup.sql. ---- */
/* Your own team in a WCXC future. "Miss the playoffs" on yourself is betting
   against it, like an opponent's moneyline. In a race with one winner (the title,
   a division) backing anybody else is betting your team won't win it, so while
   your team is still on the board in that market it's the only one you can back;
   once it drops off (out of the running) the rest open up. `board` is every
   line on offer, which is how the page knows whether your team is still listed. */
function csFutAgainst(l, voter, board){
  if(l.sport!=="future" || !String(l.event).startsWith("fut:wcxc:")) return false;
  if(l.market==="po") return l.team===voter && l.side==="no";
  if(l.market==="title" || l.market==="div")
    return l.team!==voter && (board||[]).some(x=>x.event===l.event && x.team===voter && x.status==="open");

function csCheck(legs, stake, voter, rules, mode, now = Date.now(), price = null, board = CS.lines){
