   </div>

   <section class="panel" style="margin-top:16px"><h2>Every team, all time</h2><div class="scroll"><table class="matrix">
     <thead><tr><th>Team</th>${p.weeks.map(w=>`<th class="num" style="text-align:center">Wk ${w}</th>`).join("")}<th class="num">Avg</th></tr></thead>
     <tbody>${p.teams.map(x=>`<tr>
       <td><div class="teamcell">${img(x.t.id)}<div class="nm"><b>${esc(x.t.name)}</b></div></div></td>
       ${p.weeks.map(w=>{const d=x.byWeek[w];
         if(d==null) return `<td class="num">–</td>`;
         const c = d>0?"var(--good)":d<0?"var(--bad)":"var(--muted)";
         return `<td class="num" style="color:${c};font-weight:${d?600:400}">${d>0?"+":""}${d}</td>`}).join("")}
       <td class="num"><b>${sign(x.avg)}</b></td></tr>`).join("")}
     </tbody></table></div></section>
   <p class="hint" style="margin-top:10px">Positive means this voter ranked that team <b style="color:var(--good)">higher</b> (better) than the final poll had them; negative means <b style="color:var(--bad)">lower</b>.</p>

   <section class="panel" style="margin-top:16px"><h2>Week by week</h2><div class="scroll"><table class="cards">
     <thead><tr><th>Week</th><th>Their #1</th><th>Own team</th><th class="num">Gap</th><th>Full ballot</th></tr></thead>
     <tbody>${p.perWeek.slice().reverse().map(x=>`<tr>
       <td class="bigrk">${x.w}</td>
       <td class="stat" data-l="Their #1">${esc(T[x.order[0]]?.name||"")}</td>
       <td class="stat" data-l="Own team">#${x.own} <span class="pill ${x.homer>0?"dn":x.homer<0?"up":""}">${x.homer>0?`${x.homer} above`:x.homer<0?`${-x.homer} below`:"matches"}</span></td>
       <td class="num stat" data-l="Gap"><b>${x.gap.toFixed(2)}</b></td>
       <td class="stat" data-l="Ballot"><span class="hint">${x.order.map(id=>esc(shortName(T[id]?.name||"?"))).join(" › ")}</span></td></tr>`).join("")}
     </tbody></table></div></section>`;
}

function renderVoters(){
  if(S.profile) return renderProfile(S.profile);
  const gaps=voterGaps(S.week);
  if(!gaps.length){main.innerHTML=banner()+header("Voter report")+emptyState();return}
  const season={};
  weeksWithBallots().forEach(w=>voterGaps(w).forEach(g=>(season[g.v]=season[g.v]||[]).push(g.avg)));
  const fmt=at=>at?esc(new Date(at).toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})):"–";
  main.innerHTML = banner()+header("Voter report","How each ballot lines up with the consensus. Gap is the average number of spots a voter differs from the final poll.")+
  `<section class="panel"><h2>Week ${S.week} ballots · ${gaps.length} in</h2><div class="scroll"><table class="cards norank">
   <thead><tr><th>Voter</th><th>Their #1</th><th>Own team</th><th>Biggest outlier</th><th class="num">Gap</th><th class="num">Season</th><th>Submitted</th></tr></thead>
   <tbody>${gaps.map(g=>{
     const sa=season[g.v], sm=sa&&sa.length?sa.reduce((a,b)=>a+b,0)/sa.length:null;
     return `<tr class="clickrow" data-profile="${g.v}" tabindex="0" role="button" aria-label="Open ${esc(T[g.v]?.owner||"")}'s voter report">
      <td><div class="teamcell">${img(g.v)}<div class="nm"><b>${esc(T[g.v]?.owner||"")}</b><i>${esc(T[g.v]?.name||"")}</i></div></div></td>
      <td class="stat" data-l="Their #1">${esc(T[g.top]?.name||"")}</td>
      <td class="stat" data-l="Own team">#${g.own} <span class="pill ${g.homer>0?"dn":g.homer<0?"up":""}">${g.homer>0?`${g.homer} above`:g.homer<0?`${-g.homer} below`:"matches"}</span></td>
      <td class="stat" data-l="Outlier">${esc(T[g.worst.id]?.name||"")} <span class="hint">#${g.worst.mine} vs #${g.worst.cons}</span></td>
      <td class="num stat" data-l="Gap"><b>${g.avg.toFixed(2)}</b></td>
      <td class="num stat" data-l="Season">${sm!==null?sm.toFixed(2):"–"}</td>
      <td class="stat hide-m" data-l="Submitted">${fmt(g.at)}</td></tr>`}).join("")}
   </tbody></table></div></section>${waitingOn(gaps.map(g=>({voter:g.v})))}
   <p class="hint">Tap any voter for their full report — who they're high on, who they're low on, and every ballot they've cast. Sorted closest-to-consensus first. <b>Own team</b> compares where a voter put themselves against where the league put them — <b style="color:var(--bad)">above</b> means they rate themselves higher than the league does, <b style="color:var(--good)">below</b> means more modestly.</p>`;
}

function updateWeekChrome(){
  const f=document.getElementById("wkflag"); if(!f) return;
  const open=votingOpen(), flip=humanMins(minsToFlip()), nw=ballotWeek();
  f.textContent = open ? `Voting closes in ${flip}` : "Results only";
  f.className = "wkflag"+(open?" open":"");
  f.title = open
    ? `Week ${S.week} ballots are open until Thursday 8:00 PM ET.`
    : windowOpen()
      ? `Ballots are open for Week ${nw}, not Week ${S.week}.`
      : `Week ${nw} ballots open Tuesday 12:00 AM ET — in ${flip}.`;
}

// Only weeks that have actually happened, plus whichever week is being voted on.
// Nothing further ahead: an empty Week 12 in September is just noise.
function latestWeek(){
  const voted = S.ballots.length ? Math.max(...S.ballots.map(b=>b.week)) : 0;
  return Math.min(18, Math.max(1, CURRENT_WEEK, ballotWeek(), voted));
}
function buildWeekOptions(){
  const sel=document.getElementById("week"); if(!sel) return;
  const keep=+sel.value||S.week, max=latestWeek(), nw=ballotWeek();
  sel.innerHTML="";
  for(let i=1;i<=max;i++){
    const o=document.createElement("option"); o.value=i;
    o.textContent = i===nw ? `Week ${i} · voting` : `Week ${i}`;
    sel.appendChild(o);
  }
  sel.value = Math.min(keep, max);
}

// The window opens and closes on a clock, so the page has to notice on its own
// rather than waiting for a reload.
let lastOpen=null, lastWeek=null;
function tick(){
  const w=pollWeekFor(), open=windowOpen();
  const rolled = w!==lastWeek, flipped = open!==lastOpen;
  if(rolled){
    const wasOnCurrent = S.week===lastWeek;
    CURRENT_WEEK=w; lastWeek=w;
    if(wasOnCurrent || lastOpen===null){ S.week=w; const sel=document.getElementById("week"); if(sel) sel.value=w; S.ranked=[]; preloadOwn(); }
    buildWeekOptions();
  }
  lastOpen=open;
  if(rolled||flipped) render(); else updateWeekChrome();
}

const pct = p => p>=.995 ? ">99%" : p<=.005 && p>0 ? "<1%" : p===0 ? "—" : (p*100).toFixed(0)+"%";
const oddsBar = p => `<span class="obar"><i style="width:${Math.max(0,Math.min(100,p*100)).toFixed(1)}%"></i></span>`;

function renderOdds(){
  if(!SCHED){
    main.innerHTML = banner()+header("Playoff odds","Simulating the rest of the season from the real remaining schedule.")+
      `<section class="panel"><div class="closed"><p class="big">Loading the schedule…</p>
      <p class="hint" style="margin:0">Pulling every remaining matchup from Sleeper.</p></div></section>`;
    if(!oddsRunning){
      oddsRunning=true;
      loadSchedule().then(()=>{ ODDS=simulate(); oddsRunning=false; if(S.tab==="odds") renderOdds(); })
        .catch(()=>{ oddsRunning=false; SCHED={games:[],scores:{}}; ODDS=null; if(S.tab==="odds") renderOdds(); });
    }
    return;
  }
  if(!ODDS){
    main.innerHTML = banner()+header("Playoff odds")+
      `<section class="panel"><div class="closed"><p class="big">Couldn't load the schedule</p>
      <p class="hint" style="margin:0">Sleeper didn't answer. Refresh to try again.</p></div></section>`;
    return;
  }
  const {rows,sims,sd,perWeek,weeksLeft,gamesLeft,totalGames}=ODDS;
  const divNames = Object.keys(DIVISIONS).length ? DIVISIONS : null;
  const byDiv = {};
  TEAMS.forEach(t=>{ (byDiv[t.div]=byDiv[t.div]||[]).push(t) });

  main.innerHTML = banner()+header("Playoff odds",
    `${sims.toLocaleString()} simulations of the last ${weeksLeft} week${weeksLeft===1?"":"s"} — ${gamesLeft} results per team${perWeek>1?", since every week counts head-to-head and the league median":""}.`)+
  `<section class="panel"><h2>Odds through Week ${LAST_REG_WEEK}</h2><div class="scroll"><table class="cards norank">
    <thead><tr><th>Team</th><th>Div</th><th class="num">Proj record</th><th class="num">Make playoffs</th><th class="num">Win div</th><th class="num">Bye</th><th class="num">Final</th><th class="num">Title</th></tr></thead>
    <tbody>${rows.map(r=>`<tr>
      <td><div class="teamcell">${img(r.t.id)}<div class="nm"><b>${esc(r.t.name)}</b><i>${esc(r.t.owner)} · ${rec(r.t)}</i></div></div></td>
      <td class="stat" data-l="Division">${esc(divNames?divNames[r.t.div]||("Div "+r.t.div):("Div "+r.t.div))}</td>
      <td class="num stat" data-l="Proj record">${r.projW.toFixed(1)}–${(totalGames-r.projW).toFixed(1)}</td>
      <td class="num stat" data-l="Playoffs"><b>${pct(r.po)}</b> ${oddsBar(r.po)}</td>
      <td class="num stat" data-l="Win div">${pct(r.div)}</td>
      <td class="num stat" data-l="Bye">${pct(r.bye)}</td>
      <td class="num stat" data-l="Final">${pct(r.final)}</td>
      <td class="num stat" data-l="Title"><b>${pct(r.title)}</b></td></tr>`).join("")}
    </tbody></table></div></section>

   <section class="panel" style="margin-top:16px"><h2>Divisions</h2><div class="pad" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px">
     ${Object.keys(byDiv).sort().map(d=>`<div><p class="kicker" style="margin-bottom:6px">${esc(divNames?divNames[d]||("Division "+d):("Division "+d))}</p>
       ${byDiv[d].slice().sort((a,b)=>b.w-a.w||b.pf-a.pf).map(t=>`<div class="roballot" style="padding:6px 0;border:0">${img(t.id)}<span class="nm"><b>${esc(t.name)}</b><i>${rec(t)} · ${t.pf.toFixed(1)}</i></span></div>`).join("")}
     </div>`).join("")}
   </div></section>

   <section class="panel" style="margin-top:16px"><h2>How this works</h2><div class="pad">
     <p style="margin:0 0 9px">Every remaining week on the real Sleeper schedule is simulated ${sims.toLocaleString()} times. A team's weekly score is drawn from a normal distribution around its scoring average, shrunk toward the league average so a short sample doesn't crown anyone, with a shared spread of <b>±${sd.toFixed(1)}</b> points.</p>
     ${perWeek>1?`<p style="margin:0 0 9px"><b>Two results a week.</b> This league has Sleeper's league-median match switched on, so each week you play your head-to-head opponent <i>and</i> the league median — ${totalGames} results across the regular season, not ${LAST_REG_WEEK}. Both are simulated. Records and points shown are Sleeper's, which stay final through the last completed week.</p>`:""}
     <p style="margin:0 0 9px"><b>Format.</b> All ${Object.keys(byDiv).length} division winners qualify, plus the next ${Math.max(0,PLAYOFF_TEAMS-Object.keys(byDiv).length)} best teams by record, then points for. The top 2 division winners get first-round byes; the other ${PLAYOFF_TEAMS-2} are seeded 3–${PLAYOFF_TEAMS} on record then points for. The bracket reseeds each round, so the top remaining seed always draws the weakest survivor.</p>
     <p class="hint" style="margin:0">Odds shift as results come in — this is a projection, not a promise. Ties are broken by points for throughout.</p>
   </div></section>`;
}

function render(){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  updateWeekChrome();
  ({vote:renderVote,poll:renderPoll,grid:renderGrid,dist:renderDist,season:renderSeason,
    voters:renderVoters,odds:renderOdds,analysis:renderAnalysis})[S.tab]();
}

/* ---------- events ---------- */
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
  S.tab=b.dataset.tab; store.set("wcxc.tab",S.tab); S.hover=null; S.msg=null; S.profile=null;
  if(S.tab==="vote" && !S.ranked.length) preloadOwn();
  render();
}));
const wk=document.getElementById("week");
wk.addEventListener("change",()=>{S.week=+wk.value; S.lock=null; S.msg=null; preloadOwn(); render()});

async function submit(){
  if(!votingOpen()){renderVote();return}   // week changed under them
  const pwEl=document.getElementById("pw"), pw=(pwEl?.value||"").trim();
  if(pw.length<4){S.msg={err:true,text:"Enter your team's password (at least 4 characters)."};renderVote();document.getElementById("pw")?.focus();return}
  S.saving=true; S.msg=null; renderVote();
  const {data,error} = await sb.rpc("submit_ballot",{p_season:SEASON,p_week:S.week,p_voter:S.voter,p_ranking:S.ranked,p_password:pw});
  S.saving=false;
  if(error){ S.msg={err:true,text:(error.message||"Couldn't submit. Try again.").replace(/^.*?:\s*(?=[A-Z])/,"")} }
  else{
    store.set("wcxc.pw."+S.voter,pw);
    S.pwDraft=null;
    S.msg={err:false,text:data==="created"?"Ballot submitted. Your team's password is set, so use it again next week.":"Ballot submitted."};
    await loadBallots(); return;
  }
  renderVote();
}

main.addEventListener("click",e=>{
  const prow=e.target.closest("[data-profile]");
  if(prow && !e.target.closest("button")){
    S.profile=+prow.dataset.profile; S.tab="voters"; store.set("wcxc.tab","voters");
    render(); window.scrollTo({top:0,behavior:"smooth"}); return;
  }
  const el=e.target.closest("button,[data-team]"); if(!el) return;
  const d=el.dataset;
  if(el.id==="backvoters"){S.profile=null; render(); return}
  if(d.go){S.tab=d.go; store.set("wcxc.tab",S.tab); S.profile=null; if(S.tab==="vote"&&!S.ranked.length) preloadOwn(); render(); return}
  if(d.voter){S.voter=+d.voter; store.set("wcxc.voter",S.voter); S.msg=null; S.pwDraft=null; preloadOwn(); renderVote(); return}
  if(d.add){S.ranked.push(+d.add); S.msg=null; renderVote(); return}
  if(d.rm!==undefined){S.ranked.splice(+d.rm,1); renderVote(); return}
  if(d.up!==undefined){const i=+d.up; [S.ranked[i-1],S.ranked[i]]=[S.ranked[i],S.ranked[i-1]]; renderVote(); return}
  if(d.dn!==undefined){const i=+d.dn; [S.ranked[i+1],S.ranked[i]]=[S.ranked[i],S.ranked[i+1]]; renderVote(); return}
  if(d.fill==="last"){const b=S.ballots.find(x=>x.week===S.week-1&&x.voter===S.voter); if(b){S.ranked=[...b.order]; S.msg=null} renderVote(); return}
  if(d.fill==="record"){TEAMS.filter(t=>!S.ranked.includes(t.id)).sort((a,b)=>b.w-a.w||b.pf-a.pf).forEach(t=>S.ranked.push(t.id)); S.msg=null; renderVote(); return}
  if(el.id==="gonow"){S.week=CURRENT_WEEK; wk.value=S.week; S.lock=null; S.msg=null; preloadOwn(); render(); return}
  if(el.id==="reset"){S.ranked=[]; S.msg=null; renderVote(); return}
  if(el.id==="submit"){submit(); return}
  if(el.id==="forgetpw"){if(S.voter) store.del("wcxc.pw."+S.voter); S.pwDraft=""; renderVote(); return}
  if(el.id==="copypoll"){copyPoll(el); return}
  if(d.team){const id=+d.team; S.lock=S.lock===id?null:id; applyHighlight(); return}
});

function copyPoll(btn){
  const {bs,rows}=tally(S.week);
  const txt=`WCXC Power Poll — Week ${S.week} (${bs.length} ballot${bs.length>1?"s":""})\n`+
    rows.map((r,i)=>`${i+1}. ${r.t.name}${r.fp?` (${r.fp})`:""} — ${r.pts} pts`).join("\n");
  const done=()=>{btn.textContent="Copied"; setTimeout(()=>{btn.textContent="Copy results"},1500)};
  const legacy=()=>{
    const ta=document.createElement("textarea");
    ta.value=txt; ta.style.cssText="position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta); ta.select();
    try{document.execCommand("copy"); done()}catch(_){ btn.textContent="Copy failed" }
    ta.remove();
  };
  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(txt).then(done,legacy); else legacy();
}

/* drag to reorder the ballot (desktop); arrows do the same job on touch */
let dragFrom=null;
const clearDrag=()=>document.querySelectorAll(".slot.over,.slot.dragging").forEach(x=>x.classList.remove("over","dragging"));
main.addEventListener("dragstart",e=>{
  const s=e.target.closest(".slot[draggable]"); if(!s) return;
  dragFrom=+s.dataset.i; s.classList.add("dragging");
  e.dataTransfer.effectAllowed="move";
  try{e.dataTransfer.setData("text/plain",String(dragFrom))}catch(_){}
});
main.addEventListener("dragover",e=>{
  if(dragFrom===null) return;
  const s=e.target.closest(".slot[draggable]"); if(!s) return;
  e.preventDefault(); e.dataTransfer.dropEffect="move";
  document.querySelectorAll(".slot.over").forEach(x=>x.classList.remove("over"));
  if(+s.dataset.i!==dragFrom) s.classList.add("over");
});
main.addEventListener("drop",e=>{
  if(dragFrom===null) return;
  const s=e.target.closest(".slot[draggable]"); if(!s) return;
  e.preventDefault();
  const to=+s.dataset.i;
  if(to!==dragFrom){const [m]=S.ranked.splice(dragFrom,1); S.ranked.splice(to,0,m); S.msg=null}
  dragFrom=null; clearDrag(); renderVote();
});
main.addEventListener("dragend",()=>{dragFrom=null; clearDrag()});
main.addEventListener("input",e=>{ if(e.target.id==="pw") S.pwDraft=e.target.value; });
main.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="aMetric"||id==="aScope"||id==="aView"){
    S[id]=e.target.value; store.set("wcxc."+id, S[id]);
    // efficiency is only a season-level number; don't strand the user on it
    if(S.aScope!=="season" && S.aMetric==="eff"){ S.aMetric="record"; store.set("wcxc.aMetric","record") }
    S.lock=null; S.hover=null;
    renderAnalysis();
  }
});
main.addEventListener("keydown",e=>{
  if(e.target.id==="pw"&&e.key==="Enter"){e.preventDefault(); document.getElementById("submit")?.click(); return}
  const p=e.target.closest("[data-profile]");
  if(p&&(e.key==="Enter"||e.key===" ")){e.preventDefault(); p.click(); return}
  const c=e.target.closest("[data-team]"); if(c&&(e.key==="Enter"||e.key===" ")){e.preventDefault(); c.click()}
});
main.addEventListener("mouseover",e=>{const c=e.target.closest("[data-team]"); const id=c?+c.dataset.team:null; if(id!==S.hover){S.hover=id; if(!S.lock) applyHighlight()}});
main.addEventListener("mouseleave",()=>{S.hover=null; if(!S.lock) applyHighlight()});

/* ---------- start ---------- */
(async function init(){
  S.week = CURRENT_WEEK; render();
  await loadSleeper();
  S.week = CURRENT_WEEK;
  buildWeekOptions();
  wk.value = S.week;
  lastWeek = CURRENT_WEEK; lastOpen = windowOpen();
  updateWeekChrome();
  setInterval(tick, 30000);   // notice the Tue open / Thu close without a reload
  if(configured && window.supabase){
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    await loadBallots(); subscribe();
  } else { render(); }
})();
</script>
</body>
</html>
