  const parlay = mode==="parlay" && legs.length>1;
  const cap = rules.parlay_max_legs;                 // null: no limit on legs
  if(parlay && (legs.length<rules.parlay_min_legs || (cap!=null && legs.length>cap)))
    errs.push(cap!=null ? `Parlays take ${rules.parlay_min_legs} to ${cap} legs.` : `Parlays take at least ${rules.parlay_min_legs} legs.`);
  if(parlay) errs.push(...csSameGame(legs, rules));
  // a season-long bet settles months after anything it could be parlayed with
  if(parlay && legs.some(l=>l.sport==="future")) errs.push("Futures are single bets. Switch to Singles to place them alongside other bets.");
  for(const l of legs){
    const name = l.sport==="prop" || l.sport==="cprop" ? l.label : csEvent(l) || "That game";
    if(l.status!=="open") errs.push(`${name} is suspended right now.`);
    if(l.price<(rules.leg_min_price ?? 0)) errs.push(`${csSel(l)} is too short a price to bet.`);   // null: no floor
    if(l.price>(rules.leg_max_price ?? Infinity)) errs.push(`${csSel(l)} is too long a price to bet.`);
    if(l.state==="pre" && now>=Date.parse(l.commence_at)) errs.push(l.sport==="future" ? `${name} is closed for betting right now.` : `${name} has already kicked off.`);
    if(l.state==="in" && (!rules.live_enabled || l.sport!=="nfl")) errs.push(`${name} is closed for betting.`);
    if(l.state==="post") errs.push(`${name} is over.`);
    if(rules.block_self_bets && l.sport==="fantasy" && voter && (l.teams||[]).includes(voter)
       && ((l.market!=="total" && l.team!==voter) || (l.market==="total" && l.side==="under")))
      errs.push("You can back your own team, but you can't bet against it.");
    if(rules.block_self_bets && voter && csFutAgainst(l, voter, board))
      errs.push(l.market==="po" ? "You can back your own team, but you can't bet against it."
        : "Your team is still in that race, so the only team you can back in it is your own.");
  }
  const s = Number(stake);
  if(!(s>0)) return errs.concat("Enter a stake.");
  if(Math.round(s*100)!==s*100) errs.push("Stake must be in dollars and cents.");
  if(s<rules.min_stake) errs.push(`Minimum stake is $${rules.min_stake}.`);
  const max = (parlay ? rules.max_stake_parlay : rules.max_stake_straight) ?? Infinity;   // null: no ceiling
  if(s>max) errs.push(`Maximum ${parlay?"parlay":"straight"} stake is $${max}.`);
  // the ticket's real price when it is known (same-game groups), else the legs multiplied
  const p = price ?? (parlay ? csParlay(legs.map(l=>l.price), rules.parlay_max_price ?? Infinity) : Math.max(...legs.map(l=>l.price)));
  const top = rules.max_payout ?? Infinity;
  if(Math.round(s*p*100)/100>top)
    errs.push(`A ticket can pay at most $${top}, so the most you can stake at these odds is $${Math.floor(top/p*100)/100}.`);
  return errs;
}
function csParlay(prices, cap = Infinity){
  return Math.min(Math.round(prices.reduce((a,b)=>a*b,1)*10000)/10000, cap);
}
// Same-game groups a parlay may hold: NFL games only, pregame, sgp_max_legs at most.
function csSameGame(legs, rules){
  const by = new Map(), errs = [];
  for(const l of legs){ if(!by.has(l.event)) by.set(l.event, []); by.get(l.event).push(l); }
  for(const g of by.values()){
    if(g.length<2) continue;
    if(g.some(l=>l.sport==="fantasy")) errs.push("Only one leg per WCXC matchup.");
    else if(g.some(l=>l.sport==="cfb" || l.sport==="cprop")) errs.push("Same-game parlays are NFL only.");
    else if(g.some(l=>l.state==="in")) errs.push("Same-game parlays are pregame only.");
    else if(g.some(l=>CS_TD_ORDER[l.market])) errs.push("First and last touchdown scorer bets can't go in a same-game parlay.");
    else if(rules.sgp_max_legs!=null && g.length>rules.sgp_max_legs) errs.push(`A same-game parlay takes at most ${rules.sgp_max_legs} legs.`);
  }
  return errs;
}
/* A same-game group's price: how often every leg won together across the
   game's simulated outcomes (each line's sim is one bit per simulated game),
   less sgp_hold, and never more than the legs multiplied. CS.sims[id] is
   undefined while loading and null for a line with no simulation. */
const CS_POP = Uint8Array.from({length:256}, (_, i) => { let c = 0; for(let x = i; x; x >>= 1) c += x & 1; return c });
function csHits(sims){
  let hits = 0;
  for(let i=0;i<sims[0].length;i++){ let b = 255; for(const s of sims) b &= s[i]; hits += CS_POP[b]; }
  return hits;
}
function csSgp(g, rules){
  const bad = csSameGame(g, rules);
  if(bad.length) return {err:bad[0]};
  const sims = g.map(l=>CS.sims[l.id]);
  if(sims.some(s=>s===undefined)) return {pending:true};
  if(sims.some(s=>!s)) return {err:"That game isn't priced for same-game parlays yet."};
  const n = sims[0].length*8, hits = csHits(sims);
  if(!hits) return {err:"Those legs can't all win together."};
  if(hits<Number(rules.sgp_min_hits)) return {err:"That same-game combination is too unlikely to price."};
  const naive = Math.round(g.reduce((a,l)=>a*l.price,1)*10000)/10000;
  const price = Math.min(naive, Math.round((1-Number(rules.sgp_hold))*n/hits*10000)/10000);
  if(price<=1.01) return {err:"That same-game combination is too likely to price."};
  return {price, hits, n};
}
function csTicketPrice(legs, rules){
  const groups = new Map(), sgp = [];
  for(const l of legs){ if(!groups.has(l.event)) groups.set(l.event, []); groups.get(l.event).push(l); }
  let price = 1;
  for(const g of groups.values()){
    if(g.length===1){ price *= g[0].price; continue }
    const r = csSgp(g, rules);
    if(r.err || r.pending) return r;
    sgp.push({event:g[0].event, label:csEvent(g[0]), legs:g.length, price:r.price});
    price *= r.price;
  }
  const raw = Math.round(price*10000)/10000;
  return {price:Math.min(raw, rules.parlay_max_price ?? Infinity), raw, sgp};
}
// PostgREST sends bytea as "\x" followed by hex.
const csSimBytes = hex => { const h = String(hex).replace(/^\\x/, ""), out = new Uint8Array(h.length>>1);
  for(let i=0;i<out.length;i++) out[i] = parseInt(h.substr(i*2, 2), 16); return out };
/* ---- end of the mirrored rules ---- */

const csRules = () => { const r = CS.rules || {}; const n = k => Number(r[k]), nn = k => r[k]==null ? null : Number(r[k]);
  // ceilings stay null when unset: null means none, and Number(null) would read as 0
  return {...r, min_stake:n("min_stake"), max_stake_straight:nn("max_stake_straight"), max_stake_parlay:nn("max_stake_parlay"),
    max_payout:nn("max_payout"), max_open:nn("max_open"), parlay_min_legs:n("parlay_min_legs"), parlay_max_legs:nn("parlay_max_legs"), block_self_bets:!!r.block_self_bets,
    parlay_max_price:nn("parlay_max_price"), leg_min_price:nn("leg_min_price"), leg_max_price:nn("leg_max_price"),
    reward_ballot:n("reward_ballot"),
    sgp_hold:n("sgp_hold"), sgp_max_legs:nn("sgp_max_legs"), sgp_min_hits:n("sgp_min_hits")}; };

// Slip legs that sit in a same-game group, so their simulations are needed to price it.
function csSimIds(){
  const legs = csLegs(), count = {};
  for(const l of legs) count[l.event] = (count[l.event]||0) + 1;
  return legs.filter(l=>count[l.event]>1 && l.sport!=="fantasy").map(l=>l.id);
}
async function csLoadSims(ids){
  if(!ids.length || !sb) return;
  const {data,error} = await sb.from("casino_lines").select("id,sim").in("id", ids);
  if(error) return;
  for(const row of data||[]) CS.sims[row.id] = row.sim ? csSimBytes(row.sim) : null;
}

async function loadCasino(){
  if(!sb || !configured) return;
  /* A read asked for while another is under way (a score landing mid-poll) is
     not dropped: the data the running one fetched may already be a second old,
     so it reads once more when it finishes. */
  if(CS.loading){ CS.again = true; return }
  CS.loading = true;
  csLoadRoster();                                 // jersey digits; the board does not wait for them
  /* College reads on its own: a Saturday's sixty-odd games are three or four
     hundred lines, and one request stops at a thousand rows. */
  const linesQ = sports => sb.from("casino_lines").select(csCols).in("sport",sports).neq("status","closed").order("commence_at").limit(1000);
  try{
    let [rules, lines, cfbLines, banks, games, bets, wins] = await Promise.all([
      sb.from("casino_rules").select("*").eq("id",1).maybeSingle(),
      linesQ(["nfl","fantasy","future"]), linesQ(["cfb"]),
      sb.from("casino_bankrolls").select("*"),
      /* Newest first. Ascending, the 200-row cap kept the OLDEST rows: at about
         twenty rows a week the current week's scoreboards would have dropped
         off the end around Week 14, and every ticket box with them. */
      sb.from("casino_games").select(CS_GAME).order("commence_at",{ascending:false}).limit(200),
      sb.from("bets").select("id,voter,kind,stake,price,status,payout,note,placed_at,accepted_at,settled_at,bet_legs(line_id,price,point,result,event,group_price)")
        .order("placed_at",{ascending:false}).limit(150),
      // "Biggest win" is a season record, so it reads every won bet, not the latest 150
      sb.from("bets").select("voter,stake,payout").eq("status","won").limit(1000)
    ]);
    /* Read again without the newest column if that is what it tripped on. The
       bars are worth losing; the tab is not. */
    const lineErr = lines.error || cfbLines.error;
    if(lineErr && csCols===CS_LINE && csNoColumn(lineErr)){
      csCols = CS_BASE;
      [lines, cfbLines] = await Promise.all([linesQ(["nfl","fantasy","future"]), linesQ(["cfb"])]);
    }
    /* The scoreboard is new; an older database has no casino_games table yet,
       and a casino without live boxes is still a working casino. */
    const bad = [rules,lines,cfbLines,banks,bets].find(x=>x.error);
    if(bad) throw bad.error;
    /* The line index is rebuilt from scratch every time. Kept across loads, a
       line that had since closed would linger as "open" and the slip would
       offer a bet the database is certain to refuse. */
    const fresh = {}, add = rows => { for(const r of rows||[]) fresh[r.id] = csNum(r) };
    const board = (lines.data||[]).concat(cfbLines.data||[]);
    add(board);
    const props = {};
    for(const ev in CS.propsOpen) if(CS.propsOpen[ev]){
      const {data} = await csPropsQuery(ev);
      if(data){ props[ev] = data.map(csNum); add(data) }
    }
    // tickets name their legs and the slip names its picks, whether or not those lines are still on the board
    const need = [...new Set([...(bets.data||[]).flatMap(b=>b.bet_legs.map(g=>g.line_id)), ...CS.slip])]
      .filter(id=>!fresh[id]);
    for(let i=0;i<need.length;i+=100){
      const {data} = await sb.from("casino_lines").select(csCols).in("id",need.slice(i,i+100));
      add(data);
    }
    CS.rules = rules.data; CS.lines = board.map(csNum); CS.byId = fresh; CS.props = props;
    CS.banks = banks.data||[]; CS.bets = bets.data||[];
    CS.games = Object.fromEntries((games.error?[]:games.data||[]).map(g=>[g.event,g]));
    if(!wins.error) CS.wins = wins.data||[];
    await csLoadSims(csSimIds());          // fresh each load: a group's price follows its game's lines
    // college names and colours, wherever a college line is on the board or a ticket
    if(CS.sport==="cfb" || Object.values(fresh).some(l=>l.sport==="cfb" || l.sport==="cprop")) csLoadCfb();
    CS.err = null;
  }catch(e){
    // run the setup script, or wait for a reload: say which, because they differ
    CS.err = csNoTable(e) || /casino_|bankrolls|relation/i.test(csMsg(e))
      ? "The casino isn't switched on yet: its tables haven't been created in Supabase."
      : csNoColumn(e)
      ? "Supabase hasn't caught up with the casino's newest column yet. This clears on its own, or with a project restart."
      : "Couldn't reach the casino. This retries on its own every half minute.";
  }finally{
    CS.loading = false; CS.loaded = true;
  }
  const sig = JSON.stringify([CS.err, CS.lines.map(l=>l.id+l.price+l.point+l.status), CS.banks, CS.bets.map(b=>b.id+b.status+b.bet_legs.map(g=>g.result).join()),
    Object.keys(CS.props).map(k=>k+(CS.props[k]||[]).map(l=>l.price+l.status).join()),
    // a score moving redraws the tickets, which is the point of the live box: the clock, the ball,
    // the down and distance and every quarter's points, not only the totals
    Object.values(CS.games).map(g=>[g.event,g.state,g.detail,g.situation,g.possession,g.away_score,g.home_score,
      (g.away_periods||[]).join(),(g.home_periods||[]).join()].join("|")),
    Object.values(CS.byId).map(l=>l.id+l.live)]);
  // The signature only advances when the page actually redraws, so data that
  // lands while someone is typing a stake still gets drawn on the next pass.
  if(sig!==CS.sig && S.tab==="casino" && !busyComposing()){ CS.sig = sig; renderCasino(); }
  else csTickFresh();                             // nothing to redraw, but "updated just now" still moves
  if(CS.again){ CS.again = false; setTimeout(loadCasino, 300) }
}

/* ---- is the sync still running? ----
   casino_rules.synced_at is stamped at the end of every sync run. Showing its
   age is what lets a person tell "no score yet" from "the scoreboard has stopped":
   a cron that quietly died would otherwise leave stale numbers looking live. */
const csLiveNow = () => Object.values(CS.games).some(g=>(g.sport==="nfl" || g.sport==="cfb") && g.state==="in");
function csFreshInfo(now = Date.now()){
  const at = CS.rules?.synced_at ? Date.parse(CS.rules.synced_at) : NaN;
  if(!Number.isFinite(at)) return null;
  const min = Math.max(0, now-at)/60000, live = csLiveNow() ? "Live · " : "";
  if(min<2) return {txt:`${live}Updated just now`, stale:false};
  if(min<5) return {txt:`${live}Updated ${Math.floor(min)} min ago`, stale:false};
  return {txt:`Scores may be behind · last update ${min<90 ? Math.floor(min)+" min" : Math.floor(min/60)+" h"} ago`, stale:true};
}
const csFresh = () => { const f = csFreshInfo();
  return f ? `<span class="csfresh${f.stale?" stale":""}" id="csfresh" title="Odds, scores and results are refreshed about once a minute"><i></i><span>${esc(f.txt)}</span></span>` : "" };
function csTickFresh(){
  const el = document.getElementById("csfresh"), f = csFreshInfo();
  if(!el || !f) return;
  el.classList.toggle("stale", f.stale);
  el.lastElementChild.textContent = f.txt;
}

/* Jersey numbers come from positions.json, which the daily build reads off ESPN's
   rosters. They are only the digits: a jersey is drawn in the right colours
   without them, so a failed fetch costs a number and nothing else, and is tried
   again after five minutes. */
async function csLoadRoster(){
  if(CS.roster || CS.rosterBusy || Date.now()-CS.rosterTried < 300000) return;
  CS.rosterBusy = true; CS.rosterTried = Date.now();
  try{
    const r = await fetch("positions.json");
    if(!r.ok) throw new Error("positions.json "+r.status);
    const j = await r.json();
    CS.roster = {positions:j.positions||{}, numbers:j.numbers||{}};
    if(S.tab==="casino" && !busyComposing()) renderCasino();
  }catch(e){ /* digits are optional */ }
  finally{ CS.rosterBusy = false }
}
// only lines you can bet: a replaced or pulled prop has no business in the drawer
const csPropsQuery = ev => sb.from("casino_lines").select(csCols).eq("event",ev).in("sport",["prop","cprop"])
  .eq("status","open").order("label").order("market").limit(1000);
async function loadProps(ev){
  const {data,error} = await csPropsQuery(ev);
  if(error) return;
  CS.props[ev] = (data||[]).map(csNum); csIndex(CS.props[ev]);

}

const csLegs = () => CS.slip.map(id=>CS.byId[id]).filter(Boolean);
const csBank = v => CS.banks.find(b=>b.voter===v) || {balance:0, earned:0, at_risk:0, staked:0, returned:0, won:0, lost:0, pushed:0};

/* One price button. Disabled when the line is suspended, kicked off, or would

function csOdd(l, top){

  const fade = r.block_self_bets && l.sport==="fantasy" && v && (l.teams||[]).includes(v)
    && ((l.market!=="total" && l.team!==v) || (l.market==="total" && l.side==="under"));
  const race = r.block_self_bets && v && csFutAgainst(l, v, CS.lines);

    || (l.state==="in" && (!r.live_enabled || l.sport!=="nfl"));

  const on = CS.slip.includes(l.id);
  const why = race && l.market!=="po" ? "Your team is still in this race: you can only back your own team here"
    : own ? "You can't bet against your own team" : shut ? "Not taking bets right now"
    : range ? "Outside the casino's price limits" : `${csSel(l)} ${csAm(l.american)}`;
  return `<button type="button" class="odd" data-line="${esc(l.id)}" aria-pressed="${on}" title="${esc(why)}" aria-label="${esc(`${csEvent(l)}: ${csSel(l)} ${csAm(l.american)}`)}"${(own||shut||range)&&!on?" disabled":""}>

/* The drawer's tabs: which kind of prop a market is. Combined yardage sits with

  /* A school's name is long for a phone's card ("Kennesaw St" beside its logo and three prices), so a narrow

  const row = (s, ou) => `<div class="csmk">

        ${tabs}<div class="csprops">${list.map(pl=>{
        const td = inCat("atd") ? tdOrder.filter(k=>pl.td[k]) : [];
        const sub = cfb ? (csCfbTeam(pl.team)?.abbr || "") : [pl.team, CS.roster?.positions?.[pl.id]].filter(Boolean).join(" · ");
        const shirt = cfb ? csJerseyCfb(pl.team, pl.jersey, 38) : csJersey(pl.team, csNumber(pl.id), 38);

          ${td.length?`<div class="csladder"><span class="lbl">Touchdowns</span>${td.map(k=>csOdd(pl.td[k], CS_TD_SHORT[k])).join("")}</div>`:""}
          ${byOrder(Object.keys(pl.ou)).map(k=>{ const x = pl.ou[k];
            return `<div class="csprop"><div class="nm">${esc(CS_PROP[k]||k)}</div>
              ${csOdd(x.over, x.over?`O ${x.over.point}`:"")}${csOdd(x.under, x.under?`U ${x.under.point}`:"")}</div>` }).join("")}
          ${byOrder(Object.keys(pl.ms)).map(k=>`<div class="csladder"><span class="lbl">${esc(CS_PROP[k]||k)}</span>${
            pl.ms[k].sort((a,b)=>a.point-b.point).map(m=>csOdd(m, `${m.point+0.5}+`)).join("")}</div>`).join("")}</div>`;
      }).join("")}</div>`;
    }
  }
  // most college games never get props: the button only shows where the sync found some
  const hasProps = !cfb || Number(CS.rules?.cprops_synced?.[ev.slice(4)]?.n) > 0;
  return `<div class="csgame${cfb?" cfb":""}" id="g-${esc(ev)}" data-k="${esc(ev)}">
    <div class="cshd"><b>${esc(f.event_label)}</b><span>${esc(csWhen(f.commence_at))}</span>
      <span class="csst">${live?`<span class="cschip live">Live</span>`:""}${sus?` <span class="cschip">Suspended</span>`:""}</span></div>
    <div class="csmk head"><span></span><span>Spread</span><span>Total</span><span>Money</span></div>
    ${row("away","over")}${row("home","under")}
    ${hasProps?`<button type="button" class="csmore" data-csprops="${esc(ev)}" aria-expanded="${!!open}">${open?"Hide player props ▴":"Player props ▾"}</button>`:""}
    ${pr}</div>`;
}
/* House rules, "Limits": only the ceilings actually set (null = none). */
function csLimits(r){
  const am = p => csAm(p>=2 ? Math.round((p-1)*100) : Math.round(-100/(p-1)));
  const out = [];
  out.push(r.max_stake_straight==null && r.max_stake_parlay==null
    ? `Bet as much of your bankroll as you like, from ${csMoney(r.min_stake)} up.`
    : `Straight bets up to ${r.max_stake_straight==null?"any amount":csMoney(r.max_stake_straight)}, parlays up to ${r.max_stake_parlay==null?"any amount":csMoney(r.max_stake_parlay)}, minimum ${csMoney(r.min_stake)}.`);
  out.push(r.max_payout==null ? "There's no cap on what a ticket can pay." : `No ticket pays more than ${csMoney(r.max_payout)}.`);
  out.push(`Parlays take ${r.parlay_min_legs}${r.parlay_max_legs!=null ? `–${r.parlay_max_legs} legs` : " or more legs"}${r.parlay_max_price!=null ? `, with odds capped at ${am(r.parlay_max_price)}` : ", with no cap on the odds"}.`);
  if(r.leg_min_price!=null || r.leg_max_price!=null) out.push(`No single price${r.leg_min_price!=null ? ` shorter than ${am(r.leg_min_price)}` : ""}${r.leg_min_price!=null && r.leg_max_price!=null ? " or" : ""}${r.leg_max_price!=null ? ` longer than ${am(r.leg_max_price)}` : ""}.`);
  else out.push("Every price is open, however short or long.");
  if(r.max_open!=null) out.push(`At most ${r.max_open} open tickets at a time.`);
  return out.join(" ");
}

/* WCXC matchups offer a moneyline and a total, no spread: four weeks of data
   showed projected margins overstate the real gap too much to price one fairly
   (see fantasyLines in supabase/functions/_shared/casino.mjs). */
function csMatchup(lines){
  const f = lines[0], [a,b] = f.teams || [];
  const g = (m,s) => lines.find(l=>l.market===m && l.side===String(s) && l.status!=="closed");
  const row = (t, ou) => `<div class="csmk fan">
    <div class="csteam">${img(t)}<span>${esc(pkName(t))}</span><i>${esc(rec(T[t]||{w:0,l:0}))}</i></div>
    ${csOdd(g("total",ou), g("total",ou) ? `${ou==="over"?"O":"U"} ${g("total",ou).point}` : "")}
    ${csOdd(g("ml",t))}</div>`;
  // say why your opponent's side and the under are greyed out (there is no hover on a phone)
  const mine = csRules().block_self_bets && S.voter && (f.teams||[]).includes(S.voter);
  return `<div class="csgame">
    <div class="cshd"><b>${esc(pkName(a))} vs ${esc(pkName(b))}</b><span>locks ${esc(csWhen(f.commence_at))}</span>
      ${mine?`<span class="csown">Your matchup: you can back your team, but not bet against it.</span>`:""}</div>
    <div class="csmk fan head"><span></span><span>Total</span><span>Money</span></div>
    ${row(a,"over")}${row(b,"under")}</div>`;
}
/* ---- the board: one section at a time ----
   WCXC, NFL, College and Futures each get a tab, so finding a game is a tap
   and a short list rather than a scroll past everything else. The tabs stick
   under the header. NFL and College add a search (teams by any name; players
   by asking the database which games have props for them), a strip of every
   game on the list to jump straight to one, and College a Top 25 / conference
   filter, because a Saturday has sixty games on it. */
const CS_SPORTS = [["wcxc","WCXC"],["nfl","NFL"],["cfb","College"],["fut","Futures"]];
function csBoard(){
  const by = {};
  for(const l of CS.lines) (by[l.event] ||= []).push(l);
  const groups = Object.values(by), of = s => groups.filter(g=>g[0].sport===s);
  const fan = of("fantasy"), nfl = of("nfl"), cfb = of("cfb"), fut = of("future");
  const count = {wcxc:fan.length, nfl:nfl.length, cfb:cfb.length, fut:csFutMarkets(fut).length};
  const sport = CS_SPORTS.some(([k])=>k===CS.sport) ? CS.sport : "wcxc";
  const bar = `<div class="cssport" role="tablist" aria-label="What to bet on">${CS_SPORTS.map(([k,l])=>
    `<button type="button" role="tab" data-cssport="${k}" aria-selected="${sport===k}">${l}${count[k]?` <i>${count[k]}</i>`:""}</button>`).join("")}</div>`;
  const body = sport==="nfl" ? csGames(nfl, "nfl")
    : sport==="cfb" ? csGames(cfb, "cfb")
    : sport==="fut" ? csFutures(fut)
    : `<section class="panel"><h2>WCXC matchups</h2>${fan.length ? fan.map(csMatchup).join("")
        : `<div class="pad"><p class="hint" style="margin:0">WCXC matchups are priced once Sleeper has the week's projections, and lock at the first NFL kickoff.</p></div>`}</section>`;
  return `<div id="csboardtop"></div>${bar}${body}`;
}

/* ---- futures ----
   Season-long markets. WCXC's are priced from the league's own forecast
   (odds.json: 10,000 simulated seasons, rebuilt every morning) and are open
   from Tuesday's rebuild until the week's first kickoff, the stretch in which
   that forecast already knows every result. The NFL's are FanDuel's prices,
   closed while games are on. The sync says which is open and why in
   casino_rules.fut_status. */
const csFutMarkets = groups => [...new Set(groups.map(g=>g[0].market))];
function csFutures(groups){
  const lines = groups.flat(), st = CS.rules?.fut_status || {}, all = CS.futAll;
  const wx = lines.filter(l=>l.event.startsWith("fut:wcxc:")), nf = lines.filter(l=>l.event.startsWith("fut:nfl:"));
  const season = (wx[0]||nf[0])?.season || "";
  const byPrice = (a,b)=>a.price-b.price || String(a.side).localeCompare(String(b.side));
  /* a yes/no list runs likeliest first. A "yes" is only taken off the board when a team is near certain, so a
     team with nothing but a "no" outranks every team with a "yes" (the longer its "no", the surer it is);
     sorting on the yes price alone had sunk the two surest teams to the bottom */
  const chance = p => p.yes ? 1/p.yes.price : p.no ? 2 - 1/p.no.price : 0;
  const likeliest = (a,b)=>chance(b)-chance(a);
  const more = (key, n, total) => total>n ? `<button type="button" class="csmore" data-csfutall="${key}">${all[key]?"Show fewer ▴":`Show all ${total} ▾`}</button>` : "";
  const why = (s, games) => !s ? "Not open right now."
    : s.why==="games" ? games
    : s.why==="stale" ? "Closed until the forecast is rebuilt with this week's results."
    : s.why==="season" ? "Those markets have been decided for the season."
    : "Not open right now.";
  // WCXC
  const wTeam = l => `<span class="csfwho">${img(l.team)}<span class="nm"><b>${esc(pkName(l.team))}</b><i>${esc(rec(T[l.team]||{w:0,l:0}))}</i></span></span>`;
  const title = wx.filter(l=>l.market==="title").sort(byPrice);
  const po = Object.values(wx.filter(l=>l.market==="po").reduce((m,l)=>((m[l.team] ||= {team:l.team})[l.side] = l, m), {})).sort(likeliest);
  const divs = Object.values(wx.filter(l=>l.market==="div").reduce((m,l)=>((m[l.event] ||= []).push(l), m), {}));
  const mine = S.voter && csRules().block_self_bets;
  const wHtml = wx.length ? `
      ${title.length?`<div class="csfmk"><h3>Champion</h3>${title.map(l=>`<div class="csfrow">${wTeam(l)}${csOdd(l)}</div>`).join("")}
        ${title.length<12?`<p class="hint csfnote">Teams not listed are out of the running in the forecast.</p>`:""}</div>`:""}
      ${po.length?`<div class="csfmk"><h3>Make the playoffs</h3><div class="csfrow head"><span></span><span>Yes</span><span>No</span></div>
        ${po.map(p=>`<div class="csfrow two">${wTeam(p.yes||p.no)}${csOdd(p.yes,"Yes")}${csOdd(p.no,"No")}</div>`).join("")}</div>`:""}
      ${divs.length?`<div class="csfmk"><h3>Division winners</h3>${divs.sort((a,b)=>a[0].event.localeCompare(b[0].event)).map(d=>
        `<p class="csfdiv">${esc(d[0].event_label)}</p>${d.sort(byPrice).map(l=>`<div class="csfrow">${wTeam(l)}${csOdd(l)}</div>`).join("")}`).join("")}</div>`:""}
      ${mine?`<p class="hint csfnote">Your own team: you can back it to make the playoffs, win its division or win the title. While it's still in a race you can't back anyone else in that race, and you can't take it to miss the playoffs.</p>`:""}`
    : `<div class="pad"><p class="hint" style="margin:0">${esc(why(st.wcxc, "Closed while this week's games are on. WCXC futures reopen on Tuesday morning, once the forecast has this week's results in it."))}</p></div>`;
  const wNote = st.wcxc?.open && st.wcxc.until ? `Priced from the league's forecast of 10,000 simulated seasons, rebuilt every morning. Open until ${csWhen(st.wcxc.until)}: they close at each week's first kickoff and reopen when Tuesday's forecast is out.` : "";
  // NFL
  const nTeam = l => `<span class="csfwho">${csLogoImg(l.label, "flg")}<span class="nm"><b>${esc(CS_NFL_NAME[csTeamKey(l.label)] || l.label)}</b></span></span>`;
  const sb = nf.filter(l=>l.market==="sb").sort(byPrice), sbShown = all.sb ? sb : sb.slice(0, 12);
  const confs = ["AFC","NFC"].map(c=>[c, Object.values(nf.filter(l=>l.market==="nflpo" && String(l.event_label).startsWith(c))
    .reduce((m,l)=>((m[l.label] ||= {team:l.label})[l.side] = l, m), {})).sort(likeliest)]).filter(([,t])=>t.length);
  const nHtml = nf.length ? `
      ${sb.length?`<div class="csfmk"><h3>${esc(sb[0].event_label)}</h3>${sbShown.map(l=>`<div class="csfrow">${nTeam(l)}${csOdd(l)}</div>`).join("")}${more("sb", 12, sb.length)}</div>`:""}
      ${confs.length?`<div class="csfmk"><h3>Make the playoffs</h3>${confs.map(([c,t])=>`<p class="csfdiv">${c}</p><div class="csfrow head"><span></span><span>Yes</span><span>No</span></div>
        ${(all[c]?t:t.slice(0,8)).map(p=>`<div class="csfrow two">${nTeam(p.yes||p.no)}${csOdd(p.yes,"Yes")}${csOdd(p.no,"No")}</div>`).join("")}${more(c, 8, t.length)}`).join("")}</div>`:""}`
    : `<div class="pad"><p class="hint" style="margin:0">${esc(why(st.nfl, "Closed while NFL games are on. They reopen at FanDuel's new prices once the last game ends."))}</p></div>`;
  return `<section class="panel csfut"><h2>WCXC${season?` · ${season} season`:""}</h2>${wNote?`<p class="hint csfnote">${esc(wNote)}</p>`:""}${wHtml}</section>
    <section class="panel csfut" style="margin-top:16px"><h2>NFL${season?` · ${season} season`:""}</h2>${nf.length?`<p class="hint csfnote">FanDuel's futures prices. Closed while NFL games are on, so nobody can bet on a result that's already in.</p>`:""}${nHtml}</section>`;
}

/* What a search is matched against: the teams by abbreviation, place and
   nickname, so "eagles", "philadelphia" and "phi" all find the same game. */
function csGameWords(g){
  const f = g[0], words = [f.event_label];
  for(const l of g){
    if(l.market==="total") continue;
    words.push(l.label);
    if(f.sport==="cfb"){ const t = csCfbTeam(l.nfl_team); if(t) words.push(t.abbr, t.short, t.name) }
    else words.push(CS_NFL_NAME[csTeamKey(l.label)] || "");
  }
  return words.join(" ").toLowerCase();
}
const csDay = iso => new Date(iso).toLocaleDateString("en-US",{timeZone:ET,weekday:"long",month:"short",day:"numeric"});
const csChipWhen = iso => new Date(iso).toLocaleString("en-US",{timeZone:ET,weekday:"short",hour:"numeric",minute:"2-digit"});
function csGames(groups, kind){
  const q = CS.q.trim().toLowerCase();
  let list = groups.slice().sort((x,y)=>Date.parse(x[0].commence_at)-Date.parse(y[0].commence_at) || x[0].event.localeCompare(y[0].event));
  const all = list.length;
  if(kind==="cfb") list = list.filter(csCfbKeep);
  // a player's name matches no team, so the games his props are in stay on the list too
  const found = CS.found && CS.found.q===CS.q.trim() ? new Set(CS.found.list.map(p=>p.event)) : null;
  if(q) list = list.filter(g=>csGameWords(g).includes(q) || found?.has(g[0].event));
  const name = kind==="cfb" ? "College" : "NFL";
  const find = `<div class="csfind">
      <label class="csq"><span class="sr">Search</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="csq" type="search" autocomplete="off" enterkeyhint="search" placeholder="Find a team or player" value="${esc(CS.q)}"></label>
      ${kind==="cfb" ? csCfbPicker() : ""}</div>`;
  const jump = list.length>1 ? `<div class="csjump" role="list" aria-label="Jump to a game">${list.map(g=>{ const f = g[0];
      return `<button type="button" role="listitem" data-csjump="${esc(f.event)}"><b>${esc(csEventShort(f))}</b><i>${esc(csChipWhen(f.commence_at))}</i></button>` }).join("")}</div>` : "";
  // one header per week, and under it one per day: a Saturday's sixty games read as a day, not a wall
  let cards = "", lastWeek = null, lastDay = null;
  for(const g of list){
    const f = g[0], day = csDay(f.commence_at);
    if(f.week!==lastWeek){ cards += `<p class="csweek">${name} · Week ${f.week}</p>`; lastWeek = f.week; lastDay = null }
    if(day!==lastDay){ cards += `<p class="csday">${esc(day)}</p>`; lastDay = day }
    cards += csGame(g);
  }
  const empty = q ? `No ${kind==="cfb"?"college ":""}games match “${esc(CS.q.trim())}”.`
    : kind==="cfb" && all ? "No games in that group this week. Try All FBS."
    : kind==="cfb" ? "No college lines up right now. DraftKings' lines for the week appear here within a few minutes of being posted."
    : "No NFL lines up right now. DraftKings posts the next week's lines early in the week, and they appear here within a minute.";
  return `<section class="panel csgames">${find}${csFoundHtml(kind)}${jump}${cards || `<div class="pad"><p class="hint" style="margin:0">${empty}</p></div>`}</section>`;
}
// "PHI @ JAX" for the NFL; school names for college, whose abbreviations mean little
const csEventShort = f => f.sport==="cfb" ? f.event_label.replace(/^#\d+\s*/,"").replace(/ @ #\d+\s*/," @ ") : f.event_label;

/* Players a search turned up: the database is asked which open props carry
   that name (props are loaded per game, so the page can't know otherwise). A
   result opens that game's props on that one player. */
function csFoundHtml(kind){
  const f = CS.found, q = CS.q.trim();
  if(!f || q.length<3 || f.q!==q) return "";
  const list = f.list.filter(p=>p.sport===(kind==="cfb" ? "cprop" : "prop"));
  if(!list.length) return "";
  return `<div class="csfound"><p class="lbl">Players</p>${list.slice(0,12).map(p=>
    `<button type="button" data-csfind="${esc(p.event)}|${esc(p.player)}">${csFoundArt(p)}<span><b>${esc(p.label)}</b><i>${esc(p.game)} · ${p.n} prop${p.n===1?"":"s"}</i></span></button>`).join("")}</div>`;
}
const csFoundArt = p => p.sport==="cprop" ? csJerseyCfb(p.nfl_team, p.jersey, 30) : csJersey(p.nfl_team, csNumber(p.player), 30);
async function csFindPlayers(q){
  const seq = ++CS.findSeq;
  const clean = q.replace(/[%_*,()\\]/g, "").trim();
  if(clean.length<3 || !sb) return;
  const {data,error} = await sb.from("casino_lines").select(csFindCols())
    .in("sport",["prop","cprop"]).eq("status","open").ilike("label", `%${clean}%`).limit(500);
  if(seq!==CS.findSeq || error) return;              // a newer search has started, or this one failed
  const by = new Map();
  for(const l of data||[]){
    const k = l.event+"|"+l.player;
    if(!by.has(k)) by.set(k, {event:l.event, player:l.player, label:l.label, nfl_team:l.nfl_team, sport:l.sport,
      jersey:l.jersey ?? null, game:l.event_label, n:0, at:l.commence_at});
    by.get(k).n++;
  }
  CS.found = {q, list:[...by.values()].sort((a,b)=>Date.parse(a.at)-Date.parse(b.at) || a.label.localeCompare(b.label))};
  if(S.tab==="casino" && CS.view==="board") renderCasino();
}

/* The slip's numbers and warnings are redrawn on every keystroke without
   touching the inputs, so typing a stake never loses focus. */
function csCalc(){
  const r = csRules(), legs = csLegs(), stake = Number(CS.stake)||0;
  const parlay = CS.mode==="parlay" && legs.length>1;
  const singles = CS.mode==="singles" && legs.length>1;
  const tp = parlay ? csTicketPrice(legs, r) : null;
  const errs = legs.length ? csCheck(legs, CS.stake, S.voter, r, CS.mode, Date.now(), tp?.price ?? null) : [];
  if(tp?.err && !errs.includes(tp.err)) errs.push(tp.err);
  if(S.voter && stake*(singles?legs.length:1) > Number(csBank(S.voter).balance))
    errs.push(`You have ${csMoney(csBank(S.voter).balance)} to bet with.`);
  if(!S.voter) errs.push("Choose your team.");
  const price = parlay ? (tp?.price ?? null) : null;
  const capped = parlay && r.parlay_max_price != null && tp?.raw > r.parlay_max_price;
  const am = p => csAm(p>=2?Math.round((p-1)*100):Math.round(-100/(p-1)));
  const win = !legs.length || (parlay && !price) ? 0 : parlay ? stake*price : singles ? legs.reduce((a,l)=>a+stake*l.price,0) : stake*legs[0].price;
  const html = legs.length ? `<div class="cscalc">
      ${(tp?.sgp||[]).map(g=>`<span>Same game · ${esc(g.label)} (${g.legs} legs)</span><b>${am(g.price)}</b>`).join("")}
      ${parlay && tp?.pending?`<span>Pricing the same-game parlay…</span><b>…</b>`:""}
      ${parlay && price?`<span>Parlay odds${capped?" (capped)":""}</span><b>${am(price)}</b>`:""}
      <span>Total stake</span><b>${csMoney(stake*(singles?legs.length:1))}</b>
      <span>Returns if ${singles?"all win":"it wins"}</span><b>${csMoney(Math.min(win, singles ? Infinity : (r.max_payout ?? Infinity)))}</b>
    </div>${stake>0||errs.length&&legs.length>0?`<ul class="cswarn">${(stake>0?errs:errs.filter(e=>e!=="Enter a stake.")).map(e=>`<li>${esc(e)}</li>`).join("")}</ul>`:""}` : "";
  return {html, ok: legs.length>0 && !errs.length && !CS.placing && !(parlay && tp?.pending), price};
}
function csRefreshCalc(){
  const c = csCalc(), box = document.getElementById("cscalc"), go = document.getElementById("csplace");
  if(box) box.innerHTML = c.html;
  if(go) go.disabled = !c.ok;
}

    ${legs.length>1?`<div class="seg" role="group" aria-label="Bet type">

      <label class="pwrap">${legs.length>1&&CS.mode==="singles"?"Stake per bet":"Stake"} ($) <input id="csstake" type="number" inputmode="decimal" min="1" step="0.01" value="${esc(CS.stake)}" placeholder="10.00"></label>
      <label class="pwrap">Team password <input id="cspw" type="password" autocomplete="current-password" value="${esc(savedPw)}" placeholder="Same as your ballot"></label>
    </div>
    <div id="cscalc">${c.html}</div>
    <div class="actions" style="margin-top:12px">
      <button class="btn big" id="csplace"${c.ok?"":" disabled"} style="flex:1">${CS.placing?"Placing…":legs.length>1&&CS.mode==="singles"?`Place ${legs.length} bets`:"Place bet"}</button>
      ${legs.length?`<button class="btn ghost" id="csclear">Clear</button>`:""}
    </div>
    ${CS.msg?`<p class="csmsg ${CS.msg.err?"err":"ok"}" role="status">${esc(CS.msg.text)}</p>`:""}
  </div></section>`;
}

/* ---- the ticket ----
   Modelled on a real sportsbook's: what it is and what it pays at the top,
   every leg with its own result below, and under the legs the game each one
   is riding on. The scoreboard comes from casino_games and the running prop
   number from casino_lines.live, both written by the sync; nothing here
   decides anything, it only shows what has already happened. */
/* ESPN publishes a second set of marks drawn for dark backgrounds (500-dark). On
   this page the light set loses the Rams, Giants and Jets, which are navy or dark
   green on near-black, and outlines the Cowboys' star in nothing. Same host, so
   the CSP already allows it. */
const csLogo = ab => `https://a.espncdn.com/i/teamlogos/nfl/500-dark/${encodeURIComponent(String(ab||"").toLowerCase())}.png`;
// with no abbreviation there is no logo to ask for; a blank of the same size keeps the row's shape
const csLogoImg = (ab, cls = "") => ab ? `<img${cls?` class="${cls}"`:""} alt="" src="${csLogo(ab)}">` : `<span${cls?` class="${cls}"`:""}></span>`;
const csKick = iso => new Date(iso).toLocaleString("en-US",{timeZone:ET,weekday:"short",hour:"numeric",minute:"2-digit"})+" ET";

/* the art beside a leg: the player's own jersey for a prop, an NFL logo for a game,
   a team avatar for a WCXC matchup. `size` is " sm" on the slip. */
function csArt(l, size = ""){
  if(!l) return `<span class="tkart${size}"></span>`;
  if(l.sport==="fantasy" || (l.sport==="future" && l.team)) return `<span class="tkart${size}">${img(l.team||(l.teams||[])[0],"tkav")}</span>`;
  if(l.sport==="prop" || l.sport==="cprop") return `<span class="tkart${size}">${csJerseyFor(l, size ? 34 : 46)}</span>`;
  if(l.sport==="cfb") return `<span class="tkart${size}">${l.market==="total" ? `<i class="tkany">T</i>` : csCfbLogoImg(l.nfl_team)}</span>`;
  const ab = l.nfl_team || (l.market==="total" ? null : l.label);
  return `<span class="tkart${size}">${ab?`<img alt="" src="${csLogo(ab)}">`:`<i class="tkany">${l.market==="total"?"T":"·"}</i>`}</span>`;
}

/* How far a player prop has got, against the line it was placed at. Only for
   a prop with a number to show: a touchdown-scorer market has none. */
function csProgress(l, point, result){
  if(!l || l.sport!=="prop" || l.live==null || point==null) return "";
  const cur = Number(l.live), line = Number(point);
  if(!Number.isFinite(cur) || !Number.isFinite(line)) return "";
  const max = Math.max(line*1.3, cur*1.08, 1);
  const w = v => `${Math.max(0,Math.min(100, v/max*100)).toFixed(1)}%`;
  // the bubble is pinned inside the bar, so a prop past its line is still readable
  const bub = `${Math.max(7,Math.min(93, cur/max*100)).toFixed(1)}%`;
  const lost = result==="loss";
  return `<div class="tkprog${lost?" lost":""}">
    <span class="tkbar"><i style="width:${w(cur)}"></i></span>
    <span class="tktick" style="left:${w(line)}"></span>
    <span class="tkline" style="left:${w(line)}">${esc(String(line))}</span>
    <span class="tkbub" style="left:${bub}">${esc(Number.isInteger(cur)?String(cur):cur.toFixed(1))}</span>
  </div>`;
}

/* The game a group of legs is riding on. Everything here is read from the
   scoreboard table; with no row for the event there is simply no box. */
function csGameBox(ev){
  const g = CS.games[ev];
  if(!g) return "";
  const as = g.away_score, hs = g.home_score;
  if(g.sport==="fantasy"){
    const side = (who, sc) => `<div class="bxrow">${img(+who,"tkav")}<span class="bxnm">${esc(pkName(+who))}</span>
      <b class="bxsc">${sc==null?"—":Number(sc).toFixed(2)}</b></div>`;
    const state = g.state==="pre" ? `Locks ${esc(csKick(g.commence_at))}` : esc(g.detail||"Live");
    return `<div class="tkbox"><div class="bxhd">WCXC · ${state}</div>${side(g.away,as)}${side(g.home,hs)}</div>`;
  }
  // a college game's sides are ESPN team ids: logo by id, name from cfb.json
  const cfb = g.sport==="cfb";
  const lg = id => cfb ? csCfbLogoImg(id) : csLogoImg(id);
  const nm = id => cfb ? (csCfbTeam(id)?.abbr || "") : id;
  if(g.state==="pre") return `<div class="tkbox tkpre">
      <span class="bxlg">${lg(g.away)}</span><b>${esc(nm(g.away))}</b>
      <span class="bxwhen">${esc(csKick(g.commence_at))}</span>
      <b>${esc(nm(g.home))}</b><span class="bxlg">${lg(g.home)}</span></div>`;
  const live = g.state==="in";
  const qs = n => { const a=(n||[]).map(x=>String(x)); while(a.length<4) a.push("–"); return a };
  const row = (ab, sc, per, pos) => `<div class="bxrow bxq">
      <span class="bxposs"${pos?' data-on="1"':''}></span>
      <span class="bxlg">${lg(ab)}</span><span class="bxnm">${esc(nm(ab))}</span>
      ${live?qs(per).map(q=>`<span class="bxqn">${esc(q)}</span>`).join(""):""}
      <b class="bxsc">${sc==null?"—":Number(sc)}</b></div>`;
  return `<div class="tkbox${live?" bxlive":""}">
    <div class="bxhd">${live?`<b class="bxdot">● Live</b> `:""}${esc(g.detail||"Final")}${g.situation?` · ${esc(g.situation)}`:""}
      ${live?`<span class="bxcols"><span>Q1</span><span>Q2</span><span>Q3</span><span>Q4</span><span>T</span></span>`:""}</div>
    ${row(g.away, as, g.away_periods, g.possession==="away")}
    ${row(g.home, hs, g.home_periods, g.possession==="home")}</div>`;
}

function csTicket(b){
  const price = Number(b.price), stake = Number(b.stake);
  const st = {pending:"Held", open:"Open", won:"Won", lost:"Lost", push:"Push", void:"Void", rejected:"Refused"}[b.status] || b.status;
  const settled = ["won","lost","push","void","rejected"].includes(b.status);
  const evs = b.bet_legs.map(g=>g.event).filter(Boolean), sgp = new Set(evs).size < evs.length;
  const sel = g => { const l = CS.byId[g.line_id]; return l ? csSel(l, g.point) : "A line no longer listed" };
  const title = b.kind==="parlay" ? `${b.bet_legs.length} Pick Parlay` : sel(b.bet_legs[0]);
  /* The line under the title says what the ticket is on. For a parlay that is its
     selections; for a single bet the selection IS the title, so repeating it said
     nothing — name the game or matchup instead. */
  const line1 = b.kind==="parlay" ? null : CS.byId[b.bet_legs[0]?.line_id];
  const summary = line1 && csEvent(line1) ? csEvent(line1) : b.bet_legs.map(sel).join(", ");
  const shut = !!CS.shut[b.id];

  // legs grouped by the game they ride on, so one box can serve all of them
  const groups = [];
  for(const g of b.bet_legs){
    const key = g.event || g.line_id;
    const hit = groups.find(x=>x.key===key);
    if(hit) hit.legs.push(g); else groups.push({key, ev:g.event, legs:[g]});
  }
  const leg = g => { const l = CS.byId[g.line_id], r = g.result;
    const mark = r==="win" ? `<svg viewBox="0 0 24 24" class="ok"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16.2 9.6"/></svg>`
      : r==="loss" ? `<svg viewBox="0 0 24 24" class="no"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>`
      : r ? `<svg viewBox="0 0 24 24" class="mid"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>`
      : `<svg viewBox="0 0 24 24" class="wait"><circle cx="12" cy="12" r="8.5"/></svg>`;
    const whole = l ? csSel(l, g.point) : "A line no longer listed";
    // the design splits a selection into its headline and what it is of
    const cut = l && l.sport==="prop" ? csPropSplit(l, g.point) : null;
    return `<div class="tkleg"><span class="tkmark ${r||"open"}">${mark}</span>${csArt(l)}
        <span class="tktxt"><b>${esc(cut?cut[0]:whole)}</b>${cut?`<i>${esc(cut[1])}</i>`:l?`<i>${esc(csEvent(l))}</i>`:""}</span>
        <b class="tkprice">${esc(csAm(l ? csDecAm(Number(g.price)) : null))}</b></div>
      ${csProgress(l, g.point, r)}${l?.sport==="future" && !r ? `<div class="tkfut">${esc(csFutNote(l))}</div>` : ""}`;
  };
  return `<article class="tk">
    <div class="tkhd">
      ${CS.feed==="all"?`<div class="tkwho">${img(b.voter,"tkav")}<b>${esc(pkName(b.voter))}</b><span>${esc(T[b.voter]?.owner||"")}</span></div>`:""}
      <div class="tktop">${sgp?`<span class="tksgp">SGP</span>`:""}<b class="tkttl">${esc(title)}</b>
        <span class="tkbar2"></span><b class="tkttl">${esc(csAm(csDecAm(price)))}</b>
        <span class="tkst ${b.status}">${st}</span></div>
      <div class="tksum">${esc(summary)}</div>
      <div class="tkmoney"><span>Wager: <b>${csMoney(stake)}</b></span><span class="tkbar2"></span>
        <span>${settled?"Paid":"To Pay"}: <b class="${b.status==="won"?"win":""}">${csMoney(settled?b.payout:Math.min(stake*price, Number(CS.rules?.max_payout)||Infinity))}</b></span></div>
      ${b.status==="pending"?`<div class="tknote">Held for the live-bet delay</div>`:""}
      ${b.note?`<div class="tknote">${esc(b.note)}</div>`:""}
    </div>
    ${shut?"":`<div class="tkbody">${groups.map(gr=>gr.legs.map(leg).join("")+csGameBox(gr.ev)).join("")}</div>`}
    <div class="tkft">
      <button type="button" class="tkmore" data-cstoggle="${b.id}">${shut?"Show legs":"Hide legs"}
        <svg viewBox="0 0 24 24"><path d="${shut?"M6 9l6 6 6-6":"M6 15l6-6 6 6"}"/></svg></button>
      <div class="tkid"><span class="tkbet">Bet</span><span>Bet ID: ${esc(String(b.id))}</span>
        <span>Placed: ${esc(new Date(b.placed_at).toLocaleString("en-US",{timeZone:ET,month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}))}</span></div>
    </div>
  </article>`;
}
/* When a future is decided. WCXC's regular season is Weeks 1-14 and its
   playoffs run to Week 17; the NFL's are its own. */
function csFutNote(l){
  if(l.market==="po" || l.market==="div") return "Settles once the WCXC regular season is in the books.";
  if(l.market==="title") return "Settles when the WCXC championship is decided.";
  if(l.market==="sb") return "Settles after the Super Bowl.";
  return "Settles when the NFL regular season ends.";
}
// a decimal price back to the American one the ticket was taken at
const csDecAm = d => !Number.isFinite(d) || d<=1 ? null : d>=2 ? Math.round((d-1)*100) : -Math.round(100/(d-1));
/* "220+" and "Bryce Young Passing Yards": the headline a book leads with, and
   what it is a number of. Falls back to one line when it cannot be split. */
function csPropSplit(l, point){
  const of = CS_PROP[l.market] || l.market;
  if(CS_TD[l.market]) return [l.label, CS_TD_SHORT[l.market]==="Anytime" ? "Anytime TD Scorer" : CS_TD_SHORT[l.market]+" Scorer"];
  const ms = String(l.id).match(/:ms(\d+)$/);
  if(ms) return [`${ms[1]}+`, `${l.label} ${of}`];
  if(point==null) return [l.label, of];
  return [`${l.side==="over"?"Over":"Under"} ${Number(point)}`, `${l.label} ${of}`];
}

function csLeaders(){
  const rows = TEAMS.map(t=>{ const b = csBank(t.id), bal = Number(b.balance), risk = Number(b.at_risk);
    const staked = Number(b.staked), net = Number(b.returned) - staked;
    return {id:t.id, bal, risk, total:bal+risk, earned:Number(b.earned), net, staked, w:+b.won, l:+b.lost, p:+b.pushed,
      roi: staked ? net/staked : null}; })
    .sort((x,y)=>y.total-x.total || y.net-x.net || x.id-y.id);
  return `<section class="panel"><h2>Bankrolls</h2>
    <p class="hint" style="margin:10px 15px 6px">Ranked by bankroll plus money in play. Betting is what settled bets returned minus what they staked.</p>
    <div class="scroll"><table class="cards">
    <thead><tr><th class="num">#</th><th>Team</th><th class="num">Bankroll</th><th class="num" title="Staked on bets that haven't settled">In play</th>
      <th class="num" title="Ballot rewards">Earned</th><th class="num" title="Returned minus staked, settled bets only">Betting</th>
      <th class="num">Record</th><th class="num">ROI</th></tr></thead>
    <tbody>${rows.map((r,i)=>`<tr>
      <td class="bigrk">${i+1}</td>
      <td><div class="teamcell">${img(r.id)}<div class="nm"><b>${esc(T[r.id]?.name||"")}</b><i>${esc(T[r.id]?.owner||"")}</i></div></div></td>
      <td class="num stat" data-l="Bankroll"><b>${csMoney(r.bal)}</b></td>
      <td class="num stat" data-l="In play">${r.risk?csMoney(r.risk):"–"}</td>
      <td class="num stat" data-l="Earned">${csMoney(r.earned)}</td>
      <td class="num stat" data-l="Betting">${r.staked?`<b class="${r.net>=0?"pos":"neg"}">${r.net>=0?"+":"−"}${csMoney(Math.abs(r.net))}</b>`:"–"}</td>
      <td class="num stat" data-l="Record">${r.w+r.l+r.p?`${r.w}-${r.l}${r.p?`-${r.p}`:""}`:"–"}</td>
      <td class="num stat" data-l="ROI">${r.roi==null?"–":`${(r.roi*100).toFixed(1)}%`}</td>
    </tr>`).join("")}</tbody></table></div></section>`;
}

/* ---- redrawing in place ----
   Every tap in the casino redraws the tab. Replacing main's whole subtree did
   that by destroying the button under the finger, and WebKit (so every browser
   on an iPhone) loses the page's place when the element being tapped vanishes
   mid-gesture: a tap on "Player props", or on any price, threw the page to the
   top, or to the bottom where scroll anchoring is on. Chrome never showed it.

   So the casino patches its new markup into what is already there. A node
   that did not change is left alone, the tapped button included, so nothing
   moves; a focused input keeps its cursor; and a value somebody typed survives
   a redraw unless the markup itself changed what it should say. Children with
   a data-k are matched by it rather than by position, so a game that drops off
   the board doesn't make every card below it rewrite itself. */
function csMorph(el, html){
  const t = document.createElement("template");
  t.innerHTML = html;
  csMorphKids(el, t.content);
}
function csMorphKids(a, b){
  const key = n => n.nodeType===1 ? n.getAttribute("data-k") : null;
  const keyed = new Map();
  for(const c of a.childNodes){ const k = key(c); if(k!=null) keyed.set(k, c) }
  let cur = a.firstChild;
  for(const y of Array.from(b.childNodes)){
    const k = key(y);
    let x = null;
    if(k!=null){ x = keyed.get(k) || null; if(x) keyed.set(k, null) }     // each old node is reused once at most
    else if(cur && key(cur)==null) x = cur;
    if(!x){ a.insertBefore(y, cur); continue }        // nothing to reuse: the new node goes in here
    if(x===cur) cur = cur.nextSibling; else a.insertBefore(x, cur);
    if(x.nodeType===y.nodeType && x.nodeName===y.nodeName) csMorphNode(x, y);
    else a.replaceChild(y, x);
  }
  while(cur){ const n = cur.nextSibling; a.removeChild(cur); cur = n }
}
function csMorphNode(x, y){
  if(x.nodeType!==1){ if(x.nodeValue!==y.nodeValue) x.nodeValue = y.nodeValue; return }
  const tag = x.nodeName, mine = x===document.activeElement;
  const was = tag==="INPUT" ? x.getAttribute("value") : null;
  const want = tag==="SELECT" ? (y.querySelector("option[selected]")?.value ?? null) : null;   // read before the options move
  for(const at of Array.from(x.attributes)) if(!y.hasAttribute(at.name)) x.removeAttribute(at.name);
  for(const at of Array.from(y.attributes)) if(x.getAttribute(at.name)!==at.value) x.setAttribute(at.name, at.value);
  if(tag==="INPUT"){
    const now = y.getAttribute("value");
    if(!mine && was!==now) x.value = now ?? "";
    return;
  }
  csMorphKids(x, y);
  if(tag==="SELECT" && !mine && want!=null && x.value!==want) x.value = want;
}
/* Draw the casino: patched in place when the casino is what's already there,
   written fresh when arriving from another tab (whose own listeners must not
   survive onto reused nodes) or where there is no DOM to patch (the tests). */
function csPaint(html){
  const root = main.firstElementChild;
  if(root && root.classList && root.classList.contains("csroot") && typeof document.createElement==="function") csMorph(main, html);
  else main.innerHTML = html;
}

function renderCasino(){
  if(!CS.loaded && !CS.loading) loadCasino();
  const r = csRules();
  if(!configured){ main.innerHTML = banner()+`<h1>Casino</h1>`; return }
  if(!CS.loaded){
    main.innerHTML = banner()+`<p class="kicker">Play money · WCXC</p><h1>Casino</h1><section class="panel"><div class="closed"><p class="big">Loading the board…</p></div></section>`;
    return;
  }
  const feed = CS.bets.filter(b=>(CS.feed==="all" || b.voter===S.voter)
    && (CS.status==="any" || (CS.status==="open" ? b.status==="open"||b.status==="pending" : b.status!=="open"&&b.status!=="pending")));
  const open = CS.bets.filter(b=>b.status==="open"||b.status==="pending");
  // every won bet of the season when we have them, else whatever the feed holds
  const won = (CS.wins || CS.bets.filter(b=>b.status==="won")).map(b=>({b, gain:Number(b.payout)-Number(b.stake)}))
    .sort((x,y)=>y.gain-x.gain)[0];
  const top = TEAMS.map(t=>({id:t.id, v:Number(csBank(t.id).balance)+Number(csBank(t.id).at_risk)})).sort((x,y)=>y.v-x.v)[0];
  const seg = (name, opts, cur) => `<div class="seg" role="group">${opts.map(([k,l])=>
    `<button type="button" data-${name}="${k}" aria-pressed="${cur===k}">${l}</button>`).join("")}</div>`;
  csPaint(`<div class="csroot">` + banner()
    + `<p class="kicker">Play money · WCXC</p><h1>Casino</h1>
       <p class="lede">Earn ${csMoney(r.reward_ballot||100)} for every ballot you cast, then bet it on real NFL and college lines, player props, season-long futures, or this week's WCXC matchups. Nothing here is real money.</p>`
    + (CS.err ? `<div class="banner err">${esc(CS.err)}</div>` : "")
    + `<div class="tiles">
        ${S.voter?`<div class="tile"><i>Your bankroll</i><b>${csMoney(csBank(S.voter).balance)}</b><span>${esc(pkName(S.voter))}${Number(csBank(S.voter).at_risk)?` · ${csMoney(csBank(S.voter).at_risk)} in play`:""}</span></div>`:""}
        <div class="tile"><i>Richest</i><b>${top&&top.v?esc(pkName(top.id)):"–"}</b><span>${top&&top.v?csMoney(top.v):"Nobody has earned anything yet"}</span></div>
        <div class="tile"><i>Biggest win</i><b>${won?esc(pkName(won.b.voter)):"–"}</b><span>${won?`+${csMoney(won.gain)} on ${csMoney(won.b.stake)}`:"No winners yet"}</span></div>
        <div class="tile"><i>Open action</i><b>${csMoney(open.reduce((a,b)=>a+Number(b.stake),0))}</b><span>${open.length} ticket${open.length===1?"":"s"}</span></div>
      </div>`
    + `<div class="csbar">${seg("csview", [["board","Board"],["bets","My bets"],["banks","Bankrolls"],["rules","House rules"]], CS.view)}${csFresh()}</div>`
    + (CS.view==="board" ? `<div class="csgrid"><div>${csBoard()}</div><div>${csSlip()}</div></div>` : "")
    + (CS.view==="bets" ? `<div class="tkfilters">
        ${seg("csfeed", [["mine","Mine"],["all","Everyone"]], CS.feed)}
        ${seg("csstatus", [["open","Open"],["settled","Settled"],["any","All"]], CS.status)}
      </div>
      ${feed.length ? `<div class="tkgrid">${feed.slice(0,60).map(csTicket).join("")}</div>`
        : `<div class="panel pad"><p class="hint" style="margin:0">No bets here yet.</p></div>`}` : "")
    + (CS.view==="banks" ? csLeaders() : "")
    + (CS.view==="rules" ? `<section class="panel"><div class="pad">
        <p style="margin:0 0 9px"><b>Earning.</b> A complete ballot pays ${csMoney(r.reward_ballot)}, once per week, when cast inside the voting window (Tuesday 12:00 AM to Thursday 8:00 PM ET). Bankrolls never reset. Your bets use the same team password as your ballot.</p>
        <p style="margin:0 0 9px"><b>Limits.</b> ${csLimits(r)}</p>
        <p style="margin:0 0 9px"><b>Where the prices come from.</b> NFL moneylines, spreads and totals are DraftKings' current lines, read from ESPN about once a minute. Player props come from FanDuel at FanDuel's own prices: over/unders, milestones (50+ yards and the like) and touchdown scorers (anytime, 2+, first, last), refreshed every ten minutes or so. For a game FanDuel hasn't posted yet, props use DraftKings' line through ESPN at a flat ${csAm(r.prop_american||-115)} each way, because that feed publishes the line but not the price. WCXC moneylines come from Sleeper's player projections under this league's scoring, with each position's own spread, with a ${((Number(r.fantasy_hold)||0.045)*100).toFixed(1)}% house margin. WCXC totals are Sleeper's projections corrected to what teams here actually score${(()=>{ const sc = Number(r.fantasy_scale)||1;
          return Math.abs(sc-1)>0.02 ? ` — Sleeper projects this league about ${Math.round(Math.abs(1/sc-1)*100)}% ${sc<1?"high":"low"}, so totals use ${sc.toFixed(2)}× the projection` : ""; })()}, re-measured daily from finished weeks. There are no WCXC spreads yet: there isn't enough history to price one fairly. Everything WCXC locks at the week's first NFL kickoff.</p>
        <p style="margin:0 0 9px"><b>Same-game parlays.</b> ${r.sgp_max_legs!=null ? `Up to ${r.sgp_max_legs} legs` : "Any number of legs"} of a parlay can come from one NFL game, pregame only, mixing moneyline, spread, total and player props. First and last touchdown scorer are the exception: only one player can score first, so those stay out of same-game parlays. Legs from one game move together (a team that covers has also won; a quarterback's big day is usually his receiver's too), so the combination is priced by simulating the game thousands of times from DraftKings' own lines and counting how often every leg wins at once. That pays ${Math.round((Number(r.sgp_hold)||0.15)*100)}% under the simulated odds, and never more than the legs multiplied. Combinations that can't happen together are refused. WCXC matchups stay one leg each, and so do college games: none of them is simulated.</p>
        <p style="margin:0 0 9px"><b>College football.</b> Every FBS game's moneyline, spread and total are DraftKings' lines, read from ESPN every couple of minutes; the board opens on games with a Top 25 team, and any conference or all of FBS is a tap away. Player props come from FanDuel, for the games it posts them for (the bigger ones, a day or two out), at FanDuel's prices, and settle from ESPN's box score. ESPN only lists players who recorded something, so a player it doesn't list is treated as not having played and his bet is void. College games close at kickoff.</p>
        <p style="margin:0 0 9px"><b>Futures.</b> WCXC: the champion, each division and every team to make or miss the playoffs, priced from the league's own forecast (10,000 simulated seasons, rebuilt every morning) with a ${((Number(r.future_hold)||0.05)*100).toFixed(1)}% house margin on each side. They're open from Tuesday morning's rebuild, which knows every result so far, until the week's first kickoff, and only in the regular season. Team chances under 1 in 2,000 aren't listed, and nor is anything already near certain. They settle when the regular season is scored and Sleeper's playoff bracket matches the standings (the champion once the final is). NFL: the Super Bowl winner and every team to make or miss the playoffs, at FanDuel's prices, closed while any NFL game is being played. A team's playoff bet settles the moment ESPN marks it clinched or eliminated, and the Super Bowl once it's final. Futures are single bets: they can't go in a parlay.</p>
        <p style="margin:0 0 9px"><b>Your own team.</b> ${r.block_self_bets ? "You can back your own team in a WCXC matchup, but never bet against it: no opponent moneyline and no under on your own game. The same goes for futures: you can't take your team to miss the playoffs, and while it's still in a race with one winner (the title, its division) it's the only team you can back in that race." : "You can bet on or against your own team, in a WCXC matchup or a future. Every bet shows in the Action feed, so the league can see anyone betting against themselves."}</p>
        <p style="margin:0 0 9px"><b>Live betting</b> is ${r.live_enabled?"on":"off for now"}. ${r.live_enabled?`A live bet is held for ${r.live_delay_sec} seconds and accepted only if the line has refreshed, the price hasn't moved more than ${Math.round((Number(r.live_tolerance)||0)*100)}% and the score and possession haven't changed — otherwise it's refunded. A line goes to Suspended when the game moves before the price does.`:"Every market closes at kickoff."}</p>
        <p class="hint" style="margin:0">Settlement: a push refunds the stake. A player prop voids if the player doesn't play. In a parlay, pushed or voided legs drop out and the rest pays at the reduced odds; any losing leg loses the ticket. In a same-game parlay, a push or void anywhere takes that game's legs out together.</p>
      </div></section>` : "")
    + (CS.slip.length && CS.view==="board" ? `<button type="button" class="csfab" id="csfab">Bet slip (${CS.slip.length})</button>` : "")
    + `</div>`);
}

/* Casino clicks and typing. One delegated listener, scoped to the tab, using
   attributes nothing else on the page reacts to. */
main.addEventListener("click", e => {
  if(S.tab!=="casino") return;
  const el = e.target.closest("button"); if(!el) return;
  const d = el.dataset;
  if(d.line){
    const id = d.line, i = CS.slip.indexOf(id);
    if(i>=0) CS.slip.splice(i,1); else CS.slip.push(id);
    CS.msg = null; renderCasino();
    // a second leg from one game makes a same-game group: fetch what prices it
    const missing = csSimIds().filter(x=>CS.sims[x]===undefined);
    if(missing.length) csLoadSims(missing).then(()=>{ if(S.tab==="casino") renderCasino() });
    return;
  }
  if(d.csrm){ CS.slip = CS.slip.filter(x=>x!==d.csrm); CS.msg = null; renderCasino(); return }
  if(d.csmode){ CS.mode = d.csmode; renderCasino(); return }
  if(d.csfeed){ CS.feed = d.csfeed; renderCasino(); return }
  if(d.csstatus){ CS.status = d.csstatus; renderCasino(); return }
  if(d.csview){ CS.view = d.csview; store.set("wcxc.csview", CS.view); renderCasino(); window.scrollTo(0,0); return }
  if(d.cstoggle){ const k = d.cstoggle; CS.shut[k] = !CS.shut[k]; renderCasino(); return }
  if(d.csprops){
    const ev = d.csprops; CS.propsOpen[ev] = !CS.propsOpen[ev];
    if(!CS.propsOpen[ev]) CS.propWho[ev] = null;
    if(CS.propsOpen[ev] && !CS.props[ev]) loadProps(ev);
    renderCasino(); return;
  }
  if(d.cssport){
    CS.sport = d.cssport; store.set("wcxc.cssport", CS.sport); CS.q = ""; CS.found = null;
    if(CS.sport==="cfb") csLoadCfb();
    renderCasino();
    // the tabs stay stuck to the top of the screen, so a new tab starts at its own top, not halfway down
    const top = document.getElementById("csboardtop");
    if(top && top.getBoundingClientRect().top < 0) top.scrollIntoView({block:"start"});
    return;
  }
  if(d.csjump){ document.getElementById("g-"+d.csjump)?.scrollIntoView({block:"start", behavior:"smooth"}); return }
  if(d.cspcat){ const [ev, k] = d.cspcat.split("|"); CS.propCat[ev] = k; renderCasino(); return }
  if(d.cspwho){ CS.propWho[d.cspwho] = null; renderCasino(); return }
  if(d.csfutall){ CS.futAll[d.csfutall] = !CS.futAll[d.csfutall]; renderCasino(); return }
  if(d.csfind){
    // a player from the search: open his game's props on him alone, and go there
    const [ev, who] = d.csfind.split("|");
    CS.propsOpen[ev] = true; CS.propWho[ev] = who;
    const go = () => document.getElementById("g-"+ev)?.scrollIntoView({block:"start", behavior:"smooth"});
    if(!CS.props[ev]) loadProps(ev).then(go);
    renderCasino(); go();
    return;
  }
  if(el.id==="csclear"){ CS.slip = []; CS.msg = null; renderCasino(); return }
  if(el.id==="csplace"){ placeBets(); return }
  if(el.id==="csfab"){ document.getElementById("csslip")?.scrollIntoView({behavior:"smooth"}); return }
});
main.addEventListener("input", e => {
  if(S.tab!=="casino") return;
  if(e.target.id==="csstake"){ CS.stake = e.target.value; csRefreshCalc() }
  /* The search narrows the games at once; players are a question for the
     database, asked once typing pauses. The board is patched in place, so the
     box keeps its cursor while the list under it changes. */
  if(e.target.id==="csq"){
    CS.q = e.target.value;
    clearTimeout(CS.findT);
    if(CS.q.trim().length>=3) CS.findT = setTimeout(()=>csFindPlayers(CS.q.trim()), 250);
    else CS.found = null;
    renderCasino();
  }
});
main.addEventListener("change", e => {
  if(S.tab!=="casino") return;
  if(e.target.id==="cscfb"){ CS.cfbFilter = e.target.value; store.set("wcxc.cscfb", CS.cfbFilter); renderCasino(); return }
  if(e.target.id!=="csvoter") return;
  S.voter = e.target.value ? +e.target.value : null;
  store.set("wcxc.voter", S.voter); S.pwDraft = null; CS.msg = null; renderCasino();
});

async function placeBets(){
  const legs = csLegs(), r = csRules();
  const errs = csCheck(legs, CS.stake, S.voter, r, CS.mode);
  if(!S.voter) errs.unshift("Choose your team.");
  const pw = (document.getElementById("cspw")?.value || "").trim();
  if(!errs.length && pw.length<4) errs.push("Enter your team's password (at least 4 characters).");
  if(errs.length){ CS.msg = {err:true, text:errs[0]}; renderCasino(); return }
  CS.placing = true; CS.msg = null; renderCasino();
  const tickets = CS.mode==="singles" && legs.length>1 ? legs.map(l=>[l]) : [legs];
  const placed = [], failed = [];
  for(const t of tickets){
    // the price the slip showed; the database prices it again and refuses a different one
    const shown = t.length>1 ? csTicketPrice(t, r).price : (CS.seen?.[t[0].id]?.price ?? t[0].price);
    const {data,error} = await sb.rpc("place_bet", {p_voter:S.voter, p_password:pw, p_stake:Number(CS.stake),
      p_legs:t.map(l=>({line:l.id, ...(CS.seen?.[l.id] || {price:l.price, point:l.point})})), p_price: shown ?? null});
    if(error) failed.push((error.message||"Couldn't place that bet.").replace(/^.*?:\s*(?=[A-Z$])/,""));
    else { placed.push(data); CS.slip = CS.slip.filter(id=>!t.some(l=>l.id===id)); }
  }
  CS.placing = false;
  if(placed.length) store.set("wcxc.pw."+S.voter, pw);
  const held = placed.some(p=>p.status==="pending");
  CS.msg = failed.length
    ? {err:true, text: placed.length ? `${placed.length} placed, ${failed.length} refused: ${failed[0]}` : failed[0]}
    : {err:false, text: held
        ? `Live bet received. It's held for ${r.live_delay_sec} seconds and accepted if the game hasn't moved.`
        : placed.length>1 ? `${placed.length} bets placed.`
        : `Bet placed: ${csMoney(CS.stake)} to return ${csMoney(placed[0]?.payout)}.`};
  if(!failed.length) CS.stake = "";
  CS.sig = ""; await loadCasino(); renderCasino();
}

/* ---------- events ---------- */
/* Going somewhere: a section, and optionally which of its views. Links written
   before the ten tabs became six still name the old ones, so those are
   translated here rather than left to rot. */
function goTo(tab, view){
  if(MOVED[tab]) [tab, view] = MOVED[tab];
  S.tab = TABS.includes(tab) ? tab : "poll";
  if(view) S.pv = view;
  store.set("wcxc.tab", S.tab); store.set("wcxc.pv", S.pv);
  S.hover=null; S.msg=null; S.profile=null; S.article=null;
  if(S.tab==="vote" && !S.ranked.length) preloadOwn();
  render();
  if(S.tab==="casino") loadCasino();   // redraws only if something moved since the last visit
  refreshBallots();   // the grid should never be stale just because a socket dropped
  window.scrollTo(0,0);
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>goTo(b.dataset.tab)));
for(const sel of weekSels()) sel.addEventListener("change", () => {
  S.week = +sel.value; for(const o of weekSels()) o.value = sel.value;
  S.lock=null; S.msg=null; preloadOwn(); render(); refreshBallots();
});

async function submit(){
  if(!votingOpen()){renderVote();return}   // week changed under them
  const pwEl=document.getElementById("pw"), pw=(pwEl?.value||"").trim();
  if(pw.length<4){S.msg={err:true,text:"Enter your team's password (at least 4 characters)."};renderVote();document.getElementById("pw")?.focus();return}
  S.saving=true; S.msg=null; renderVote();
  const {data,error} = await sb.rpc("submit_ballot",{p_season:SEASON,p_week:S.week,p_voter:S.voter,p_ranking:S.ranked,p_password:pw});
  S.saving=false;
  if(error){ S.msg={err:true,text:(error.message||"Couldn't submit. Try again.").replace(/^.*?:\s*(?=[A-Z])/,"")} }
  else{
    store.set("wcxc.pw."+S.voter,pw);
    S.pwDraft=null;
    S.msg={err:false,text:data==="created"?"Ballot submitted. Your team's password is set, so use it again next week.":"Ballot submitted."};
    await loadBallots(); return;
  }
  renderVote();
}

main.addEventListener("click",e=>{
  const prow=e.target.closest("[data-profile]");
  if(prow && !e.target.closest("button")){
    S.profile=+prow.dataset.profile; goTo("poll","voters");
    render(); window.scrollTo({top:0,behavior:"smooth"}); return;
  }
  const card=e.target.closest("[data-article]");
  if(card && !e.target.closest("button")){
    S.article=card.dataset.article; CM.art=S.article; CM.list=[]; CM.loaded=false; CM.msg=null; CM.draft="";
    render(); loadComments(S.article); window.scrollTo({top:0,behavior:"smooth"}); return;
  }
  const el=e.target.closest("button,[data-team]"); if(!el) return;
  const d=el.dataset;
  if(el.id==="backnews"){S.article=null; CM.msg=null; render(); return}
  if(el.id==="cpost"){postComment(); return}
  if(d.cv!==undefined){voteComment(Number(d.cv), Number(d.val)); return}
  if(d.cdel!==undefined){deleteComment(Number(d.cdel)); return}
  if(d.kind!==undefined){S.newsKind=d.kind; renderNews(); return}
  if(el.id==="backvoters"){S.profile=null; render(); return}
  if(d.go){goTo(...(MOVED[d.go]||[d.go,null])); return}
  if(d.view){S.pv=d.view; store.set("wcxc.pv",S.pv); S.profile=null; render(); return}
  if(d.voter){S.voter=+d.voter; store.set("wcxc.voter",S.voter); S.msg=null; S.pwDraft=null; preloadOwn(); renderVote(); return}
  if(d.add){S.ranked.push(+d.add); S.msg=null; renderVote(); return}
  if(d.rm!==undefined){S.ranked.splice(+d.rm,1); renderVote(); return}
  if(d.up!==undefined){const i=+d.up; [S.ranked[i-1],S.ranked[i]]=[S.ranked[i],S.ranked[i-1]]; renderVote(); return}
  if(d.dn!==undefined){const i=+d.dn; [S.ranked[i+1],S.ranked[i]]=[S.ranked[i],S.ranked[i+1]]; renderVote(); return}
  if(d.fill==="last"){const b=S.ballots.find(x=>x.week===S.week-1&&x.voter===S.voter); if(b){S.ranked=[...b.order]; S.msg=null} renderVote(); return}
  if(d.fill==="record"){TEAMS.filter(t=>!S.ranked.includes(t.id)).sort((a,b)=>b.w-a.w||b.pf-a.pf).forEach(t=>S.ranked.push(t.id)); S.msg=null; renderVote(); return}
  if(el.id==="gonow"){S.week=CURRENT_WEEK; for(const o of weekSels()) o.value=S.week; S.lock=null; S.msg=null; preloadOwn(); render(); return}
  if(el.id==="reset"){S.ranked=[]; S.msg=null; renderVote(); return}
  if(el.id==="submit"){submit(); return}
  if(el.id==="forgetpw"){if(S.voter) store.del("wcxc.pw."+S.voter); S.pwDraft=""; renderVote(); return}
  if(el.id==="copypoll"){copyPoll(el); return}
  if(d.team){const id=+d.team; S.lock=S.lock===id?null:id; applyHighlight(); return}
});

function copyPoll(btn){
  const {bs,rows}=tally(S.week);
  const txt=`WCXC Power Poll — Week ${S.week} (${bs.length} ballot${bs.length>1?"s":""})\n`+
    rows.map((r,i)=>`${i+1}. ${r.t.name}${r.fp?` (${r.fp})`:""} — ${r.pts} pts`).join("\n");
  const done=()=>{btn.textContent="Copied"; setTimeout(()=>{btn.textContent="Copy results"},1500)};
  const legacy=()=>{
    const ta=document.createElement("textarea");
    ta.value=txt; ta.style.cssText="position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta); ta.select();
    try{document.execCommand("copy"); done()}catch(_){ btn.textContent="Copy failed" }
    ta.remove();
  };
  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(txt).then(done,legacy); else legacy();
}

/* drag to reorder the ballot (desktop); arrows do the same job on touch */
let dragFrom=null;
const clearDrag=()=>document.querySelectorAll(".slot.over,.slot.dragging").forEach(x=>x.classList.remove("over","dragging"));
main.addEventListener("dragstart",e=>{
  const s=e.target.closest(".slot[draggable]"); if(!s) return;
  dragFrom=+s.dataset.i; s.classList.add("dragging");
  e.dataTransfer.effectAllowed="move";
  try{e.dataTransfer.setData("text/plain",String(dragFrom))}catch(_){}
});
main.addEventListener("dragover",e=>{
  if(dragFrom===null) return;
  const s=e.target.closest(".slot[draggable]"); if(!s) return;
  e.preventDefault(); e.dataTransfer.dropEffect="move";
  document.querySelectorAll(".slot.over").forEach(x=>x.classList.remove("over"));
  if(+s.dataset.i!==dragFrom) s.classList.add("over");
});
main.addEventListener("drop",e=>{
  if(dragFrom===null) return;
  const s=e.target.closest(".slot[draggable]"); if(!s) return;
  e.preventDefault();
  const to=+s.dataset.i;
  if(to!==dragFrom){const [m]=S.ranked.splice(dragFrom,1); S.ranked.splice(to,0,m); S.msg=null}
  dragFrom=null; clearDrag(); renderVote();
});
main.addEventListener("dragend",()=>{dragFrom=null; clearDrag()});
main.addEventListener("input",e=>{
  if(e.target.id==="pw") S.pwDraft=e.target.value;
  if(e.target.id==="cbody"){ CM.draft=e.target.value;
    const n=e.target.closest(".compose")?.querySelector(".crow .hint"); if(n) n.textContent=(1500-CM.draft.length)+" left"; }
});
main.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="newsweek"){
    const v=e.target.value;
    S.newsWeek = v==="all"||v==="none" ? v : +v;
    renderNews();
    document.getElementById("newsweek")?.focus();    // the redraw replaced the control; keep a keyboard user where they were
    return;
  }
  if(id==="aMetric"||id==="aScope"||id==="aView"){
    S[id]=e.target.value; store.set("wcxc."+id, S[id]);
    // efficiency is only a season-level number; don't strand the user on it
    if(S.aScope!=="season" && S.aMetric==="eff"){ S.aMetric="record"; store.set("wcxc.aMetric","record") }
    S.lock=null; S.hover=null;
    renderAnalysis();
  }
});
main.addEventListener("keydown",e=>{
  if(e.target.id==="pw"&&e.key==="Enter"){e.preventDefault(); document.getElementById("submit")?.click(); return}
  const p=e.target.closest("[data-profile],[data-article]");
  if(p&&(e.key==="Enter"||e.key===" ")){e.preventDefault(); p.click(); return}
  const c=e.target.closest("[data-team]"); if(c&&(e.key==="Enter"||e.key===" ")){e.preventDefault(); c.click()}
});
main.addEventListener("mouseover",e=>{const c=e.target.closest("[data-team]"); const id=c?+c.dataset.team:null; if(id!==S.hover){S.hover=id; if(!S.lock) applyHighlight()}});
main.addEventListener("mouseleave",()=>{S.hover=null; if(!S.lock) applyHighlight()});

/* ---------- start ---------- */
(async function init(){
  S.week = CURRENT_WEEK; render();
  await Promise.all([loadSleeper(), loadNews()]);
  S.week = CURRENT_WEEK;
  buildWeekOptions();
  wk.value = S.week;
  lastWeek = CURRENT_WEEK; lastOpen = windowOpen();
  updateWeekChrome();
  setInterval(tick, 30000);   // notice the Tue open / Thu close without a reload
  /* The half-minute tick is the floor for the Casino. While an NFL game is on,
     scores move every minute, so it looks every twenty seconds: with realtime
     that is only a safety net, and without it (a dropped socket, a project that
     has not published casino_games) the board is never more than about twenty
     seconds behind the sync. */
  setInterval(()=>{ if(S.tab==="casino" && !document.hidden && csLiveNow()) loadCasino() }, 20000);
  setInterval(csTickFresh, 15000);
  /* The casino's section tabs stick just under the phone's top bar, whose height
     depends on the fonts and the notch, so it is measured rather than guessed. */
  const bar = document.querySelector(".topbar");
  if(bar){
    const fit = () => document.documentElement.style.setProperty("--tbh", bar.offsetHeight+"px");
    fit();
    if(window.ResizeObserver) new ResizeObserver(fit).observe(bar); else window.addEventListener("resize", fit);
  }
  /* A phone that slept or a laptop that was closed comes back to a page minutes
     behind, and its timers and socket may both have been suspended: catch up at
     once instead of waiting for the next tick. */
  const catchUp = () => { if(document.hidden) return; refreshBallots(); if(S.tab==="casino") loadCasino() };
  document.addEventListener("visibilitychange", catchUp);
  window.addEventListener("online", catchUp);
  if(configured && window.supabase){
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    await loadBallots(); subscribe();
    if(S.tab==="casino") loadCasino();
  } else { render(); }
})();
