name: Update playoff odds

on:
  schedule:
    # 6 AM Eastern in either season; extra runs retry a failed data fetch.
    # --daily commits only the first successful snapshot each Eastern day.
    - cron: '17 10,11,14,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-playoff-odds
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check simulation rules
        run: node --test tests/odds*.test.mjs tests/trades.test.mjs
      - uses: actions/cache@v4
        with:
          path: .odds-cache
          key: odds-history-${{ hashFiles('scripts/odds/model.mjs', 'scripts/odds/data.mjs') }}-${{ github.run_id }}
          restore-keys: |
            odds-history-${{ hashFiles('scripts/odds/model.mjs', 'scripts/odds/data.mjs') }}-
      - name: Simulate remaining season
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$MANUAL" = 'true' ]; then
            node scripts/odds/build.mjs
          else
            node scripts/odds/build.mjs --daily
          fi
      # The trade archive's grading is "points scored since the trade", so it
      # moves every time anybody plays. Finished weeks are cached, so after the
      # first build this is mostly the current week's stats.
      - uses: actions/cache@v4
        with:
          path: .trade-cache
          key: trade-data-${{ hashFiles('scripts/trades/build.mjs') }}-${{ github.run_id }}
          restore-keys: |
            trade-data-${{ hashFiles('scripts/trades/build.mjs') }}-
      - name: Rebuild the trade archive
        continue-on-error: true
        # scripts/trades/history.mjs pages GitHub's commit API for the DynastyProcess
        # price history. Unauthenticated that is 60 requests an hour per runner IP,
        # shared across every repo on it; with this token it is 5,000. Without it one
        # 403 drops every "Bought well" figure from the archive.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/trades/build.mjs
      # Player positions and NFL teams for the casino's WCXC prices and same-game simulation.
      # Sleeper's player file is ~5MB, far too much for the page to pull just to
      # read 120 positions off it, so it is reduced to a small map here. The same
      # pass writes espn.json, ESPN athlete id -> Sleeper player, for casino props.
      - name: Rebuild the position map
        continue-on-error: true
        run: node scripts/players/build.mjs
      - name: Publish daily odds
        run: |
          if git diff --quiet -- odds.json trades.json positions.json espn.json; then
            echo 'Nothing new to publish.'
            exit 0
          fi
          git config user.name 'WCXC Odds'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- odds.json trades.json positions.json espn.json
          git diff --cached --quiet -- odds.json \
            && git commit -m 'Refresh trade archive and positions' \
            || git commit -m 'Update daily playoff odds'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
